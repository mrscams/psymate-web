<div class="head">
  <div class="kicker-row">
    <h2 [id]="titleId()" tabindex="-1">{{ title }}</h2>
    <button type="button" class="close" [attr.aria-label]="closeLabel" (click)="closed.emit()">
      ×
    </button>
  </div>
  @if (count() > 0) {
    <!-- prettier-ignore -->
    <p class="count-line" role="status" i18n="Panneau des demandes en ligne, nombre de demandes en attente@@agenda.requests.count">{count(), plural, =1 {1 demande attend votre réponse.} other {{{ count() }} demandes attendent votre réponse.}}</p>
  }
</div>

@if (kind(); as kind) {
  <pm-state
    [kind]="kind"
    skeleton="row"
    [lines]="3"
    compact
    [title]="kind === 'empty' ? emptyTitle : kind === 'error' ? errorTitle : undefined"
    [message]="kind === 'empty' ? emptyMessage : kind === 'error' ? '' : undefined"
    [action]="kind === 'error' ? retry : undefined"
  />
} @else {
  <ul class="req-list">
    @for (row of rows(); track row.appointment.id) {
      <li>
        <button type="button" class="req" (click)="picked.emit(row.appointment)">
          <span class="when"
            >{{ row.date }} · <span class="mono" dir="ltr">{{ row.time }}</span></span
          >
          <span class="who"
            ><span dir="auto">{{ row.name }}</span> · {{ row.modality }}</span
          >
        </button>
      </li>
    }
  </ul>
}
