<section class="overview" aria-labelledby="overview-heading">
  <!-- Titre de l'onglet pour les lecteurs d'écran : la proposition 02 n'en dessine pas. -->
  <h2 id="overview-heading" class="sr-only" i18n="Titre de l'onglet 1 du dossier@@overview.heading">
    Vue d'ensemble
  </h2>

  @if (reloadFailed()) {
    <!-- Relecture en échec : la synthèse précédente reste affichée, le bandeau le dit. -->
    <div class="reload-failed">
      <pm-state
        kind="error"
        compact
        title="La synthèse n'a pas pu être relue"
        i18n-title="Bandeau de relecture en échec@@overview.reloadFailed.title"
        message="Les chiffres affichés sont ceux de la lecture précédente."
        i18n-message="Bandeau de relecture en échec@@overview.reloadFailed.message"
        [action]="retryAction"
      />
    </div>
  }

  <!-- Proposition 02 `.ov` : colonne de lecture et colonne latérale de 340 px, 20 px d'écart. -->
  <div class="ov">
    <div class="main">
      <pm-overview-since
        [overview]="store.overview()"
        [refreshing]="store.refreshing()"
        (retry)="refresh()"
      />
      <pm-overview-feelings
        class="sect"
        [overview]="store.overview()"
        [refreshing]="store.refreshing()"
        [showData]="showData()"
        (showDataChange)="setShowData($event)"
        (retry)="refresh()"
        (pointSelected)="openEntry($event)"
      />
      <pm-overview-noted
        class="sect"
        [overview]="store.overview()"
        [patientId]="patientId()"
        [refreshing]="store.refreshing()"
        (retry)="refresh()"
      />
      <pm-overview-sessions
        class="sect"
        [overview]="store.overview()"
        [patientId]="patientId()"
        [refreshing]="store.refreshing()"
        (retry)="refresh()"
      />
    </div>

    <!-- Colonne latérale : région nommée (pas d'aside : elle est dans le main du shell). -->
    <pm-overview-side
      class="side"
      role="region"
      aria-label="Cadre du suivi"
      i18n-aria-label="Colonne latérale de la vue d'ensemble@@overview.side.label"
      [overview]="store.overview()"
      [patientId]="patientId()"
      [patient]="shell.patient()"
      [headerSince]="shell.followedSince()"
      [refreshing]="store.refreshing()"
      (retry)="refresh()"
    />
  </div>
</section>
