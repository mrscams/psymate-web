@if (finalError(); as error) {
  <section class="shell-error" aria-labelledby="shell-error-heading">
    <h1
      id="shell-error-heading"
      class="sr-only"
      i18n="Titre caché du dossier en erreur@@patientShell.error.heading"
    >
      Dossier patient
    </h1>
    <pm-state kind="error" [title]="error.title" [message]="error.message" />
    <a
      class="back"
      routerLink="/patients"
      i18n="Lien de retour depuis un dossier en erreur@@patientShell.error.back"
      >Retour à la liste</a
    >
  </section>
} @else {
  <pm-patient-header
    [patient]="headerPatient()"
    [session]="headerSession()"
    [unclosedAfterMin]="unclosedAfterMin"
    [state]="headerState()"
    [busy]="store.busy()"
    [showViewToggle]="activeTab() === 'overview'"
    (startSession)="start()"
    (closeSession)="openClose()"
    (retry)="reload()"
  >
    <!-- Barre de commande (M6-02, features/capture) : Entrée crée, Ctrl+Entrée ouvre l'éditeur
         prérempli (M1-08, features/entries) ; le bouton + ouvre l'éditeur vide. -->
    <div pmCapture class="capture-row">
      <pm-command-bar
        class="capture-bar"
        [patientId]="id()"
        [session]="headerSession()"
        [revision]="store.revision()"
        (saved)="captured($event)"
        (openEditor)="newEntry($event)"
      />
      <button
        type="button"
        class="new-entry"
        aria-label="Nouvelle entrée (N)"
        i18n-aria-label="Bouton plus de l'en-tête patient@@patientShell.newEntry"
        aria-keyshortcuts="N"
        (click)="newEntry()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>
    <!-- Bascule « Vue : Simple · Complète » (features/overview, M4-05) : visible sur l'onglet 1. -->
    <pm-overview-view-toggle pmViewToggle />
  </pm-patient-header>
  @if (store.patient() && store.firstEntry() === 'pending') {
    <!-- Parcours guidé (M7-03) : dossier sans entrée saisie, lu sur le résumé de la chronologie. -->
    <div class="first-entry" role="status">
      <p>
        <strong i18n="Indice de première entrée, titre@@patientShell.firstEntry.title"
          >Dernière étape : notez la première entrée.</strong
        >
        <span i18n="Indice de première entrée, explication@@patientShell.firstEntry.text"
          >Elle se rattache à la séance d'accueil du dossier, ou à la séance que vous
          démarrez.</span
        >
      </p>
      <button
        type="button"
        class="first-entry-action"
        aria-keyshortcuts="N"
        [attr.aria-busy]="preparingFirstEntry()"
        (click)="firstEntry()"
      >
        <span i18n="Bouton de l'indice de première entrée@@patientShell.firstEntry.action"
          >Nouvelle entrée</span
        >
        <kbd aria-hidden="true">N</kbd>
      </button>
    </div>
  }
  @if (store.patient()) {
    <!-- Timeline (UX-G2c) : surface de travail pleine hauteur, marge haute resserrée. -->
    <div class="tab-content" [class.dense]="activeTab() === 'timeline'">
      <router-outlet />
    </div>
  }
}
