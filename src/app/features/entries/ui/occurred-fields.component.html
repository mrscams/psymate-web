<fieldset class="when" [formGroup]="group()" [attr.aria-describedby]="fid('occurred') + '-error'">
  <legend i18n="Bloc du moment d'une entrée@@entries.when.legend">Quand</legend>
  <div class="bar">
    <button
      type="button"
      class="toggle now"
      [attr.aria-pressed]="now()"
      (click)="setNow()"
      i18n="Bouton du moment présent@@entries.when.now"
    >
      Maintenant
    </button>
    <div
      class="precisions"
      role="group"
      aria-label="Précision"
      i18n-aria-label="Groupe des précisions de date@@entries.when.precision"
    >
      @for (item of precisions; track item) {
        <button
          type="button"
          class="toggle"
          [attr.aria-pressed]="!now() && precision() === item"
          (click)="choose(item)"
        >
          {{ labelOf(item) }}
        </button>
      }
    </div>
  </div>

  @if (!now()) {
    @if (precision() === 'life_phase') {
      <div class="field">
        <label
          [for]="fid('occurred.label')"
          i18n="Libellé d'une phase de vie@@entries.when.lifePhase"
          >Phase de vie</label
        >
        <input
          [id]="fid('occurred.label')"
          type="text"
          formControlName="label"
          placeholder="enfance, adolescence…"
          i18n-placeholder="Exemples de phases de vie@@entries.when.lifePhaseHint"
          [attr.aria-invalid]="invalid('label')"
          [attr.aria-describedby]="fid('occurred.label') + '-error'"
        />
        <pm-field-errors
          [control]="group().controls.label"
          [id]="fid('occurred.label') + '-error'"
        />
      </div>
    } @else {
      <div class="dates">
        <div class="field">
          <label [for]="fid('occurred.from')">
            @if (precision() === 'period' || situation()) {
              <ng-container i18n="Début d'une période ou d'une situation@@entries.when.start"
                >Début</ng-container
              >
            } @else {
              <ng-container i18n="Date d'une entrée@@entries.when.date">Date</ng-container>
            }
          </label>
          <input
            class="mono"
            [id]="fid('occurred.from')"
            [type]="inputType()"
            [attr.inputmode]="precision() === 'year' ? 'numeric' : null"
            [attr.maxlength]="precision() === 'year' ? 4 : null"
            formControlName="from"
            [attr.aria-invalid]="invalid('from')"
            [attr.aria-describedby]="fid('occurred.from') + '-error'"
          />
          <pm-field-errors
            [control]="group().controls.from"
            [id]="fid('occurred.from') + '-error'"
          />
        </div>
        @if (precision() === 'period') {
          <div class="field">
            <label [for]="fid('occurred.to')" i18n="Fin d'une période@@entries.when.end">Fin</label>
            <input
              class="mono"
              [id]="fid('occurred.to')"
              type="date"
              formControlName="to"
              [attr.aria-invalid]="invalid('to')"
              [attr.aria-describedby]="fid('occurred.to') + '-error'"
            />
            <pm-field-errors [control]="group().controls.to" [id]="fid('occurred.to') + '-error'" />
          </div>
        }
      </div>
      @if (precision() === 'period') {
        <div class="field">
          <label
            [for]="fid('occurred.label')"
            i18n="Libellé d'une période@@entries.when.periodLabel"
            >Libellé de la période</label
          >
          <input
            [id]="fid('occurred.label')"
            type="text"
            formControlName="label"
            [attr.aria-invalid]="invalid('label')"
            [attr.aria-describedby]="fid('occurred.label') + '-error'"
          />
          <pm-field-errors
            [control]="group().controls.label"
            [id]="fid('occurred.label') + '-error'"
          />
        </div>
      }
    }
  }

  @if (situation() && precision() !== 'period' && precision() !== 'life_phase') {
    <div class="ongoing">
      <label class="check">
        <input type="checkbox" formControlName="ongoing" />
        <span i18n="Situation sans fin@@entries.when.ongoing">En cours</span>
      </label>
      @if (!ongoing()) {
        <div class="field">
          <label [for]="fid('occurred.to')" i18n="Fin d'une situation@@entries.when.situationEnd"
            >Fin</label
          >
          <input
            class="mono"
            [id]="fid('occurred.to')"
            [type]="now() ? 'datetime-local' : inputType()"
            formControlName="to"
            [attr.aria-invalid]="invalid('to')"
            [attr.aria-describedby]="fid('occurred.to') + '-error'"
          />
          <pm-field-errors [control]="group().controls.to" [id]="fid('occurred.to') + '-error'" />
        </div>
      }
    </div>
  }
  <pm-field-errors [control]="group()" [id]="fid('occurred') + '-error'" [force]="true" />
</fieldset>
