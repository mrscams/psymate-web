<div class="quick" role="search">
  <div class="field" data-focus-ring="container">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <circle cx="7" cy="7" r="4.5" />
      <path d="M10.5 10.5 14 14" />
    </svg>
    <label for="patients-filter" class="sr-only">{{ filterLabel() }}</label>
    <input
      #filter
      id="patients-filter"
      type="search"
      autocomplete="off"
      [placeholder]="placeholder"
      [value]="query()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      aria-describedby="patients-filter-hint"
    />
    <kbd aria-hidden="true">/</kbd>
    <span
      id="patients-filter-hint"
      class="sr-only"
      i18n="Aide du filtre de la liste@@patients.filter.hint"
      >Accents et majuscules ignorés, à partir de 2 caractères ; « #tag » filtre par tag.</span
    >
  </div>

  <div
    class="seg"
    role="group"
    aria-label="Filtres rapides"
    i18n-aria-label="Étiquette des filtres rapides de la liste@@patients.quick.label"
  >
    @for (chip of chips(); track chip.value) {
      <button
        type="button"
        [class]="'q-' + chip.value"
        [attr.aria-pressed]="chip.pressed"
        (click)="quickChange.emit(chip.value)"
      >
        {{ chip.label }}
      </button>
    }
  </div>

  <span class="spacer"></span>

  <div class="sort">
    <label for="patients-sort" i18n="Étiquette du tri de la liste@@patients.sort.label"
      >Trier par</label
    >
    <select id="patients-sort" [value]="sort()" (change)="onSort($event)">
      @for (option of sorts; track option.value) {
        <option [value]="option.value" [selected]="option.value === sort()">
          {{ option.label }}
        </option>
      }
    </select>
  </div>
</div>
