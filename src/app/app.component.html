<header class="app-header">
  <span class="brand" i18n="Nom du produit@@app.brand">PsyMate</span>
  <div class="header-actions">
    <nav
      aria-label="Langue"
      i18n-aria-label="Étiquette de la navigation de langue@@app.localeNav.label"
    >
      <a
        class="locale-switch"
        [href]="switchHref()"
        [attr.hreflang]="other"
        [attr.lang]="other"
        i18n="Lien vers l'autre langue, écrit dans cette autre langue@@app.localeSwitch"
        >English</a
      >
    </nav>
    @if (session.authenticated()) {
      <!-- Provisoire (M0-07) : le menu de l'avatar de la barre d'application (M0-09) le remplace. -->
      <button
        mat-stroked-button
        type="button"
        class="logout"
        (click)="logout()"
        i18n="Bouton de déconnexion provisoire@@app.logout"
      >
        Se déconnecter
      </button>
    }
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
