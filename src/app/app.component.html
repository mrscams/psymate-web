@switch (layout()) {
  @case ('public') {
    <pm-public-layout
      [authenticated]="session.authenticated()"
      [narrow]="true"
      [switchHref]="switchHref()"
      [switchLang]="other"
    >
      <pm-network-banner />
      <router-outlet />
    </pm-public-layout>
  }
  @case ('admin') {
    <pm-admin-bar [user]="user()" (logout)="logout()" />
    <pm-network-banner />
    <main id="main" class="app-main admin">
      <router-outlet />
    </main>
  }
  @case ('bare') {
    <pm-network-banner />
    <router-outlet />
  }
  @default {
    <pm-app-bar
      [user]="user()"
      [switchHref]="switchHref()"
      [switchLang]="other"
      (logout)="logout()"
    />
    @if (session.authenticated()) {
      <pm-verification-banner [status]="session.verificationStatus()" />
    }
    <pm-network-banner />
    <main id="main" class="app-main">
      <router-outlet />
    </main>
  }
}
<pm-toast-outlet />
