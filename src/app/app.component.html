@switch (layout()) {
  @case ('public') {
    <pm-public-layout
      [authenticated]="session.authenticated()"
      [narrow]="narrow()"
      [wide]="contentWidth() === 'wide'"
      [switchHref]="switchHref()"
      [switchLang]="other"
    >
      <pm-network-banner />
      <router-outlet />
    </pm-public-layout>
  }
  @case ('admin') {
    <pm-admin-bar [user]="user()" (logout)="logout()" />
    <pm-network-banner />
    <main id="main" class="app-main admin" [class.wide]="contentWidth() === 'wide'">
      <router-outlet />
    </main>
  }
  @case ('bare') {
    <pm-network-banner />
    <router-outlet />
  }
  @default {
    <pm-app-bar
      [user]="user()"
      [switchHref]="switchHref()"
      [switchLang]="other"
      [query]="searchBar.query()"
      [searchPlaceholder]="searchBar.placeholder()"
      (queryChange)="searchBar.input($event)"
      (searchSubmit)="searchBar.submit($event)"
      (logout)="logout()"
    />
    @if (session.authenticated()) {
      <pm-verification-banner [status]="session.verificationStatus()" />
    }
    <pm-network-banner />
    <main id="main" class="app-main" [class.wide]="contentWidth() === 'wide'">
      <router-outlet />
    </main>
    <pm-shortcuts-help />
  }
}
<pm-toast-outlet />
