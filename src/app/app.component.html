@if (navigated()) {
  @switch (layout()) {
    @case ('public') {
      <pm-public-header
        [authenticated]="session.authenticated()"
        [switchHref]="switchHref()"
        [switchLang]="other"
      />
    }
    @case ('admin') {
      <pm-admin-bar [user]="user()" (logout)="logout()" />
      <pm-network-banner />
    }
    @case ('bare') {
      <pm-network-banner />
    }
    @default {
      <pm-app-bar
        [user]="user()"
        [switchHref]="switchHref()"
        [switchLang]="other"
        [query]="searchBar.query()"
        [searchPlaceholder]="searchBar.placeholder()"
        [navigation]="true"
        [navigationOpen]="navDrawer.isOpen()"
        (queryChange)="searchBar.input($event)"
        (searchSubmit)="searchBar.submit($event)"
        (logout)="logout()"
        (navigationToggle)="navDrawer.toggle()"
      />
      <pm-nav-rail class="app-rail" (drawerRequested)="navDrawer.toggle()" />
      @if (session.authenticated()) {
        <pm-verification-banner [status]="session.verificationStatus()" />
      }
      <pm-network-banner />
    }
  }
  <main
    id="main"
    [class.app-main]="layout() === 'practitioner' || layout() === 'admin'"
    [class.admin]="layout() === 'admin'"
    [class.public-main]="layout() === 'public'"
    [class.narrow]="layout() === 'public' && narrow()"
    [class.wide]="layout() !== 'bare' && contentWidth() === 'wide'"
    [class.full]="layout() === 'practitioner' && contentWidth() === 'full'"
  >
    @if (layout() === 'public') {
      <pm-network-banner />
    }
    <router-outlet />
  </main>
  @if (layout() === 'public') {
    <pm-public-footer />
  } @else if (layout() === 'practitioner') {
    <pm-shortcuts-help />
  }
}
<pm-toast-outlet />
