<h2 mat-dialog-title class="title" dir="auto">{{ options.title }}</h2>
<mat-dialog-content>
  @if (options.description) {
    <p class="description" dir="auto">{{ options.description }}</p>
  }
  @if (options.confirmWord) {
    <!-- Nom retapé dans son sens (dir="auto", Q77). placeholder=" " : vide, le champ prend le sens
         de la page (src/theme/arabic.scss, docs/design/arabe.md §5) ; rien de visible. -->
    <mat-form-field class="word" appearance="outline">
      <mat-label>{{ wordLabel }}</mat-label>
      <input
        matInput
        type="text"
        dir="auto"
        placeholder=" "
        autocomplete="off"
        cdkFocusInitial
        [ngModel]="typed()"
        (ngModelChange)="typed.set($event)"
        (keydown.enter)="confirm()"
      />
    </mat-form-field>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" class="cancel" (click)="cancel()">
    {{ cancelLabel }}
  </button>
  <button
    mat-flat-button
    type="button"
    class="confirm"
    [class.danger]="options.destructive"
    [disabled]="!canConfirm()"
    (click)="confirm()"
  >
    {{ confirmLabel }}
  </button>
</mat-dialog-actions>
