          format: uuid
          type: string
        suspendedAt:
          format: date-time
          type: string
        verificationStatus:
          type: string
      type: object
    TagDto:
      properties:
        id:
          format: uuid
          type: string
        label:
          type: string
      type: object
    TagRequest:
      properties:
        label:
          type: string
      type: object
    TagView:
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        label:
          type: string
        normalizedLabel:
          type: string
        usageCount:
          format: int32
          type: integer
      type: object
    TagsRequest:
      properties:
        tags:
          items:
            type: string
          type: array
      type: object
    TimelineEmotionDto:
      properties:
        code:
          type: string
        family:
          type: string
      type: object
    TimelineFacetsDto:
      properties:
        emotions:
          additionalProperties:
            format: int32
            type: integer
          type: object
        tags:
          additionalProperties:
            format: int32
            type: integer
          type: object
        types:
          additionalProperties:
            format: int32
            type: integer
          type: object
      type: object
    TimelineItemDto:
      properties:
        authorType:
          type: string
        emotion:
          $ref: '#/components/schemas/TimelineEmotionDto'
        id:
          format: uuid
          type: string
        intensity:
          format: int32
          type: integer
        linkCount:
          format: int32
          type: integer
        occurred:
          $ref: '#/components/schemas/EntryOccurredDto'
        ongoing:
          type: boolean
        recordedAt:
          format: date-time
          type: string
        sessionId:
          format: uuid
          type: string
        status:
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          type: string
        type:
          type: string
        visibility:
          type: string
      type: object
    TimelinePageDto:
      properties:
        facets:
          $ref: '#/components/schemas/TimelineFacetsDto'
        items:
          items:
            $ref: '#/components/schemas/TimelineItemDto'
          type: array
        nextCursor:
          type: string
        ongoingSituations:
          items:
            $ref: '#/components/schemas/TimelineItemDto'
          type: array
      type: object
    TimelinePeriodDto:
      properties:
        averageIntensity:
          format: double
          type: number
        counts:
          additionalProperties:
            format: int32
            type: integer
          type: object
        feelingCount:
          format: int32
          type: integer
        from:
          format: date-time
          type: string
        period:
          type: string
      type: object
    TimelineSummaryDto:
      properties:
        granularity:
          type: string
        periods:
          items:
            $ref: '#/components/schemas/TimelinePeriodDto'
          type: array
      type: object
    TopEmotionDto:
      description: Émotion dominante et variation par rapport à la fenêtre précédente
      properties:
        code:
          type: string
        count:
          description: Nombre de ressentis dans la fenêtre
          format: int32
          type: integer
        delta:
          description: count moins previousCount
          format: int32
          type: integer
        label:
          type: string
        previousCount:
          description: Nombre dans la fenêtre précédente de même longueur
          format: int32
          type: integer
      type: object
    TrendDto:
      description: Courbe d'intensité et repères de la fenêtre
      properties:
        markers:
          items:
            $ref: '#/components/schemas/TrendMarkerDto'
          type: array
        points:
          items:
            $ref: '#/components/schemas/TrendPointDto'
          type: array
      type: object
    TrendMarkerDto:
      description: 'Repère sur la courbe : séance ou changement de médicament'
      properties:
        change:
          description: start ou end pour un médicament, null pour une séance
          type: string
        date:
          format: date
          type: string
        entryId:
          format: uuid
          type: string
        kind:
          description: session ou medication
          type: string
        label:
          description: Titre de la séance (null sans titre) ou « molécule dosage »
          type: string
        sessionKind:
          description: intake, session ou contact pour une séance, null pour un médicament
          type: string
      type: object
    TrendPointDto:
      description: 'Point de la courbe : moyenne glissante sur 7 jours à cette date'
      properties:
        averageIntensity:
          description: Intensité moyenne (0 à 10) des ressentis des 7 derniers jours, null si aucun
          format: double
          type: number
        date:
          format: date
          type: string
        valence:
          description: Valence moyenne (-2 à 2) des valences connues, null sinon
          format: double
          type: number
      type: object
    TwoFactorDisableRequest:
      properties:
        code:
          maxLength: 32
          minLength: 0
          type: string
        password:
          maxLength: 200
          minLength: 0
          type: string
      required:
      - code
      - password
      type: object
    TwoFactorVerifyRequest:
      properties:
        code:
          maxLength: 32
          minLength: 0
          type: string
      required:
      - code
      type: object
    UpdateProfileRequest:
      properties:
        address:
          type: string
        audiences:
          items:
            type: string
          type: array
        availability:
          type: string
        bio:
          type: string
        city:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        country:
          type: string
        displayName:
          type: string
        fees:
          type: string
        languages:
          items:
            type: string
          type: array
        modalities:
          items:
            type: string
          type: array
        nextSlotAt:
          format: date
          type: string
        postalCode:
          type: string
        responseDelay:
          type: string
        showAddress:
          type: boolean
        showEmail:
          type: boolean
        showPhone:
          type: boolean
        showProfessionalNumber:
          type: boolean
        specialties:
          items:
            type: string
          type: array
        titleLabel:
          type: string
        websiteUrl:
          type: string
      type: object
    VerificationDto:
      properties:
        decisions:
          items:
            $ref: '#/components/schemas/DecisionDto'
          type: array
        documents:
          items:
            $ref: '#/components/schemas/DocumentDto'
          type: array
        missing:
          items:
            type: string
          type: array
        profession:
          type: string
        professionalInfo:
          $ref: '#/components/schemas/ProfessionalInfoDto'
        recommended:
          items:
            type: string
          type: array
        status:
          type: string
        submittedAt:
          format: date-time
          type: string
      type: object
    VersionDto:
      properties:
        authorId:
          format: uuid
          type: string
        createdAt:
          format: date-time
          type: string
        reason:
          type: string
        snapshot:
          additionalProperties: {}
          type: object
        version:
          format: int32
          type: integer
      type: object
info:
  description: API de PsyMate, suivi clinique pour psychologues, psychiatres et coachs.
  title: PsyMate API
  version: 0.6.0
openapi: 3.1.0
paths:
  /api/admin/appeals:
    get:
      operationId: listAdminAppeals
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AppealListDto'
          description: OK
      summary: Recours (status open par défaut, decided ou all), pagination par curseur ; les plus anciens d'abord pour open
      tags:
      - appeal-controller
  /api/admin/appeals/{id}/decision:
    post:
      operationId: decideAdminAppeal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealDecisionRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AppealItemDto'
          description: OK
      summary: Accepte ou rejette un recours (accepted réactive le compte) ; l'administrateur doit différer de l'auteur de la décision contestée
      tags:
      - appeal-controller
  /api/admin/journal:
    get:
      operationId: listAdminJournal
      parameters:
      - in: query
        name: kind
        required: false
        schema:
          type: string
      - in: query
        name: practitionerId
        required: false
        schema:
          type: string
      - in: query
        name: actorId
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JournalDto'
          description: OK
      summary: Journal d'administration (décisions et événements, plus récents d'abord), pagination par curseur ; jamais d'adresse IP
      tags:
      - admin-journal-controller
  /api/admin/practitioners:
    get:
      operationId: listAdminPractitioners
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: role
        required: false
        schema:
          type: string
      - in: query
        name: profession
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountListDto'
          description: OK
      summary: Comptes des praticiens (recherche q, filtres status, role, profession), pagination par curseur, compteurs par statut
      tags:
      - admin-practitioner-controller
  /api/admin/practitioners/{id}:
    get:
      operationId: getAdminPractitioner
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountDetailDto'
          description: OK
      summary: 'Compte d''un praticien : état, décisions et recours'
      tags:
      - admin-practitioner-controller
  /api/admin/practitioners/{id}/reactivate:
    post:
      operationId: reactivateAdminPractitioner
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReactivateDto'
          description: OK
      summary: Réactive un compte suspendu ou refusé (motif d'au moins 20 caractères)
      tags:
      - admin-practitioner-controller
  /api/admin/practitioners/{id}/suspend:
    post:
      operationId: suspendAdminPractitioner
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuspendDto'
          description: OK
      summary: 'Suspend un compte (motif d''au moins 20 caractères) : sessions révoquées, e-mail au praticien, fiche publique dépubliée'
      tags:
      - admin-practitioner-controller
  /api/admin/verifications:
    get:
      operationId: listAdminVerifications
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: sort
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueueDto'
          description: OK
      summary: File des dossiers à vérifier (under_review ou needs_more), pagination par curseur
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}:
    get:
      operationId: getAdminVerification
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DossierDto'
          description: OK
      summary: 'Dossier d''un praticien : identité, coordonnées, justificatifs, décisions'
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}/decision:
    post:
      operationId: decideAdminVerification
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DecisionDto'
          description: OK
      summary: Approuve, demande un complément ou refuse (décision append-only)
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}/documents/{docId}:
    patch:
      operationId: reviewAdminDocument
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: docId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentDto'
          description: OK
      summary: Qualifie un justificatif (pending, conform, non_conform)
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}/documents/{docId}/file:
    get:
      operationId: getAdminDocumentFile
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: docId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: exp
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: sig
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                format: byte
                type: string
          description: OK
      summary: Sert le justificatif déchiffré (URL signée) et consigne l'accès
      tags:
      - admin-verification-controller
  /api/admin/verifications/{practitionerId}/documents/{docId}/url:
    get:
      operationId: getAdminDocumentUrl
      parameters:
      - in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: docId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SignedUrlDto'
          description: OK
      summary: URL signée de 5 minutes pour ouvrir un justificatif
      tags:
      - admin-verification-controller
  /api/admin/vocabulary/directory:
    get:
      operationId: listAdminDirectoryVocabulary
      parameters:
      - in: query
        name: kind
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListDto'
          description: OK
      summary: Spécialités et publics de l'annuaire, actifs ou non, avec le nombre de fiches publiées qui les utilisent
      tags:
      - directory-vocabulary-admin-controller
    post:
      operationId: createAdminDirectoryVocabulary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ItemDto'
          description: OK
      summary: Ajoute une spécialité ou un public (409 VOCABULARY_EXISTS si le code existe)
      tags:
      - directory-vocabulary-admin-controller
  /api/admin/vocabulary/directory/{kind}/{code}:
    patch:
      operationId: updateAdminDirectoryVocabulary
      parameters:
      - in: path
        name: kind
        required: true
        schema:
          type: string
      - in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ItemDto'
          description: OK
      summary: Modifie libellés, rang ou activation (409 VOCABULARY_IN_USE pour désactiver un code utilisé par une fiche publiée)
      tags:
      - directory-vocabulary-admin-controller
  /api/auth/email/change:
    post:
      operationId: changeEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      responses:
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Verrouillage e-mail + IP après 5 mots de passe faux
          headers:
            Retry-After:
              description: Secondes avant nouvel essai
              style: simple
      summary: 'Corrige l''adresse d''un compte non confirmé (public : e-mail + mot de passe, 202 dans tous les cas)'
      tags:
      - auth-controller
  /api/auth/email/confirm:
    post:
      operationId: confirmEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmRequest'
        required: true
      responses:
        '200':
          description: OK
      summary: Confirme l'adresse e-mail et ouvre une session
      tags:
      - auth-controller
  /api/auth/email/resend:
    post:
      operationId: resendEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailResendRequest'
        required: true
      responses:
        '200':
          description: OK
      summary: Renvoie l'e-mail de confirmation (202 dans tous les cas)
      tags:
      - auth-controller
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: OK
        '202':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OtpRequiredResponse'
          description: Accepted
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Identifiants incorrects (message unique) ou code 2FA faux
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: EMAIL_NOT_CONFIRMED, ACCOUNT_SUSPENDED ou PASSWORD_CHANGE_REQUIRED
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Verrouillage après 5 échecs (15 min)
          headers:
            Retry-After:
              description: Secondes avant nouvel essai
              style: simple
      summary: 'Connexion : 200 session, 202 code 2FA requis, 401, 403, 423 (Retry-After)'
      tags:
      - auth-controller
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: OK
      tags:
      - auth-controller
  /api/auth/me:
    get:
      operationId: me
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: OK
      tags:
      - auth-controller
  /api/auth/password-reset/confirm:
    post:
      operationId: confirmReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          description: OK
      tags:
      - auth-controller
  /api/auth/password-reset/request:
    post:
      operationId: requestReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          description: OK
      tags:
      - auth-controller
  /api/auth/password/change:
    post:
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '202':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OtpRequiredResponse'
          description: Mot de passe actuel correct, 2FA active et code manquant
        '204':
          description: Mot de passe changé, sessions révoquées
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Identifiants incorrects (message unique) ou code 2FA faux
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: EMAIL_NOT_CONFIRMED ou ACCOUNT_SUSPENDED
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: PASSWORD_POLICY, ou PASSWORD_UNCHANGED (champ newPassword)
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Verrouillage après 5 échecs (15 min)
          headers:
            Retry-After:
              description: Secondes avant nouvel essai
              style: simple
      summary: 'Change le mot de passe (public : e-mail + mot de passe actuel) : 204, 202 code 2FA requis, 401, 403, 422, 423. Révoque toutes les sessions.'
      tags:
      - auth-controller
  /api/auth/register:
    post:
      operationId: register
      parameters:
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: OK
      summary: Inscription d'un praticien (ouverte, sans code d'invitation)
      tags:
      - auth-controller
  /api/auth/session:
    get:
      operationId: session
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
      summary: État courant de la session (statut de vérification à jour)
      tags:
