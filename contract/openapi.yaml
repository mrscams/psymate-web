      - Patients
  /api/patients/{id}/entries:
    post:
      description: 'Session praticien, propriétaire du patient. L''entrée appartient à une séance : sessionId explicite, sinon la séance courante du patient (SESSION_REQUIRED s''il n''en a aucune). Un corps de type session démarre une séance (une seule ouverte à la fois). Les liens demandés (links, 20 au plus) sont posés dans la même transaction, tout ou rien. authorType et submissionId sont en lecture seule (UNKNOWN_FIELD). Réponse 201 avec Location et liens posés dans links.'
      operationId: createEntry
      parameters:
      - description: Identifiant du patient.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntryDto'
          description: Entrée créée ; en-tête Location = /api/entries/{id} de la nouvelle entrée.
          headers:
            Location:
              description: URL de l'entrée créée, /api/entries/{id}.
              schema:
                type: string
              style: simple
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : identifiant du patient qui n''est pas un UUID, ou corps JSON illisible.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : le patient (ou l''entrée cible d''un lien) appartient à un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : patient inexistant.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'SESSION_ALREADY_OPEN : type session demandé alors qu''une séance est déjà ouverte pour ce patient.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message}, un par champ. Codes : REQUIRED, OUT_OF_RANGE (intensité hors 0 à 10, plus de 20 liens), INVALID_VALUE (session.modality, type, status, visibility, occurred.precision, links[i].direction), INVALID_FORMAT (date ou UUID illisible), INVALID_TIME (occurred.to avant occurred.from), UNKNOWN_EMOTION (feeling.emotionCode), UNKNOWN_TAG (tags[i]), UNKNOWN_FIELD (authorType ou submissionId envoyé), DETAIL_NOT_ALLOWED (feeling, medication ou session d''un autre type), NOT_ALLOWED_ON_CREATE (title, body, tags, links, session.durationMin sur une séance), SESSION_NOT_ALLOWED (sessionId sur une séance). Liens refusés (champ links[i].linkType ou links[i].targetId, allowedLinkTypes = liste de codes de type, ex. ["caused_by","co_occurs"], pour LINK_TYPE_NOT_ALLOWED) : ENTRY_NOT_FOUND, SELF_LINK, DIFFERENT_PATIENT, UNKNOWN_LINK_TYPE, LINK_TYPE_NOT_ALLOWED, LINK_EXISTS, ENTRY_ARCHIVED. Codes portés par le code racine, errors[0].field renseigné : SESSION_REQUIRED et SESSION_INVALID (sessionId), INVALID_TIME (occurred : période sans libellé ou sans fin, phase de vie inconnue ou patient sans date de naissance).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Crée une entrée clinique dans le dossier du patient
      tags:
      - Entrées
  /api/patients/{id}/export:
    get:
      description: 'Session praticien, propriétaire du patient. Le fichier est généré à la volée et renvoyé en pièce jointe (Content-Disposition attachment, nom export-nom-AAAAMMJJ.md ou .pdf). Il contient les séances et les entrées en ordre chronologique, avec le texte de leur version courante. Les entrées privées et archivées n''en sortent jamais, et un lien vers une entrée non exportée est omis. Langue du document : Accept-Language (français par défaut). Le PDF est au thème clair. Aucune pagination.'
      operationId: exportPatient
      parameters:
      - description: Identifiant du patient.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Format du fichier : md (Markdown, text/markdown) ou pdf (application/pdf). Obligatoire ; la casse est ignorée.'
        example: pdf
        in: query
        name: format
        required: false
        schema:
          enum:
          - md
          - pdf
          type: string
      responses:
        '200':
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            text/markdown:
              schema:
                type: string
          description: 'Fichier en pièce jointe : text/markdown (md) ou application/pdf (pdf).'
          headers:
            Content-Disposition:
              description: attachment avec le nom du fichier, export-nom-AAAAMMJJ.md ou .pdf (nom du patient sans accents, en minuscules).
              schema:
                type: string
              style: simple
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : patient inexistant.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] : format INVALID_VALUE (paramètre absent, vide ou différent de md et pdf). La propriété du patient est vérifiée avant le format.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EXPORT_FAILED : génération du PDF impossible.'
      summary: Exporte le dossier du patient en Markdown ou en PDF
      tags:
      - Export patient
  /api/patients/{id}/flags:
