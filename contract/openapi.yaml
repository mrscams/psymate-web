      operationId: removeLink
      parameters:
      - description: Identifiant du lien à supprimer.
        example: 5d2f7a10-8c4b-4e6a-b1d3-7f9e0a2c4b68
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Lien supprimé (ou déjà inactif).
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : le lien appartient à un patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'LINK_NOT_FOUND : lien inexistant.'
        '429':
