  /api/patients/{id}/timeline:
    get:
      description: 'Session praticien, propriétaire du patient. Entrées non archivées dont le début d''occurrence est dans [from, to[, de la plus récente à la plus ancienne. Brouillons inclus (draftsOnly=true pour eux seuls) ; entrées privées exclues sauf includePrivate=true. Dans une même liste de filtres (types, emotions, tags), un élément doit correspondre à l''une des valeurs ; les trois filtres se cumulent. Les facettes portent sur toute la fenêtre filtrée ; ongoingSituations liste les situations, terminées ou non, dont la plage chevauche la fenêtre (ongoing = true pour celles sans fin ; seuls les filtres de brouillon et de visibilité s''y appliquent). Curseur opaque : renvoyer nextCursor dans cursor, nextCursor null sur la dernière page. limit : 1 à 200, 50 par défaut.'
      operationId: getTimeline
      parameters:
      - description: Identifiant du patient.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Début de la fenêtre, inclus, sur le début d''occurrence : date-heure ISO 8601 UTC. Absent : sans borne.'
        example: 2026-01-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
      - description: 'Fin de la fenêtre, exclue, sur le début d''occurrence : date-heure ISO 8601 UTC. Ne doit pas précéder from. Absent : sans borne.'
        example: 2026-11-01T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
      - description: 'Types à garder : note, event, situation, feeling, session, medication. Valeurs séparées par des virgules ou paramètre répété. Absent : tous les types.'
        example: feeling,event
        in: query
        name: types
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Codes d''émotion à garder : seuls les ressentis de ces émotions sont renvoyés, les autres types sont exclus tant que ce filtre est donné. Valeurs séparées par des virgules ou paramètre répété. Absent : sans filtre.'
        example: anxiety,sadness
        in: query
        name: emotions
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Libellés de tags à garder. Valeurs séparées par des virgules ou paramètre répété. Un libellé inconnu ne correspond à rien. Absent : sans filtre.'
        example: travail,famille
        in: query
        name: tags
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Vrai pour ne garder que les brouillons. Défaut : faux (brouillons inclus).'
        example: false
        in: query
        name: draftsOnly
        required: false
        schema:
          default: false
          type: boolean
      - description: 'Vrai pour inclure les entrées privées. Défaut : faux (exclues).'
        example: false
        in: query
        name: includePrivate
        required: false
        schema:
          default: false
          type: boolean
      - description: 'Curseur opaque de la page suivante, tel que renvoyé dans nextCursor. Absent : première page.'
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 'Nombre maximal d''éléments par page, de 1 à 200. Défaut : 50.'
        example: 50
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TimelinePageDto'
          description: Page de chronologie avec facettes.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : identifiant du patient qui n''est pas un UUID.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : patient inexistant.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message}, une erreur par paramètre fautif : limit OUT_OF_RANGE (hors 1 à 200) ; from INVALID_TIME (from après to) ; types INVALID_VALUE (type inconnu) ; cursor INVALID_VALUE (curseur illisible) ; from, to, limit, draftsOnly, includePrivate INVALID_FORMAT (valeur illisible).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Liste la chronologie du patient par fenêtre de dates et curseur
      tags:
      - Chronologie
  /api/patients/{id}/timeline/summary:
    get:
      description: 'Session praticien, propriétaire du patient. Pour chaque période UTC non vide : nombre d''entrées par type, nombre de ressentis et intensité moyenne. Entrées non archivées dont le début d''occurrence est dans [from, to[, brouillons inclus, entrées privées exclues sauf includePrivate=true. Calculé à la volée, sans pagination, de la période la plus ancienne à la plus récente.'
      operationId: getTimelineSummary
      parameters:
      - description: Identifiant du patient.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Granularité du résumé : month (un groupe par mois) ou year (par année). Obligatoire, en minuscules.'
        example: month
        in: query
        name: granularity
        required: false
        schema:
          enum:
          - month
          - year
          type: string
      - description: 'Début de la fenêtre, inclus, sur le début d''occurrence : date-heure ISO 8601 UTC. Absent : sans borne.'
        example: 2026-01-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
      - description: 'Fin de la fenêtre, exclue, sur le début d''occurrence : date-heure ISO 8601 UTC. Ne doit pas précéder from. Absent : sans borne.'
        example: 2026-11-01T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
      - description: 'Vrai pour inclure les entrées privées. Défaut : faux (exclues).'
        example: false
        in: query
        name: includePrivate
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TimelineSummaryDto'
          description: Résumé par période.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : identifiant du patient qui n''est pas un UUID.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : patient inexistant.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} : granularity INVALID_VALUE (absente, ou hors month et year) ; from INVALID_TIME (from après to) ; from, to, includePrivate INVALID_FORMAT (valeur illisible).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Résume la chronologie du patient par mois ou par année
      tags:
      - Chronologie
  /api/patients/{id}/versions:
