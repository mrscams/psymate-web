          type: string
        version:
          description: Numéro de la version courante de l'entrée.
          example: 1
          format: int32
          type: integer
        visibility:
          description: 'Visibilité : private = réservée au praticien, clinical = dossier clinique.'
          enum:
          - private
          - clinical
          example: clinical
          type: string
      type: object
