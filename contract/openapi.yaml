      description: 'Session praticien dont la 2FA est active, hors administrateur (la 2FA est obligatoire pour un compte admin : 409 TWO_FACTOR_REQUIRED_FOR_ADMIN, refus avant tout contrôle de code). Exige le mot de passe actuel et un code TOTP ou un code de secours non utilisé. Succès : le secret et tous les codes de secours sont retirés. 5 échecs d''affilée verrouillent les essais 15 min (423).'
