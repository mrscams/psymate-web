          format: double
          type: number
        sessionId:
          format: uuid
          type: string
        similarity:
          description: Similarité trigramme (0 à 1) ; null pour un résultat exact
          format: double
          type: number
        snippet:
          description: Extrait du corps en HTML échappé avec mark ; null si l'entrée n'a pas de corps
          type: string
        tags:
          description: Libellés des tags
          items:
            type: string
          type: array
        title:
          description: Titre en HTML échappé, mots trouvés entre mark si la recherche a un texte
          type: string
        type:
          description: Code du type d'entrée (note, event, situation, feeling, ...)
          type: string
        version:
          description: Version courante de l'entrée
          format: int32
          type: integer
        visibility:
          description: private ou clinical
          type: string
      type: object
    EntrySearchQueryDto:
