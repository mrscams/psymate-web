    patch:
      description: 'Session praticien propriétaire du patient, patient actif (409 PATIENT_ARCHIVED sinon). Mise à jour partielle : seules les clés présentes du corps sont modifiées ; une valeur null ou vide efface un champ texte (sauf displayName, obligatoire : 422) ; birthDate s''efface avec null (une chaîne vide est refusée en 422). context et followUp sont fusionnés clé à clé (une clé à null est retirée ; l''objet entier à null le vide). Chaque appel réussi incrémente currentVersion et archive un instantané (GET /versions) ; reason, facultatif, est le motif conservé dans la version.'
