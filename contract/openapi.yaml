      description: Inscription ouverte d'un praticien (sans code d'invitation). L'adresse e-mail sert d'identifiant de connexion.
      properties:
        address:
          $ref: '#/components/schemas/Address'
          description: Adresse du cabinet ; obligatoire sauf si remoteOnly vaut true (422 ADDRESS_REQUIRED sinon).
        consents:
          $ref: '#/components/schemas/Consents'
          description: Consentements CGU et confidentialité, tous deux à true.
        email:
          description: Adresse e-mail du compte (254 caractères au maximum).
          example: camille.martin@example.org
          format: email
          maxLength: 254
          minLength: 0
          type: string
        firstName:
          description: Prénom (100 caractères au maximum).
          example: Camille
          maxLength: 100
          minLength: 0
          type: string
        lastName:
          description: Nom de famille (100 caractères au maximum).
          example: Martin
          maxLength: 100
          minLength: 0
          type: string
        password:
          description: 'Mot de passe (200 caractères au maximum). Politique : 12 caractères au moins, majuscules et minuscules, absent de la liste des mots de passe courants, sans e-mail ni nom (422 PASSWORD_POLICY sinon).'
          maxLength: 200
          minLength: 0
          type: string
        phone:
          description: Téléphone, 30 caractères au maximum ; normalisé au format E.164 (PHONE_INVALID si ce n'est pas un numéro plausible ; 06 12 34 56 78 est lu comme +33612345678).
          example: '+33612345678'
          maxLength: 30
          minLength: 0
          type: string
        profession:
          description: 'Profession exercée : psychologist (psychologue), psychiatrist (psychiatre) ou coach. Elle fixe les préférences par défaut du compte.'
          enum:
          - psychologist
          - psychiatrist
          - coach
          example: psychologist
          minLength: 1
          pattern: psychologist|psychiatrist|coach
          type: string
        professionalNumber:
          description: 'Numéro professionnel facultatif (ADELI, RPPS ou autre), 30 caractères au maximum ; absent ou vide : non renseigné.'
          example: '759912345'
          maxLength: 30
          minLength: 0
          type: string
        remoteOnly:
          description: 'true si le praticien exerce uniquement à distance (visio) : l''adresse n''est alors pas exigée. Absent = false.'
          type: boolean
      required:
      - consents
      - email
      - firstName
      - lastName
      - password
      - phone
      - profession
      type: object
