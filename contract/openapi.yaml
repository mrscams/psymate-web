          description: 'ADMIN_DOCUMENT_NOT_FOUND : justificatif inexistant, retiré par le praticien ou rattaché à un autre praticien.'
        '410':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ADMIN_DOCUMENT_PURGED : le fichier a été purgé, il n''existe plus.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
