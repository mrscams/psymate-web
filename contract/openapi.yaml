  /api/admin/verifications/{practitionerId}/documents/{docId}/file:
    get:
      description: 'Administrateur avec 2FA, le même que celui qui a obtenu l''URL signée : exp et sig viennent de getAdminDocumentUrl et ne sont valables que 5 minutes. Le fichier est déchiffré à la volée et servi en ligne (Content-Disposition inline, Cache-Control no-store, X-Content-Type-Options nosniff) avec son type MIME d''origine. Chaque lecture écrit une ligne dans le journal d''accès aux documents et une ligne admin.document_read dans le journal d''administration.'
      operationId: getAdminDocumentFile
      parameters:
      - description: Identifiant du praticien propriétaire du justificatif.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: practitionerId
        required: true
        schema:
          format: uuid
          type: string
      - description: Identifiant du justificatif.
        example: 4d8f1e52-7a3b-4c19-8e60-1f2a3b4c5d6e
        in: path
        name: docId
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Échéance de l''URL signée, en secondes depuis l''epoch Unix (UTC), telle que reçue dans l''url de getAdminDocumentUrl. Absent ou dépassé : 403 ADMIN_SIGNED_URL_INVALID.'
        example: 1773564900
        in: query
        name: exp
        required: false
        schema:
          format: int64
          type: integer
      - description: 'Signature de l''URL, telle que reçue dans l''url de getAdminDocumentUrl. Absente ou invalide : 403 ADMIN_SIGNED_URL_INVALID.'
        in: query
        name: sig
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
          description: Contenu du justificatif, avec son type MIME d'origine.
          headers:
            Cache-Control:
              description: 'no-store : ne jamais mettre en cache.'
              style: simple
            Content-Disposition:
              description: inline.
              style: simple
            X-Content-Type-Options:
              description: nosniff.
              style: simple
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ADMIN_SIGNED_URL_INVALID : exp ou sig absent, signature invalide, URL expirée ou émise pour un autre administrateur. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '404':
          content:
