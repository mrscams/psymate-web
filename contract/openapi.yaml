                $ref: '#/components/schemas/AppealCreatedDto'
          description: Created
        '202':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OtpRequiredDto'
          description: Mot de passe correct, 2FA active et code manquant
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Identifiants incorrects (message unique) ou code 2FA faux
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ACCOUNT_NOT_SUSPENDED, APPEAL_NOT_ALLOWED, APPEAL_ALREADY_OPEN ou APPEAL_ALREADY_USED
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Verrouillage après 5 échecs (15 min)
          headers:
            Retry-After:
              description: Secondes avant nouvel essai
              style: simple
