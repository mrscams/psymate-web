          format: date-time
          type: string
        url:
          description: 'Chemin relatif à appeler en GET (avec le cookie de session) : il porte les paramètres exp et sig. Valable 5 minutes.'
          example: /api/me/verification/documents/9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e/file?exp=1773480600&sig=x7F2k9Qw0m5T3bYh8LrN1cVdE6aGsUoJpZiXtKyA4Hc
          type: string
      type: object
    SinceLastSessionDto:
      description: Entrées postérieures à la dernière séance clôturée.
      properties:
        entries:
          description: '20 entrées au plus, de la plus récente à la plus ancienne : non archivées, hors séances, non rattachées à la dernière séance, commençant à son début ou après. Sans séance clôturée : les 20 dernières entrées hors séances.'
          items:
            $ref: '#/components/schemas/SinceLastSessionEntryDto'
          type: array
        lastSessionAt:
          description: Début de cette séance (occurred_from), UTC ISO 8601 ; null s'il n'y en a pas.
          example: 2026-03-07T09:00:00Z
          format: date-time
          type: string
        lastSessionId:
          description: Dernière séance clôturée non archivée ; null s'il n'y en a pas.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
      type: object
    SinceLastSessionEntryDto:
      description: Entrée saisie depuis la dernière séance clôturée.
      properties:
        entryId:
          description: Identifiant de l'entrée.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        occurredFrom:
          description: Début (occurred_from), UTC ISO 8601.
          example: 2026-03-10T18:00:00Z
          format: date-time
          type: string
        sessionId:
          description: Identifiant de la séance de rattachement.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        status:
          description: 'État de l''entrée : draft = brouillon, final = validée.'
          enum:
          - draft
          - final
          example: final
          type: string
        title:
          description: Titre de la version courante ; null si l'entrée n'a pas de titre.
          example: Rêve récurrent
          type: string
        type:
          description: Type d'entrée.
          enum:
          - note
          - event
          - situation
          - feeling
          - medication
          example: note
          type: string
        visibility:
          description: 'Visibilité : private = réservée au praticien, clinical = dossier clinique.'
          enum:
          - private
          - clinical
          example: clinical
          type: string
      type: object
    StartSessionRequest:
      description: Démarrage d'une séance maintenant. authorType et submissionId sont refusés (UNKNOWN_FIELD).
      properties:
        modality:
          description: Modalité de la séance. Obligatoire.
          enum:
          - in_person
          - video
          - phone
          - email
          example: in_person
          minLength: 1
          pattern: in_person|video|phone|email
          type: string
      required:
      - modality
      type: object
    SubmitContactRequest:
      description: Message d'un visiteur à un praticien, relayé par e-mail. Il n'est rattaché à aucun dossier patient.
      properties:
        consent:
          description: Consentement du visiteur au traitement de son message ; doit valoir true (422 sinon).
          example: true
          type: boolean
        email:
          description: E-mail du visiteur, 320 caractères au plus ; le praticien y répond directement.
          example: jean.dupont@example.test
          format: email
          maxLength: 320
          minLength: 0
          type: string
        formShownAt:
          description: Instant d'affichage du formulaire, ISO 8601 UTC ; un envoi moins de 3 secondes après cet instant, ou dans le futur, est ignoré en silence (202 sans envoi).
          example: 2026-10-12T14:30:00Z
          format: date-time
          type: string
        message:
          description: Texte du message, 4 000 caractères au plus.
          example: Bonjour, avez-vous une place pour un premier rendez-vous ?
          maxLength: 4000
          minLength: 0
          type: string
        name:
          description: Nom du visiteur, 200 caractères au plus.
          example: Jean Dupont
          maxLength: 200
          minLength: 0
          type: string
        subject:
          description: Objet du message, 200 caractères au plus. Optionnel.
          example: Première consultation
          maxLength: 200
          minLength: 0
          type: string
        website:
          description: 'Piège anti-spam (honeypot) : champ caché du formulaire, à laisser vide ; rempli, le message est ignoré en silence (202 sans envoi).'
          type: string
      required:
      - consent
      - email
      - formShownAt
      - message
      - name
      type: object
    SuspendDto:
      description: Résultat d'une suspension de compte.
      properties:
        decisionId:
          description: Identifiant de la décision de suspension enregistrée.
          example: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
          format: uuid
          type: string
        id:
          description: Identifiant du compte suspendu.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        suspendedAt:
          description: Date-heure UTC (ISO 8601) de la suspension.
          example: 2026-04-02T10:00:00Z
          format: date-time
          type: string
        verificationStatus:
          description: Nouveau statut de vérification, toujours suspended.
          example: suspended
          type: string
      type: object
    TagDto:
      description: Tag libre du praticien associé à un patient.
      properties:
        id:
          description: Identifiant du tag.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        label:
          description: Libellé du tag, tel qu'affiché.
          example: sommeil
          type: string
      type: object
    TagRequest:
      description: Libellé d'un tag à créer ou à substituer au libellé actuel.
      properties:
        label:
          description: 'Libellé du tag ; obligatoire, non vide. Un « # » est ignoré, les espaces de bord sont retirés ; l''unicité se juge sans casse ni accents. Un libellé égal à une émotion visible du praticien est refusé (TAG_IS_EMOTION).'
          example: Travail
          type: string
      required:
      - label
      type: object
    TagView:
      description: Tag libre du praticien connecté, utilisable sur ses patients et ses entrées.
      properties:
        createdAt:
          description: Date-heure de création, UTC ISO 8601.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
        id:
          description: Identifiant du tag.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        label:
          description: 'Libellé tel que saisi, sans aucun « # », espaces de bord retirés.'
          example: Travail
          type: string
        normalizedLabel:
          description: 'Libellé normalisé servant à l''unicité et aux recherches : minuscules, sans accents ni « # ».'
          example: travail
          type: string
        usageCount:
          description: Compteur d'usages maintenu pour l'autocomplétion ; additionné lors d'une fusion de tags.
          example: 0
          format: int32
          type: integer
      type: object
    TagsRequest:
      description: Liste complète des tags d'un patient (remplace la liste existante).
      properties:
        tags:
          description: Libellés de tags existants du praticien (à créer d'abord par POST /api/tags). Un libellé qui correspond à une émotion est refusé (TAG_IS_EMOTION), un libellé inconnu aussi (TAG_UNKNOWN). Liste vide pour retirer tous les tags ; les doublons sont fusionnés.
          items:
            type: string
          type: array
      type: object
    TimelineEmotionDto:
      description: Émotion d'un ressenti d'après le catalogue de vocabulaire du praticien.
      properties:
        code:
          description: Code de l'émotion.
          example: anxiety
          type: string
        family:
          description: 'Famille de l''émotion d''après le catalogue : joy, trust, fear, surprise, sadness, disgust, anger ou anticipation. Null si elle est inconnue.'
          example: fear
          type: string
      type: object
    TimelineFacetsDto:
      description: Comptes de toute la fenêtre filtrée (et non de la seule page), indépendants du curseur. Triés du plus fréquent au plus rare.
      properties:
        emotions:
          additionalProperties:
            format: int32
            type: integer
          description: Nombre de ressentis par émotion (clé = code de l'émotion).
          type: object
        tags:
          additionalProperties:
            format: int32
            type: integer
          description: Nombre d'entrées par tag (clé = libellé du tag).
          type: object
        types:
          additionalProperties:
            format: int32
            type: integer
          description: Nombre d'entrées par type (clé = code du type).
          type: object
      type: object
    TimelineItemDto:
      description: 'Entrée allégée de la chronologie : de quoi dessiner une ligne sans charger l''entrée complète (GET /api/entries/{id}).'
      properties:
        authorType:
          description: 'Provenance de l''entrée. Lecture seule : vaut toujours practitioner en V1.'
          enum:
          - practitioner
          example: practitioner
          readOnly: true
          type: string
        emotion:
          $ref: '#/components/schemas/TimelineEmotionDto'
          description: Émotion du ressenti. Renseignée pour le type feeling, null sinon.
        id:
          description: Identifiant de l'entrée.
          format: uuid
          type: string
        intensity:
          description: Intensité du ressenti, de 0 à 10. Null pour les autres types.
          format: int32
          maximum: 10
          minimum: 0
          type: integer
        linkCount:
          description: Nombre de liens acceptés portant sur l'entrée.
          format: int32
          minimum: 0
          type: integer
        occurred:
          $ref: '#/components/schemas/EntryOccurredDto'
          description: Moment auquel l'entrée a eu lieu, avec sa précision.
        ongoing:
          description: Vrai pour une situation sans fin (occurred.to nul), toujours en cours. Faux pour tout autre élément.
          type: boolean
        recordedAt:
          description: Instant d'enregistrement de l'entrée, UTC ISO 8601.
          example: 2026-10-20T19:05:00Z
          format: date-time
          type: string
        sessionId:
          description: Identifiant de la séance de l'entrée. Null pour une séance (une séance n'est rattachée à aucune séance).
          format: uuid
          type: string
        status:
          description: 'Statut : draft = brouillon ; final = définitive.'
          enum:
          - draft
          - final
          example: final
          type: string
        tags:
          description: Libellés des tags actifs de l'entrée, triés sans tenir compte de la casse.
          items:
            type: string
          type: array
        title:
          description: Titre de la version courante. Null si la version n'en a pas.
          type: string
        type:
          description: Type de l'entrée.
          enum:
          - note
          - event
          - situation
          - feeling
          - session
          - medication
          example: feeling
          type: string
        visibility:
          description: 'Visibilité : private = visible du seul praticien auteur ; clinical = partagée avec l''équipe clinique.'
          enum:
          - private
          - clinical
          example: clinical
          type: string
      type: object
    TimelinePageDto:
      description: Page de chronologie, triée par début d'occurrence décroissant (puis identifiant décroissant), avec facettes de la fenêtre et situations en cours.
      properties:
        facets:
          $ref: '#/components/schemas/TimelineFacetsDto'
          description: Facettes de toute la fenêtre filtrée.
        items:
          description: Entrées de la page, de la plus récente à la plus ancienne.
          items:
            $ref: '#/components/schemas/TimelineItemDto'
          type: array
        nextCursor:
          description: Curseur opaque à renvoyer tel quel dans le paramètre cursor pour obtenir la page suivante. Null sur la dernière page.
          type: string
        ongoingSituations:
          description: Situations non archivées dont la plage chevauche la fenêtre, y compris celles commencées avant from et toujours en cours. Seuls les filtres de fenêtre, de brouillon et de visibilité s'appliquent (pas types, emotions ni tags) ; indépendantes de la pagination.
          items:
            $ref: '#/components/schemas/TimelineItemDto'
          type: array
      type: object
    TimelinePeriodDto:
      description: Agrégats d'une période (un mois ou une année, en UTC).
      properties:
        averageIntensity:
          description: Intensité moyenne des ressentis de la période. Null s'il n'y en a pas.
          format: double
          type: number
        counts:
          additionalProperties:
            format: int32
            type: integer
          description: Nombre d'entrées de la période par type (clé = code du type).
          type: object
        feelingCount:
          description: Nombre de ressentis de la période.
          format: int32
          minimum: 0
          type: integer
        from:
          description: Début de la période, UTC ISO 8601.
          example: 2026-10-01T00:00:00Z
          format: date-time
          type: string
        period:
          description: 'Libellé de la période : AAAA-MM pour un mois, AAAA pour une année.'
          example: 2026-10
          type: string
      type: object
    TimelineSummaryDto:
      description: Résumé de la chronologie par mois ou par année. Seules les périodes qui contiennent au moins une entrée sont renvoyées, de la plus ancienne à la plus récente.
      properties:
        granularity:
          description: Granularité demandée.
          enum:
          - month
          - year
          example: month
          type: string
        periods:
          description: Périodes non vides, de la plus ancienne à la plus récente.
          items:
            $ref: '#/components/schemas/TimelinePeriodDto'
          type: array
      type: object
    TopEmotionDto:
      description: Émotion dominante et variation par rapport à la fenêtre précédente.
      properties:
        code:
          description: Code de l'émotion.
          example: anxiety
          type: string
        count:
          description: Nombre de ressentis dans la fenêtre.
          example: 8
          format: int32
          type: integer
        delta:
          description: count moins previousCount (négatif si en baisse).
          example: 3
          format: int32
          type: integer
        label:
          description: Libellé français de l'émotion.
          example: Anxiété
          type: string
        previousCount:
          description: Nombre de ressentis dans la fenêtre précédente, de même longueur.
          example: 5
          format: int32
          type: integer
      type: object
    TrendDto:
      description: Courbe d'intensité et repères de la fenêtre.
      properties:
        markers:
          description: Séances et débuts/fins de médicament dont le jour tombe dans la fenêtre, par date croissante.
          items:
            $ref: '#/components/schemas/TrendMarkerDto'
          type: array
        points:
          description: 'Points de la courbe, dates croissantes, la dernière étant aujourd''hui : un par jour pour 30d et 90d, un par semaine pour 12m ; 90 au plus.'
          items:
            $ref: '#/components/schemas/TrendPointDto'
          type: array
      type: object
    TrendMarkerDto:
      description: 'Repère sur la courbe : séance ou début/fin de médicament.'
      properties:
        change:
          description: 'Pour un médicament : start (début) ou end (fin) ; null pour une séance.'
          enum:
          - start
          - end
          example: start
          type: string
        date:
          description: Jour UTC du repère, AAAA-MM-JJ.
          example: 2026-03-10T00:00:00Z
          format: date
          type: string
        entryId:
          description: Identifiant de l'entrée séance ou médicament.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        kind:
          description: 'Nature du repère : session ou medication.'
          enum:
          - session
          - medication
          example: session
          type: string
        label:
          description: Titre de la séance (null sans titre) ou « molécule dosage » du médicament (« molécule » seule sans dosage).
          example: sertraline 50 mg
          type: string
        sessionKind:
          description: 'Pour une séance : intake (accueil), session (séance) ou contact (hors rendez-vous) ; null pour un médicament.'
          enum:
          - intake
          - session
          - contact
          example: session
          type: string
      type: object
    TrendPointDto:
      description: 'Point de la courbe : moyenne glissante sur 7 jours à cette date.'
      properties:
        averageIntensity:
          description: Intensité moyenne (0 à 10, deux décimales) des ressentis des 7 derniers jours jusqu'à cette date ; null si aucun ressenti.
          example: 5.25
          format: double
          type: number
        date:
          description: Jour UTC du point, AAAA-MM-JJ.
          example: 2026-03-14T00:00:00Z
          format: date
          type: string
        valence:
          description: Valence moyenne (-2 à 2, deux décimales) des valences connues sur les 7 jours ; null si aucune. Toujours null tant que les valences des émotions ne sont pas renseignées.
          example: -0.5
          format: double
          type: number
      type: object
    TwoFactorDisableRequest:
      description: Confirmation de la désactivation de la 2FA.
      properties:
        code:
          description: Code TOTP à 6 chiffres ou code de secours non utilisé (32 caractères au maximum).
          example: '123456'
          maxLength: 32
          minLength: 0
          type: string
        password:
          description: Mot de passe actuel du compte (200 caractères au maximum).
          maxLength: 200
          minLength: 0
          type: string
      required:
      - code
      - password
      type: object
    TwoFactorEnableResponse:
      description: Secret TOTP en attente d'activation, montré une seule fois.
      properties:
        otpauthUri:
          description: URI otpauth:// à encoder en QR code (émetteur PsyMate, SHA1, 6 chiffres, pas de 30 s).
          example: otpauth://totp/PsyMate:camille.martin%40example.org?secret=JBSWY3DPEHPK3PXP
          type: string
        secret:
          description: Secret TOTP en Base32, à saisir dans l'application d'authentification si le QR code n'est pas lisible.
          example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
          type: string
      type: object
    TwoFactorVerifyRequest:
      description: Premier code TOTP produit par l'application d'authentification.
      properties:
        code:
          description: Code TOTP à 6 chiffres affiché par l'application (32 caractères max).
          example: '123456'
          maxLength: 32
          minLength: 0
          type: string
      required:
      - code
      type: object
    UpdateProfileRequest:
      description: 'Contenu complet du profil d''annuaire : remplace toutes les colonnes éditables, un champ absent reprend sa valeur par défaut. published, slug, profession et photo ne s''envoient pas.'
      properties:
        address:
          description: Adresse postale du cabinet, 300 caractères au plus.
          maxLength: 300
          type: string
        audiences:
          description: 'Codes de publics actifs de GET /api/vocabulary/directory, sans doublon. Défaut : liste vide.'
          items:
            type: string
          type: array
        availability:
          description: 'Disponibilité : accepting (accepte de nouveaux patients), waitlist (liste d''attente), closed (complet), unknown (non renseignée). Défaut : unknown.'
          enum:
          - accepting
          - waitlist
          - closed
          - unknown
          example: accepting
          type: string
        bio:
          description: 'Présentation libre, 1 200 caractères au plus. Défaut : aucune.'
          maxLength: 1200
          type: string
        city:
          description: Ville, 100 caractères au plus. Requise pour publier.
          example: Lyon
          maxLength: 100
          type: string
        contactEmail:
          description: E-mail de contact public, 254 caractères au plus, de la forme x@y.
          example: contact@cabinet.example
          maxLength: 254
          type: string
        contactPhone:
          description: Téléphone de contact, 30 caractères au plus.
          example: +33 4 72 00 00 00
          maxLength: 30
          type: string
        country:
          description: 'Code pays ISO 3166-1 alpha-2 (deux lettres, converti en majuscules). Défaut : FR.'
          example: FR
          type: string
        displayName:
          description: Nom affiché dans l'annuaire, obligatoire, 120 caractères au plus.
          example: Claire Lambert
          maxLength: 120
          type: string
        fees:
          description: Tarifs, texte libre de 500 caractères au plus.
          maxLength: 500
          type: string
        languages:
          description: 'Langues de consultation, codes ISO 639-1 (fr, en…), sans doublon. Défaut : liste vide.'
          items:
            type: string
          type: array
        modalities:
          description: 'Modalités parmi in_person (au cabinet), video, home (à domicile), sans doublon. Défaut : liste vide.'
          items:
            type: string
          type: array
        nextSlotAt:
          description: 'Date du prochain créneau disponible, AAAA-MM-JJ. Défaut : aucune.'
          example: 2026-11-20T00:00:00Z
          format: date
          type: string
        postalCode:
          description: Code postal, 20 caractères au plus.
          example: '69003'
          maxLength: 20
          type: string
        responseDelay:
          description: Délai de réponse annoncé, 60 caractères au plus.
          example: sous 48 h
          maxLength: 60
          type: string
        showAddress:
          description: 'true pour afficher publiquement address. Défaut : false.'
          type: boolean
        showEmail:
          description: 'true pour afficher publiquement contactEmail. Défaut : false.'
          type: boolean
        showPhone:
          description: 'true pour afficher publiquement contactPhone. Défaut : false.'
          type: boolean
        showProfessionalNumber:
          description: 'true pour afficher publiquement le numéro professionnel du compte. Défaut : false.'
          type: boolean
        specialties:
          description: 'Codes de spécialités actifs de GET /api/vocabulary/directory, sans doublon, 8 au plus. Défaut : liste vide.'
          items:
            type: string
          type: array
        titleLabel:
          description: 'Intitulé libre affiché sous le nom, 120 caractères au plus. Défaut : aucun.'
          example: Psychologue clinicienne
          maxLength: 120
          type: string
        websiteUrl:
          description: Site web, adresse http ou https avec nom d'hôte, 300 caractères au plus.
          example: https://cabinet.example
          maxLength: 300
          type: string
      required:
      - displayName
      type: object
    VerificationDto:
      description: 'Dossier professionnel du praticien : état de la vérification, justificatifs actifs, pièces manquantes et recommandées, décisions reçues et informations professionnelles.'
      properties:
        decisions:
          description: Décisions de l'administration accompagnées d'un message, de la plus récente à la plus ancienne.
          items:
            $ref: '#/components/schemas/DecisionDto'
          type: array
        documents:
          description: Justificatifs actifs du dossier (20 au maximum), retirés exclus.
          items:
            $ref: '#/components/schemas/DocumentDto'
          type: array
        missing:
          description: Types de justificatifs obligatoires encore absents (diploma, identity) ; le dossier ne peut être soumis que si la liste est vide.
          example: diploma
          items:
            type: string
          type: array
        profession:
          description: 'Profession du praticien : psychologist, psychiatrist ou coach.'
          enum:
          - psychologist
          - psychiatrist
          - coach
          example: psychologist
          type: string
        professionalInfo:
          $ref: '#/components/schemas/ProfessionalInfoDto'
          description: Informations professionnelles enregistrées.
        recommended:
          description: Types de justificatifs conseillés encore absents (registration pour un psychologue ou un psychiatre, certification pour un coach) ; jamais bloquant.
          example: registration
          items:
            type: string
          type: array
        status:
          description: 'État du dossier : email_pending = e-mail non confirmé ; docs_pending = justificatifs à déposer ; under_review = dossier soumis, en cours d''examen ; approved = praticien vérifié ; needs_more = pièces complémentaires demandées ; rejected = dossier refusé ; suspended = compte suspendu ; closed = compte clos. Le dossier n''est modifiable qu''en docs_pending et needs_more.'
          enum:
          - email_pending
          - docs_pending
          - under_review
          - approved
          - needs_more
          - rejected
          - suspended
          - closed
          example: docs_pending
          type: string
        submittedAt:
          description: Date-heure de la dernière soumission du dossier, en UTC ; null s'il n'a jamais été soumis.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
      type: object
    VersionDto:
      description: 'Instantané de la fiche après une modification par PATCH. La création (version 1) n''a pas d''instantané : la liste commence à la version 2.'
      properties:
        authorId:
          description: Identifiant du praticien auteur de la modification.
          example: 5f1b7c3e-1d2a-4b6c-8e9f-0a1b2c3d4e5f
          format: uuid
          type: string
        createdAt:
          description: Date-heure de la modification, UTC ISO 8601.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
        reason:
          description: Motif de la modification fourni par le champ reason du PATCH ; null si absent.
          example: Changement de numéro
          type: string
        snapshot:
          additionalProperties: {}
          description: 'État de la fiche après la modification : objet JSON avec displayName, firstName, lastName, birthDate (AAAA-MM-JJ ou null), pronoun, phone, email, context et followUp.'
          type: object
        version:
          description: Numéro de la version produite par la modification.
          example: 2
          format: int32
          type: integer
      type: object
info:
  description: |-
    API de PsyMate, suivi clinique pour psychologues, psychiatres et coachs. Ce document est la seule référence nécessaire pour écrire un client : chaque opération décrit qui peut l'appeler, ce qu'elle attend, ce qu'elle renvoie et chaque erreur à gérer.

    **Authentification.** Session serveur portée par un cookie HttpOnly, Secure, SameSite=Lax, posé par `POST /api/auth/login` (expire après 12 h d'inactivité, 30 j avec rememberMe) ; aucun jeton à envoyer. Sans session valide, toute route répond 401 UNAUTHENTICATED, sauf les routes publiques : inscription, confirmation, renvoi et changement d'e-mail, connexion, changement et réinitialisation du mot de passe, déconnexion, `POST /api/me/appeal`, `/api/me/export*` et `/api/public/**`. Un compte dont l'e-mail n'est pas confirmé reçoit 403 EMAIL_NOT_CONFIRMED hors `/api/auth/*`. Les routes `/api/admin/**` exigent le rôle admin (403 ADMIN_ROLE_REQUIRED) et la double authentification active (403 TWO_FACTOR_REQUIRED). Un compte suspendu n'a pas de session : `POST /api/me/appeal` et `/api/me/export` l'identifient par `{email, password, otp?}` dans le corps (202 `{otpRequired: true}` quand le code 2FA manque).

    **Erreurs.** Toujours `application/problem+json` (RFC 9457), schéma `ProblemDetail` : `type`, `title`, `status`, `detail`, `instance`, plus `code` (identifiant stable, à tester en priorité) et, pour les 422 et les 400 de paramètre, `errors[]` `{field, code?, message}` par champ. Codes transverses : 400 MALFORMED_JSON (JSON illisible) ou BAD_REQUEST (paramètre manquant ou mal typé, `errors[]` avec INVALID_FIELD) ; certains modules ont leur propre code 400, indiqué sur chaque opération (MALFORMED_REQUEST pour clinical, linking et admin ; INVALID_BODY et INVALID_PARAMETERS pour directory ; SEARCH_BAD_REQUEST ; OVERVIEW_BAD_REQUEST) ; 401 UNAUTHENTICATED ; 403 FORBIDDEN / EMAIL_NOT_CONFIRMED / ADMIN_ROLE_REQUIRED / TWO_FACTOR_REQUIRED ; 404 NOT_FOUND (route inconnue) ; 405 METHOD_NOT_ALLOWED ; 406 NOT_ACCEPTABLE ; 413 UPLOAD_TOO_LARGE (plafond multipart global) ; 415 UNSUPPORTED_MEDIA_TYPE ; 422 VALIDATION_FAILED ; 429 RATE_LIMITED ; 500 INTERNAL_ERROR (détail générique, jamais le message interne). Les codes métier (PATIENT_ARCHIVED, LINK_EXISTS, SESSION_REQUIRED…) sont listés sur chaque opération. Les textes `detail` et `message` sont en français par défaut et en anglais avec `Accept-Language: en` pour la plupart des erreurs (quelques messages métier restent en français) ; `title` n'est pas fiable pour l'affichage : tester `code`.

    **Limites de débit** : 600 requêtes/min par session sur `/api/**` (les requêtes sans session ne sont pas comptées), 60/min par IP sur `/api/public/**`, 5/h par IP sur l'envoi de contact. Au-delà : 429 RATE_LIMITED avec l'en-tête `Retry-After` (secondes) et le champ `retryAfterSeconds` ; les 423 d'authentification (verrou après échecs) portent les mêmes.

    **Formats.** JSON camelCase ; dates-heures en UTC ISO 8601 (`2026-03-14T09:30:00Z`), dates civiles `AAAA-MM-JJ` ; identifiants UUID. Les grandes listes (patients, chronologie, files d'administration) sont paginées par curseur opaque (`cursor`, `limit`, réponse `{items[], nextCursor}`, `nextCursor` null en fin) ; les listes courtes (versions, vocabulaires…) sont renvoyées en entier ; l'annuaire public et la recherche utilisent `page` (20 résultats par page). Voir chaque opération. Les champs en lecture seule (`authorType`, `submissionId`) sont refusés en écriture (422 UNKNOWN_FIELD). Rien n'est supprimé physiquement : archivage et versions. Les fichiers sortent avec un `Content-Disposition` (`attachment` pour les exports, `inline` pour les justificatifs) ; les réponses publiques portent un `Cache-Control` explicite.

    **Version du contrat** : `info.version` est incrémentée à chaque changement du contrat et un tag `contract-vX.Y.Z` est posé. Les tags regroupent les opérations par contrôleur, dans l'ordre d'usage : identité, dossier clinique, exploration, annuaire, administration.
  title: PsyMate API
  version: 0.6.0
openapi: 3.1.0
paths:
  /api/admin/appeals:
    get:
      description: 'Administrateur avec 2FA. Filtre status : open (non examinés, par défaut), decided (examinés) ou all. Les recours open sont triés du plus ancien au plus récent (file de traitement), decided et all du plus récent au plus ancien. Pagination par curseur opaque : limit 50 par défaut, bornée à 1..200 sans erreur ; nextCursor est null sur la dernière page.'
      operationId: listAdminAppeals
      parameters:
      - description: 'Recours à lister : open (défaut), decided ou all. Autre valeur : 422 INVALID_STATUS.'
        example: open
        in: query
        name: status
        required: false
        schema:
          default: open
          enum:
          - open
          - decided
          - all
          type: string
      - description: 'Curseur opaque (nextCursor de la page précédente, à renvoyer tel quel) ; absent pour la première page. Illisible : 422 INVALID_CURSOR.'
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 'Nombre maximal de recours par page : 50 par défaut, ramené dans l''intervalle 1 à 200 sans erreur.'
        example: 50
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AppealListDto'
          description: Page de recours.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : INVALID_STATUS (status, autre que open, decided, all), INVALID_CURSOR (cursor illisible).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Liste les recours à examiner ou déjà examinés
      tags:
      - Recours
  /api/admin/appeals/{id}/decision:
    post:
      description: 'Administrateur avec 2FA, différent de l''auteur de la décision contestée. Le corps est validé en premier (422). accepted : le compte est réactivé comme par la réactivation manuelle (statut d''avant la suspension, ou docs_pending pour un dossier refusé), décision appeal_accepted au journal, un seul e-mail. dismissed : le compte reste inchangé, décision appeal_rejected, e-mail de réponse. Dans les deux cas la réponse est transmise au praticien, l''e-mail part de façon asynchrone après l''enregistrement, et le recours est clos : il ne peut plus être décidé ni redéposé pour la même décision.'
      operationId: decideAdminAppeal
      parameters:
      - description: Identifiant du recours.
        example: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealDecisionRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AppealItemDto'
          description: Recours examiné, avec son issue.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : corps absent ou JSON illisible (code propre à ce module).'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'APPEAL_NOT_FOUND : aucun recours avec cet identifiant.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'APPEAL_ALREADY_DECIDED : le recours a déjà été examiné ; APPEAL_SELF_REVIEW : l''administrateur est l''auteur de la décision contestée ; APPEAL_ACCOUNT_NOT_REACTIVABLE : outcome accepted alors que le compte n''est plus suspended ni rejected.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : INVALID_OUTCOME (outcome, autre que accepted ou dismissed), REQUIRED (messageToPractitioner), TOO_LONG (messageToPractitioner, plus de 4000 caractères). Contrôlé avant la recherche du recours.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Accepte ou écarte un recours
      tags:
      - Recours
  /api/admin/journal:
    get:
      description: 'Administrateur avec 2FA. Lecture seule : décisions d''administration (kind admin.<kind>) et événements de sécurité, du plus récent au plus ancien, avec filtres cumulables kind, practitionerId, actorId, from, to. Jamais d''adresse IP, et les lignes d''audit patient (kind patient.*) sont écartées. Pagination par curseur opaque : limit 50 par défaut, bornée à 1..200 sans erreur ; nextCursor est null sur la dernière page. Aucune route d''écriture sur le journal (405).'
      operationId: listAdminJournal
      parameters:
      - description: 'Type d''événement : égalité exacte ou préfixe (kind=admin retient admin et tous les admin.*). Minuscules, chiffres, points et soulignés, 64 caractères au plus, commençant par une lettre ; sinon 422 INVALID_KIND. Absent : tous les types.'
        example: admin.suspend
        in: query
        name: kind
        required: false
        schema:
          type: string
      - description: 'Identifiant du compte concerné (UUID) ; sinon 422 INVALID_ID. Absent : tous.'
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: query
        name: practitionerId
        required: false
        schema:
          type: string
      - description: 'Identifiant de l''administrateur auteur (UUID) ; sinon 422 INVALID_ID. Absent : tous.'
        example: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
        in: query
        name: actorId
        required: false
        schema:
          type: string
      - description: 'Début de période, inclus : date-heure ISO 8601 avec fuseau, ou jour AAAA-MM-JJ (début de journée UTC). Sinon 422 INVALID_DATE.'
        example: 2026-04-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: 'Fin de période, incluse : date-heure ISO 8601 avec fuseau, ou jour AAAA-MM-JJ (fin de journée UTC incluse). Sinon 422 INVALID_DATE.'
        example: 2026-04-30T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
      - description: 'Curseur opaque (nextCursor de la page précédente, à renvoyer tel quel) ; absent pour la première page. Illisible : 422 INVALID_CURSOR.'
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 'Nombre maximal de lignes par page : 50 par défaut, ramené dans l''intervalle 1 à 200 sans erreur.'
        example: 50
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JournalDto'
          description: Page du journal.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : INVALID_KIND (kind), INVALID_ID (practitionerId ou actorId, UUID illisible), INVALID_DATE (from ou to), INVALID_CURSOR (cursor illisible).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Liste le journal d'administration, du plus récent au plus ancien
      tags:
      - 'Administration : journal'
  /api/admin/practitioners:
    get:
      description: 'Administrateur avec 2FA. Liste les comptes (praticiens et administrateurs) du plus récemment créé au plus ancien. Filtres cumulables : q (recherche dans le nom d''affichage et l''e-mail), status, role, profession. counts donne le nombre de comptes par statut (approved, under_review, needs_more, suspended, rejected) pour q, role et profession, sans le filtre status ni la pagination : il sert aux onglets. Pagination par curseur opaque : limit 50 par défaut, bornée à 1..200 sans erreur ; nextCursor est null sur la dernière page.'
      operationId: listAdminPractitioners
      parameters:
      - description: 'Texte recherché, sans casse, dans le nom d''affichage ou l''e-mail (correspondance sur une partie du texte) ; 100 caractères au plus après suppression des blancs de bord (422 TOO_LONG). Vide ou absent : pas de filtre.'
        example: martin
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: 'Statut de vérification : email_pending, docs_pending, under_review, approved, needs_more, rejected, suspended ou closed. Absent : tous les statuts. Autre valeur : 422 INVALID_STATUS.'
        example: suspended
        in: query
        name: status
        required: false
        schema:
          enum:
          - email_pending
          - docs_pending
          - under_review
          - approved
          - needs_more
          - rejected
          - suspended
          - closed
          type: string
      - description: 'Rôle du compte : practitioner ou admin. Absent : tous les rôles. Autre valeur : 422 INVALID_ROLE.'
        example: practitioner
        in: query
        name: role
        required: false
        schema:
          enum:
          - practitioner
          - admin
          type: string
      - description: 'Profession : psychologist, psychiatrist ou coach. Absent : toutes. Autre valeur : 422 INVALID_PROFESSION.'
        example: psychologist
        in: query
        name: profession
        required: false
        schema:
          enum:
          - psychologist
          - psychiatrist
          - coach
          type: string
      - description: 'Curseur opaque (nextCursor de la page précédente, à renvoyer tel quel) ; absent pour la première page. Illisible : 422 INVALID_CURSOR.'
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 'Nombre maximal de comptes par page : 50 par défaut, ramené dans l''intervalle 1 à 200 sans erreur.'
        example: 50
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountListDto'
          description: Page de comptes et compteurs par statut.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : TOO_LONG (q, plus de 100 caractères), INVALID_STATUS (status), INVALID_ROLE (role), INVALID_PROFESSION (profession), INVALID_CURSOR (cursor illisible).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Liste les comptes avec recherche, filtres et compteurs par statut
      tags:
      - 'Administration : praticiens'
  /api/admin/practitioners/{id}:
