  /api/patients/{id}/search:
    get:
      description: 'Recherche plein texte (français, sans accents, ts_rank_cd, boost x1,5 sous 90 jours), repli par trigrammes (résultats approchés, approximate=true) quand moins de 3 résultats exacts, extraits surlignés (balises mark), filtres et facettes. Le paramètre q accepte les jetons tag:xxx, émotion:xxx, avant:AAAA[-MM[-JJ]] et après:AAAA[-MM[-JJ]] (valeur entre guillemets possible) ; ils se cumulent avec les paramètres types, emotions, tags, from et to. Plusieurs valeurs d''un même filtre s''additionnent (ou), les filtres entre eux se combinent (et). Chaque facette ignore son propre filtre. Exception documentée à la pagination par curseur : pagination par numéro de page, 20 résultats par page (page 1 : exacts puis approchés ; pages suivantes : exacts seulement). Les entrées privées d''un autre praticien ne sont jamais renvoyées.'
      operationId: searchPatientEntries
      parameters:
      - description: Identifiant du patient
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Texte et jetons de recherche, 200 caractères au maximum. Exemple : licenciement tag:travail émotion:anxiété après:2026-06'
        in: query
        name: q
        required: false
        schema:
          maxLength: 200
          type: string
      - description: Types d'entrée à retenir (note, event, situation, feeling, session, medication) ; paramètre répétable
        in: query
        name: types
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Codes d'émotion à retenir (ressentis) ; paramètre répétable
        in: query
        name: emotions
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Libellés de tags à retenir, sans accents ni casse ; paramètre répétable
        in: query
        name: tags
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Début de période sur la date de l''entrée : instant ISO 8601 ou date AAAA-MM-JJ'
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: 'Fin de période (incluse) : instant ISO 8601 ou date AAAA-MM-JJ (jour inclus)'
        in: query
        name: to
        required: false
        schema:
          type: string
      - description: Séance de rattachement des entrées
        in: query
        name: sessionId
        required: false
        schema:
          format: uuid
          type: string
      - description: Inclure les entrées archivées (exclues par défaut)
        in: query
        name: includeArchived
        required: false
        schema:
          default: false
          type: boolean
      - description: Numéro de page, à partir de 1 (20 résultats par page)
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntrySearchResultDto'
          description: Résultats, facettes et requête interprétée
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Paramètre invalide (errors[] par champ, code SEARCH_BAD_REQUEST)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Le patient n'appartient pas au praticien courant
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Patient inconnu
      summary: Recherche dans le dossier d'un patient
      tags:
      - search
