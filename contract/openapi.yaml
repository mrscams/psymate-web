            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: Patient restauré ; corps = fiche complète.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : aucun patient avec cet identifiant.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Restaure un patient archivé
      tags:
      - Patients
  /api/patients/{id}/search:
    get:
      description: 'Session praticien propriétaire du patient. Recherche plein texte en français, sans accents ni casse, classée par pertinence avec un boost x1,5 pour les entrées de moins de 90 jours ; sans texte, liste par date décroissante. Avec un texte (sans exclusion -mot) et moins de 3 résultats exacts, la page 1 est complétée par des résultats approchés (tolérance aux fautes, approximate=true). Extraits échappés en HTML avec <mark>. Syntaxe de q, filtres et facettes (chacune ignore son propre filtre) : voir les paramètres ; plusieurs valeurs d''un même filtre se combinent en « ou », les filtres entre eux en « et ». Les entrées privées d''un autre praticien ne sont jamais renvoyées. Pagination par numéro de page (exception au curseur) : 20 résultats par page, 500 pages au plus ; approchés sur la page 1 seulement.'
      operationId: searchPatientEntries
      parameters:
      - description: Identifiant du patient.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Texte et jetons de recherche, 200 caractères au maximum (400 TOO_LONG au-delà). Le texte suit la syntaxe web : mots (tous requis), "expression exacte", mot1 or mot2, -mot pour exclure. Jetons retirés du texte et appliqués comme filtres : tag:travail, émotion:anxiété (code ou libellé, emotion: accepté), avant:AAAA[-MM[-JJ]] (strictement avant le début de la période, before: accepté), après:AAAA[-MM[-JJ]] (à partir de la fin de la période, after: accepté ; après:2026-06 = dès le 1er juillet 2026, UTC). Valeur à espaces entre guillemets : tag:"vie pro". Préfixes sans casse ni accents ; un tag ou une émotion inconnus ne retiennent aucune entrée, sans erreur.'
        example: licenciement tag:travail émotion:anxiété après:2026-06
        in: query
        name: q
        required: false
        schema:
          maxLength: 200
          type: string
      - description: 'Types d''entrée à retenir ; paramètre répétable (types=note&types=event), en « ou ». Valeurs : note, event, situation, feeling, session, medication ; toute autre donne 400 UNKNOWN_TYPE.'
        in: query
        name: types
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Émotions à retenir (ressentis), par code ou libellé sans casse ni accents ; paramètre répétable, en « ou ». Une émotion inconnue ne retient aucune entrée.
        in: query
        name: emotions
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Libellés de tags à retenir, sans casse ni accents, « # » de tête toléré ; paramètre répétable, en « ou ». Un tag inconnu ne retient aucune entrée.'
        in: query
        name: tags
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Début de période sur la date de l''entrée (occurred_from), inclus : date AAAA-MM-JJ (dès 00:00 UTC) ou instant ISO 8601 avec fuseau (2026-03-14T09:30:00Z). Autre format : 400 INVALID_DATE.'
        example: 2026-03-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: 'Fin de période sur la date de l''entrée, incluse : date AAAA-MM-JJ (jour entier compris) ou instant ISO 8601 avec fuseau. Ne doit pas être antérieure à from (la même journée est admise) : 400 RANGE_INVERTED sinon.'
        example: 2026-03-31T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
      - description: Ne retenir que les entrées rattachées à cette séance (identifiant).
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: query
        name: sessionId
        required: false
        schema:
          format: uuid
          type: string
      - description: 'true : inclure aussi les entrées archivées (archivedAt renseigné) ; false (défaut) : les exclure.'
        example: false
        in: query
        name: includeArchived
        required: false
        schema:
          default: false
          type: boolean
      - description: 'Numéro de page, de 1 à 500 (défaut 1), 20 résultats par page ; hors bornes : 400 INVALID_PAGE.'
        example: 1
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          maximum: 500
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntrySearchResultDto'
          description: Résultats de la page, total exact, facettes et requête interprétée.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'SEARCH_BAD_REQUEST : errors[] {field, code, message}, toutes les erreurs ensemble ; codes par champ : q = TOO_LONG (plus de 200 caractères) ou INVALID_DATE (date invalide dans avant: ou après:), page = INVALID_PAGE (hors 1..500), from et to = INVALID_DATE, to = RANGE_INVERTED (to antérieur à from), types = UNKNOWN_TYPE, et INVALID_FORMAT sur le paramètre concerné pour une valeur non convertible (page non numérique, sessionId qui n''est pas un UUID, includeArchived non booléen, id qui n''est pas un UUID : field = id). Le contrôle de propriété passe avant les contrôles de q, page, from, to et types (patient d''un autre praticien : 403), mais pas avant INVALID_FORMAT, détecté à la conversion des paramètres.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : aucun patient avec cet identifiant.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Recherche des entrées dans le dossier d'un patient
      tags:
      - Recherche
