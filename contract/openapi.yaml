          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
        required: true
      responses:
        '204':
          description: 2FA désactivée, codes de secours retirés.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'TWO_FACTOR_NOT_ENABLED : la 2FA n''est pas active ; TWO_FACTOR_REQUIRED_FOR_ADMIN : un compte administrateur ne peut pas désactiver sa 2FA.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] : INVALID_PASSWORD (password), INVALID_CODE (code TOTP ou de secours incorrect), INVALID_FIELD (champ absent ou trop long).'
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ACCOUNT_LOCKED : 5 échecs, essais verrouillés 15 min ; retryAfterSeconds et en-tête Retry-After.'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai
              style: simple
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Désactive la 2FA (mot de passe et code TOTP ou de secours)
      tags:
      - Double authentification
  /api/me/2fa/enable:
    post:
      description: 'Session praticien. Première étape d''activation : génère un secret en attente et renvoie le secret Base32 et l''URI otpauth:// du QR code, montrés une seule fois. La 2FA n''est pas active tant que POST /api/me/2fa/verify n''a pas validé un premier code ; rappeler cette route avant la vérification remplace le secret en attente.'
