  /api/public/directory:
    get:
      description: 'Public, sans session ; limité à 60 requêtes par minute et par IP (429 RATE_LIMITED). Ne rend que les profils publiés. Les filtres se cumulent ; pour modalities, audiences et languages une fiche est retenue si elle a au moins une des valeurs demandées. Réponse paginée par page de 20 (page, totalPages) ; au plus 500 fiches sont examinées avant pagination, total et facettes portent sur ce lot. 200 avec Cache-Control: max-age=60, public.'
      operationId: searchPublicDirectory
      parameters:
      - description: 'Texte libre, 100 caractères au plus : tous les mots doivent correspondre, dans le nom, les codes de spécialités (ex. anxiety), la ville ou la présentation, sans tenir compte des accents ; un nom proche est aussi retenu. Absent : pas de filtre texte.'
        example: Lyon
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: Ville exacte, 100 caractères au plus, sans tenir compte de la casse ni des accents. Ignoré quand lat et lng sont fournis.
        example: Lyon
        in: query
        name: city
        required: false
        schema:
          type: string
      - description: 'Latitude du point de recherche en degrés, de -90 à 90 ; va avec lng. Ne rend que les fiches dont la position est renseignée, dans radiusKm, avec distanceKm. En V1 aucune fiche n''a encore de position : un filtre lat/lng ne renvoie aucun résultat.'
        example: 45.76
        in: query
        name: lat
        required: false
        schema:
          format: double
          type: number
      - description: Longitude du point de recherche en degrés, de -180 à 180 ; va avec lat.
        example: 4.84
        in: query
        name: lng
        required: false
        schema:
          format: double
          type: number
      - description: 'Rayon de recherche en kilomètres autour de lat et lng, de 0 (exclu) à 1000. Défaut : 25. Sans effet quand lat et lng sont absents.'
        example: 25
        in: query
        name: radiusKm
        required: false
        schema:
          format: double
          type: number
      - description: 'Professions retenues parmi psychologist, psychiatrist, coach : valeurs séparées par des virgules ou paramètre répété, 20 au plus. Absent : toutes.'
        example: psychologist,coach
        in: query
        name: professions
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Modalités retenues parmi in_person, video, home : valeurs séparées par des virgules ou paramètre répété, 20 au plus. Absent : toutes.'
        example: video
        in: query
        name: modalities
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Publics accueillis retenus (codes de GET /api/vocabulary/directory) : valeurs séparées par des virgules ou paramètre répété, 20 au plus. Absent : tous.'
        example: adults,adolescents
        in: query
        name: audiences
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Langues retenues, codes ISO 639-1 : valeurs séparées par des virgules ou paramètre répété, 20 au plus. Absent : toutes.'
        example: fr,en
        in: query
        name: languages
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'true pour ne garder que les praticiens qui acceptent de nouveaux patients (availability = accepting). Défaut : false.'
        example: false
        in: query
        name: accepting
        required: false
        schema:
          default: false
          type: boolean
      - description: 'Tri : relevance (pertinence du texte q, sinon publications les plus récentes), distance (plus proches d''abord, exige lat et lng, sinon ordre alphabétique) ou name (ordre alphabétique du nom affiché). Défaut : relevance.'
        example: relevance
        in: query
        name: sort
        required: false
        schema:
          enum:
          - relevance
          - distance
          - name
          type: string
      - description: 'Numéro de page, à partir de 1 ; 20 résultats par page. Défaut : 1.'
        example: 1
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SearchResult'
          description: Page de résultats avec facettes.
          headers:
            Cache-Control:
              description: max-age=60, public.
              schema:
                type: string
              style: simple
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'INVALID_PARAMETERS : errors[] {field, message} (pas de code par champ) ; champs : sort (hors relevance, distance, name), q et city (plus de 100 caractères), lat et lng (l''un sans l''autre, ou hors de -90 à 90 et -180 à 180), radiusKm (hors de 0 exclu à 1000), professions, modalities, audiences, languages (plus de 20 valeurs), page (inférieure à 1), ou tout paramètre dont la valeur n''a pas le bon type (nombre, booléen).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Recherche les praticiens publiés de l'annuaire
      tags:
      - Annuaire public
  /api/public/directory/practitioners/{slug}:
    get:
      description: 'Public, sans session ; limité à 60 requêtes par minute et par IP (429 RATE_LIMITED). Ne rend que les profils publiés. Téléphone, e-mail et adresse n''apparaissent que si le praticien a coché l''interrupteur correspondant, le numéro professionnel que s''il l''autorise ; les champs masqués sont null. 200 avec Cache-Control: max-age=60, public.'
      operationId: getPublicPractitionerProfile
      parameters:
      - description: Adresse publique (slug) du praticien, rendue par la recherche.
        example: claire-lambert
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicProfile'
          description: Fiche publique du praticien.
          headers:
            Cache-Control:
              description: max-age=60, public.
              schema:
                type: string
              style: simple
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PROFILE_NOT_FOUND : aucun profil publié avec cette adresse.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Rend la fiche publique d'un praticien publié
      tags:
      - Annuaire public
  /api/public/directory/practitioners/{slug}/contact:
    post:
      description: 'Public, sans session ; limité à 5 envois par heure et par IP (429 RATE_LIMITED avec Retry-After), en plus de 60 requêtes par minute et par IP. Répond 202 sans corps pour tout envoi bien formé, y compris un envoi ignoré en silence et sans trace : honeypot rempli, formulaire soumis en moins de 3 secondes ou dans le futur, profil inconnu ou non publié, praticien sans adresse de réception. Sinon le message est enregistré puis relayé par e-mail à l''adresse de contact du profil, à défaut à celle du compte ; un échec d''envoi ne remonte jamais au visiteur. Les demandes enregistrées sont purgées après 30 jours.'
      operationId: submitContactRequest
      parameters:
      - description: Adresse publique (slug) du praticien destinataire.
        example: claire-lambert
        in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitContactRequest'
        required: true
      responses:
        '202':
          description: Accepté, ou ignoré en silence ; aucun corps.
          headers:
            Cache-Control:
              description: no-store.
              schema:
                type: string
              style: simple
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'INVALID_BODY : corps JSON illisible (syntaxe ou type de champ invalide).'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, message} (pas de code par champ) ; champs : name, email, message (absent, vide ou trop long), email (adresse invalide), subject (plus de 200 caractères), consent (absent ou différent de true), formShownAt (absent).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : plus de 5 envois par heure depuis cette adresse IP ; en-tête Retry-After et champ retryAfterSeconds en secondes.'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Envoie un message au praticien (relayé par e-mail, non rattaché à un dossier)
      tags:
      - Contact public
  /api/sessions/{id}/close:
    post:
      description: Session praticien, propriétaire du patient de la séance. La durée (sinon la durée par défaut du praticien, 60 minutes à défaut), l'heure de fin et le compte rendu (summary) sont figés dans une nouvelle version, même dans la fenêtre de grâce de 1 h 15. Une séance ne se clôture qu'une fois. authorType et submissionId sont refusés (UNKNOWN_FIELD). Le corps est obligatoire, un objet vide convient.
      operationId: closeSession
      parameters:
      - description: Identifiant de la séance (entrée de type session).
        example: 3f8e2b1a-6c4d-4e57-9a0b-1d2c3e4f5a6b
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSessionRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntryDto'
          description: 'Séance clôturée : nouvelle version portant durée, fin et compte rendu.'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : identifiant de la séance qui n''est pas un UUID, ou corps JSON absent ou illisible.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : la séance appartient au dossier d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ENTRY_NOT_FOUND : séance inexistante.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'SESSION_ALREADY_CLOSED : la séance est déjà clôturée ; ENTRY_ARCHIVED : la séance est archivée.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'SESSION_INVALID : l''entrée désignée n''est pas une séance (code racine, errors[0].field = sessionId) ; VALIDATION_FAILED avec errors[] : durationMin OUT_OF_RANGE (hors 1 à 600) ou INVALID_FORMAT, UNKNOWN_FIELD si authorType ou submissionId est envoyé.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Clôture une séance ouverte en figeant durée, fin et compte rendu
      tags:
      - Séances
