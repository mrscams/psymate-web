          description: 'ADMIN_DOSSIER_NOT_REVIEWABLE : le compte n''est ni under_review ni needs_more ; ADMIN_APPROVAL_INCOMPLETE : approved sans force alors que des justificatifs ne sont pas conformes ou qu''il n''y en a aucun, la liste des identifiants à traiter est dans la propriété complémentaire pendingDocuments.'
