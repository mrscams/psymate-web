  /api/me/appeal:
    post:
      description: 'Public, sans session : le praticien s''identifie par {email, password, otp?} dans le corps, car son compte refusé ou suspendu ne peut plus se connecter. Le corps est validé en premier (422), sans consommer de tentative. Le compte doit être rejected ou suspended (409 sinon) ; si la 2FA est active et que otp manque, réponse 202 avec otpRequired et rien n''est enregistré. Un seul recours ouvert à la fois et un seul par décision contestée ; 5 échecs en 15 minutes verrouillent le couple e-mail et IP 15 minutes (423). Dépôt inscrit au journal d''administration ; 201 sans en-tête Location.'
      operationId: submitAppeal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AppealCreatedDto'
          description: Recours enregistré, au statut open ; en attente d'un administrateur.
        '202':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AppealOtpRequiredDto'
          description: 'Identifiants corrects, 2FA active et code absent : renvoyer la même requête avec otp. Rien n''est enregistré.'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : corps absent ou JSON illisible (code propre à ce module, à la place de MALFORMED_JSON).'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'INVALID_CREDENTIALS : e-mail inconnu, mot de passe incorrect ou code 2FA faux (message unique, sans indiquer lequel).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : mot de passe correct mais l''adresse e-mail n''a jamais été confirmée.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ACCOUNT_NOT_SUSPENDED : identifiants corrects mais le compte n''est ni refusé ni suspendu ; APPEAL_NOT_ALLOWED : aucune décision de refus ou de suspension à contester ; APPEAL_ALREADY_OPEN : un recours est déjà en attente ; APPEAL_ALREADY_USED : la décision contestée a déjà fait l''objet d''un recours examiné.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : REQUIRED (email, password, message), TOO_SHORT (message, moins de 20 caractères), TOO_LONG (message, plus de 4000 caractères).'
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ACCOUNT_LOCKED : 5 échecs d''identification en 15 minutes ; réessayer après retryAfterSeconds.'
          headers:
            Retry-After:
              description: Secondes à attendre avant un nouvel essai (15 minutes au plus).
              style: simple
      summary: Dépose le recours d'un compte refusé ou suspendu
      tags:
      - Recours
  /api/me/emotions:
