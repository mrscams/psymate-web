  /api/admin/verifications/{practitionerId}/decision:
    post:
      description: 'Administrateur avec 2FA. Décision append-only sur un compte en under_review ou needs_more (409 sinon) : approved passe le compte à approved, needs_more à needs_more, rejected à rejected (compte désactivé, sessions révoquées, purge du compte planifiée 30 jours plus tard). approved exige que tous les justificatifs non purgés soient conformes, sauf force=true avec une note interne. Le praticien reçoit un e-mail, envoyé de façon asynchrone après l''enregistrement ; les fichiers du dossier sont purgés 90 jours après la décision. Réponse 201 sans en-tête Location.'
