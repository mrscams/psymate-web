  /api/me/export:
    post:
      description: 'Public pour la chaîne de sécurité, contrôle fait par la route : compte approuvé connecté (session praticien, corps ignoré), ou compte refusé ou suspendu sans session, qui fournit {email, password, otp?} dans le corps. Un seul export en cours par compte. Réponse 202 asynchrone : jobId et statusUrl à interroger (GET /api/me/export/{jobId}), ou otpRequired sans création de job si la double authentification est active et que otp manque. Le zip (patients.md, puis un .md et un .pdf par patient) est conservé chiffré et téléchargeable 7 jours. Verrouillage de 15 minutes après 5 échecs d''authentification (423 Retry-After).'
      operationId: requestAccountExport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountExportRequest'
      responses:
        '202':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ExportRequestedDto'
                - $ref: '#/components/schemas/OtpRequiredDto'
          description: 'Deux corps possibles : {jobId, statusUrl} quand le job est créé ; {otpRequired: true} quand le code de double authentification manque (aucun job créé).'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'INVALID_CREDENTIALS : identifiants incorrects ou code 2FA faux.'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EXPORT_IN_PROGRESS : un export de ce compte est déjà en file ou en cours ; ACCOUNT_NOT_SUSPENDED : le compte n''est ni refusé ni suspendu (approuvé, en cours de vérification ou clos) : se connecter normalement.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] : email et password REQUIRED quand il n''y a ni session ni identifiants dans le corps.'
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ACCOUNT_LOCKED : 5 échecs d''identification en 15 minutes, réessayer après Retry-After.'
          headers:
            Retry-After:
              description: Secondes avant un nouvel essai.
              schema:
                type: integer
              style: simple
      summary: Lance l'export asynchrone de tous les patients du compte
      tags:
      - Export de compte
  /api/me/export/{jobId}:
    get:
      description: 'Public pour la chaîne de sécurité : praticien connecté propriétaire du job, ou porteur du paramètre token du statusUrl (compte suspendu sans session). À interroger jusqu''à ce que status vaille done ou failed. downloadUrl n''est renseigné que si le job est terminé et le lien non expiré (7 jours). Un job inconnu, d''un autre praticien ou un jeton faux donnent le même 404, pour ne rien révéler.'
      operationId: getAccountExport
      parameters:
      - description: Identifiant du job d'export.
        example: 5c1d7e2a-8b3f-4a69-b0d4-7e6f5a4b3c2d
        in: path
        name: jobId
        required: true
        schema:
          format: uuid
          type: string
      - description: Jeton de suivi porté par le statusUrl, pour un compte sans session. Inutile quand le praticien propriétaire du job est connecté.
        example: Zm9vYmFy
        in: query
        name: token
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ExportStatusDto'
          description: Statut du job d'export.
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EXPORT_NOT_FOUND : job inconnu, d''un autre praticien, ou jeton token absent ou invalide.'
      summary: Donne le statut d'un export de compte
      tags:
      - Export de compte
  /api/me/export/{jobId}/file:
    get:
      description: 'Public pour la chaîne de sécurité : l''autorisation est la signature (paramètres exp et sig) de la downloadUrl renvoyée par GET /api/me/export/{jobId}, valable 7 jours. Renvoie le zip déchiffré en pièce jointe (Content-Disposition attachment, nom export-psymate-AAAAMMJJ.zip). Passé l''échéance ou une fois le fichier purgé : 410.'
      operationId: downloadAccountExport
      parameters:
      - description: Identifiant du job d'export.
        example: 5c1d7e2a-8b3f-4a69-b0d4-7e6f5a4b3c2d
        in: path
        name: jobId
        required: true
        schema:
          format: uuid
          type: string
      - description: Échéance du lien, en secondes depuis l'epoch UTC, telle que signée.
        example: 1793649600
        in: query
        name: exp
        required: false
        schema:
          type: string
      - description: Signature du lien, telle que renvoyée dans downloadUrl.
        example: q3Zk0w
        in: query
        name: sig
        required: false
        schema:
          type: string
      responses:
        '200':
