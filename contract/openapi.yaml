          type: string
        occurredFrom:
          description: Début de la séance (occurred_from), UTC ISO 8601.
          example: 2026-03-07T09:00:00Z
          format: date-time
          type: string
        summary:
          description: Compte rendu entier, pour la séance la plus récente seulement ; null pour les autres ou sans compte rendu.
