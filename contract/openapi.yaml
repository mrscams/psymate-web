            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: TWO_FACTOR_ALREADY_ENABLED
      summary: Génère le secret TOTP (en attente) et l'URI otpauth:// du QR code
      tags:
