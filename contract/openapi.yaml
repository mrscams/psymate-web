      description: Une entrée trouvée. title et snippet sont des fragments HTML échappés.
      properties:
        approximate:
          description: true pour un résultat approché (tolérance aux fautes)
          type: boolean
        archivedAt:
          format: date-time
          type: string
        emotionCode:
          description: Code de l'émotion pour un ressenti, sinon null
