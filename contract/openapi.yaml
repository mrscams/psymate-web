              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReactivateDto'
          description: Compte réactivé, avec son nouveau statut.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : corps absent ou JSON illisible (code propre à ce module).'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ADMIN_PRACTITIONER_NOT_FOUND : aucun compte avec cet identifiant.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ADMIN_ACCOUNT_NOT_REACTIVABLE : le compte n''est ni suspended ni rejected.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : REQUIRED, TOO_SHORT (moins de 20 caractères), TOO_LONG (plus de 4000 caractères) sur le champ reason.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Réactive un compte suspendu ou refusé avec un motif obligatoire
      tags:
      - 'Administration : praticiens'
  /api/admin/practitioners/{id}/suspend:
    post:
      description: 'Administrateur avec 2FA. Le motif (20 à 4000 caractères) est contrôlé en premier. Impossible sur un compte déjà suspended, rejected ou closed, sur soi-même, ni sur le dernier administrateur actif. Effets : statut suspended, toutes les sessions révoquées, décision suspended et ligne admin.suspend au journal (le statut précédent y est conservé pour la réactivation), fiche d''annuaire publique dépubliée par événement, e-mail au praticien envoyé de façon asynchrone après l''enregistrement. Le praticien peut alors déposer un recours.'
      operationId: suspendAdminPractitioner
      parameters:
      - description: Identifiant du compte à suspendre.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuspendDto'
          description: Compte suspendu.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : corps absent ou JSON illisible (code propre à ce module).'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ADMIN_PRACTITIONER_NOT_FOUND : aucun compte avec cet identifiant.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ADMIN_SELF_SUSPEND : l''administrateur vise son propre compte ; ADMIN_ACCOUNT_NOT_SUSPENDABLE : le compte est déjà suspended, rejected ou closed ; ADMIN_LAST_ADMIN : la cible est le dernier administrateur actif.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : REQUIRED, TOO_SHORT (moins de 20 caractères), TOO_LONG (plus de 4000 caractères) sur le champ reason.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Suspend un compte avec un motif obligatoire
      tags:
      - 'Administration : praticiens'
  /api/admin/verifications:
    get:
      description: 'Administrateur avec 2FA. Renvoie les dossiers de praticiens (jamais les administrateurs) dans l''état demandé : under_review (soumis, en attente de décision, par défaut) ou needs_more (complément demandé). Triés par date de soumission, à défaut par dernière mise à jour du compte : du plus ancien (oldest, par défaut) au plus récent (newest). overdue signale un dossier under_review en attente depuis plus de 2 jours ouvrés. Pagination par curseur opaque : limit 50 par défaut, bornée à 1..200 sans erreur ; nextCursor est null sur la dernière page.'
      operationId: listAdminVerifications
      parameters:
      - description: 'Statut des dossiers à lister : under_review (défaut) ou needs_more. Autre valeur : 422 INVALID_STATUS.'
        example: under_review
        in: query
        name: status
        required: false
        schema:
          default: under_review
          enum:
          - under_review
          - needs_more
          type: string
      - description: 'Ordre de tri par date de soumission : oldest (défaut, du plus ancien au plus récent) ou newest. Autre valeur : 422 INVALID_SORT.'
        example: oldest
        in: query
        name: sort
        required: false
        schema:
          default: oldest
          enum:
          - oldest
          - newest
          type: string
      - description: 'Curseur opaque (nextCursor de la page précédente, à renvoyer tel quel) ; absent pour la première page. Illisible : 422 INVALID_CURSOR.'
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 'Nombre maximal de dossiers par page : 50 par défaut, ramené dans l''intervalle 1 à 200 sans erreur.'
        example: 50
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueueDto'
          description: Page de la file.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : INVALID_STATUS (status, autre que under_review ou needs_more), INVALID_SORT (sort, autre que oldest ou newest), INVALID_CURSOR (cursor illisible).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Liste la file des dossiers de vérification à traiter
      tags:
      - 'Administration : vérifications'
  /api/admin/verifications/{practitionerId}:
