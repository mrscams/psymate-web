      description: Session praticien. L'émotion lui appartient et reste invisible aux autres praticiens ; son code est généré (« c_ » plus 8 caractères hexadécimaux) et son niveau d'intensité est non renseigné. Elle devient aussitôt disponible dans GET /api/vocabulary/emotions. Réponse 201 avec l'émotion.
