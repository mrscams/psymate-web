              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : REQUIRED (linkType) ; UNKNOWN_LINK_TYPE (linkType absent du catalogue ou inactif) ; LINK_TYPE_NOT_ALLOWED (linkType interdit pour ce couple de types d''entrées : allowedLinkTypes[] {code, label} liste les types possibles, vide si aucun).'
