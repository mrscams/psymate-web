  /api/patients/{id}/graph:
    get:
      description: 'Session praticien propriétaire du patient. Seuls les liens acceptés et les entrées non archivées du patient figurent dans le graphe. Avec root : voisinage de cette entrée à depth sauts ; sans root : les entrées les plus liées du patient, toutes à distance 1. La racine est toujours rendue, même hors de la période from/to. Au-delà de 150 nœuds, les nœuds de degré 1 d''un même type reliés au même voisin sont regroupés en super-nœuds (à développer par POST /api/patients/{id}/graph/expand), puis les nœuds les plus éloignés sont retirés ; truncated vaut alors true. Réponse non paginée.'
      operationId: getPatientGraph
      parameters:
      - description: Identifiant du patient.
        example: 3f1c8e52-7a4d-4b9e-8c60-1d2e3f4a5b6c
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Entrée racine du voisinage. Absent : les entrées les plus liées du patient (150 au plus), toutes à distance 1.'
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: query
        name: root
        required: false
        schema:
          format: uuid
          type: string
      - description: Nombre de sauts depuis la racine, de 1 à 3, défaut 2 (422 OUT_OF_RANGE sinon, même sans root) ; ignoré pour le voisinage quand root est absent.
        example: 2
        in: query
        name: depth
        required: false
        schema:
          default: 2
          format: int32
          maximum: 3
          minimum: 1
          type: integer
      - description: 'Codes de types de liens suivis, parmi ceux de GET /api/vocabulary/link-types : liste séparée par des virgules ou paramètre répété. Absent : tous les types.'
        example: triggers,worsens
        in: query
        name: linkTypes
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Borne basse incluse sur la date de début (occurred) des nœuds, ISO 8601 UTC. Absent : pas de borne.'
        example: 2026-01-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
      - description: 'Borne haute exclue sur la date de début (occurred) des nœuds, ISO 8601 UTC. Absent : pas de borne.'
        example: 2026-07-01T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GraphDto'
          description: 'Graphe : nodes, edges, superNodes et truncated (nodes limité à 150).'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : patient inexistant ; ENTRY_NOT_FOUND : la racine root n''existe pas ou appartient à un patient d''un autre praticien.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ENTRY_ARCHIVED : la racine root est archivée, errors[] porte le champ root.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message}, une entrée par paramètre fautif ; codes de champ : OUT_OF_RANGE (depth hors de 1 à 3), INVALID_TIME (from postérieur à to), INVALID_VALUE (linkTypes contient un code absent du catalogue ou inactif) ; DIFFERENT_PATIENT (root : entrée d''un autre patient du même praticien).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Rend le graphe de liens autour d'une entrée ou, sans racine, du dossier du patient
      tags:
      - Graphe
  /api/patients/{id}/graph/expand:
    post:
      description: 'Session praticien propriétaire du patient. Le corps contient exactement un de superNodeId (identifiant d''un élément de superNodes d''un graphe déjà reçu) et memberIds (1 à 500 identifiants d''entrées vivantes du patient, sans doublon). Rend les membres (à distance 1, avec leur degré dans tout le dossier) et les liens acceptés incidents à au moins l''un d''eux ; superNodes est toujours vide. Un super-nœud se développe sans les filtres du graphe d''origine et au plus 500 membres sont rendus : truncated vaut alors true. Réponse non paginée.'
      operationId: expandGraphGroup
      parameters:
      - description: Identifiant du patient.
        example: 3f1c8e52-7a4d-4b9e-8c60-1d2e3f4a5b6c
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpandGraphRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GraphDto'
          description: Membres du groupe et arêtes incidentes (superNodes vide).
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : corps JSON absent ou illisible sans champ identifiable.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : patient inexistant ; SUPER_NODE_NOT_FOUND : le groupe superNodeId n''existe plus (entrée pivot absente ou archivée, aucun membre vivant du type).'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : INVALID_VALUE (superNodeId : ni superNodeId ni memberIds, ou les deux ; memberIds : doublon ou élément nul), INVALID_FORMAT (superNodeId qui n''est pas de la forme sn:{uuid}:{type d''entrée} ; memberIds contenant un non-UUID), REQUIRED (memberIds vide), OUT_OF_RANGE (memberIds de plus de 500 éléments), ENTRY_NOT_FOUND (memberIds : une entrée est inexistante, archivée ou d''un autre patient).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Développe un super-nœud ou une liste d'entrées du graphe
      tags:
      - Graphe
  /api/patients/{id}/overview:
    get:
      description: 'Session praticien propriétaire du patient (fonctionne aussi pour un patient archivé). Une seule réponse porte tout : faits clés, situations actives, tendance d''intensité (moyenne glissante sur 7 jours, 90 points au plus, repères de séances et de médicaments), émotions dominantes comparées à la fenêtre précédente, ressentis réels, brouillons, entrées depuis la dernière séance, 5 séances récentes et résumé « En bref » rédigé par règles, sans IA, dans la langue d''Accept-Language (français par défaut). La fenêtre window borne la tendance, les émotions et les ressentis. Les données viennent d''une projection recalculée à la volée si elle est en retard sur le dossier : la réponse n''est jamais obsolète ; recentActivity est lu en direct. Entrées archivées exclues, entrées privées du praticien incluses.'
      operationId: getPatientOverview
      parameters:
      - description: Identifiant du patient.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Fenêtre de la tendance, des émotions dominantes et des ressentis, jusqu''à aujourd''hui (jours UTC) : 30d = 30 jours, 90d = 90 jours (défaut), 12m = 12 mois (un point par semaine). Absent ou vide : 90d.'
        example: 90d
        in: query
        name: window
        required: false
        schema:
          default: 90d
          enum:
          - 30d
          - 90d
          - 12m
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OverviewDto'
          description: Synthèse du patient pour la fenêtre demandée.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'OVERVIEW_BAD_REQUEST : paramètre invalide, errors[] {field, code, message} avec field = window et code = INVALID_WINDOW (valeur autre que 30d, 90d, 12m ; la casse compte). Le contrôle de propriété passe avant : un patient d''un autre praticien reste en 403.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : aucun patient avec cet identifiant.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Synthèse clinique d'un patient sur une fenêtre de temps
      tags:
      - Vue d'ensemble
  /api/patients/{id}/restore:
    post:
      description: 'Session praticien propriétaire du patient. Lève l''archivage : le patient réapparaît dans la liste par défaut et accepte de nouveau les écritures. Contrairement aux autres écritures, la restauration est acceptée sur un patient archivé. Idempotent : sur un patient actif, renvoie la fiche inchangée en 200. Aucun corps de requête.'
