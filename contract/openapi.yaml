                $ref: '#/components/schemas/ProblemDetail'
          description: 'DOCUMENT_FORBIDDEN : le justificatif appartient à un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
