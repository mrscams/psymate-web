components:
  schemas:
    AccountDetailDto:
      description: 'Détail d''un compte : mêmes champs que dans la liste, plus l''historique des décisions et des recours.'
      properties:
        appeals:
          description: Recours déposés par le praticien, du plus récent au plus ancien.
          items:
            $ref: '#/components/schemas/AppealSummaryDto'
          type: array
        city:
          description: Ville du cabinet ; null si aucune adresse n'a été renseignée.
          example: Lyon
          type: string
        createdAt:
          description: Date-heure UTC (ISO 8601) de création du compte.
          example: 2026-03-10T14:00:00Z
          format: date-time
          type: string
        decisions:
          description: Décisions prises sur ce compte (vérification, suspension, réactivation, recours), de la plus récente à la plus ancienne.
          items:
            $ref: '#/components/schemas/DecisionItemDto'
          type: array
        displayName:
          description: Nom d'affichage.
          example: Claire Martin
          type: string
        email:
          description: Adresse e-mail de connexion.
          example: claire.martin@example.org
          type: string
        id:
          description: Identifiant du compte.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        lastLoginAt:
          description: Date-heure UTC (ISO 8601) de la dernière connexion ; null si le compte ne s'est jamais connecté.
          example: 2026-03-20T07:45:00Z
          format: date-time
          type: string
        profession:
          description: Profession déclarée.
          enum:
          - psychologist
          - psychiatrist
          - coach
          type: string
        purgeAt:
          description: 'Date-heure UTC (ISO 8601) de la purge planifiée du compte : 30 jours après le refus du dossier ; null sinon (effacée à la réactivation).'
          example: 2026-05-02T10:00:00Z
          format: date-time
          type: string
        role:
          description: 'Rôle du compte : practitioner ou admin.'
          enum:
          - practitioner
          - admin
          type: string
        suspendedAt:
          description: Date-heure UTC (ISO 8601) de la suspension ou du refus ; null si le compte n'est ni suspendu ni refusé (effacée à la réactivation).
          example: 2026-04-02T10:00:00Z
          format: date-time
          type: string
        twoFactorEnabled:
          description: Vrai si la double authentification est activée sur le compte.
          type: boolean
        verification:
          $ref: '#/components/schemas/AccountVerificationDto'
          description: État de vérification du compte.
      type: object
    AccountExportRequest:
      description: Identifiants d'un compte refusé ou suspendu, qui n'a pas de session. Ignoré (et facultatif) quand le praticien est connecté ; obligatoire sinon (email et password REQUIRED).
      properties:
        email:
          description: Adresse e-mail du compte. Obligatoire sans session.
          example: dr.martin@example.org
          type: string
        otp:
          description: 'Code de double authentification du compte. Absent : si la double authentification est active, la réponse 202 demande le code (otpRequired).'
          example: '123456'
          type: string
        password:
          description: Mot de passe du compte. Obligatoire sans session.
          type: string
      type: object
    AccountItemDto:
      description: Compte d'un praticien ou d'un administrateur dans la liste d'administration.
      properties:
        city:
          description: Ville du cabinet ; null si aucune adresse n'a été renseignée.
          example: Lyon
          type: string
        createdAt:
          description: Date-heure UTC (ISO 8601) de création du compte.
          example: 2026-03-10T14:00:00Z
          format: date-time
          type: string
        displayName:
          description: Nom d'affichage.
          example: Claire Martin
          type: string
        email:
          description: Adresse e-mail de connexion.
          example: claire.martin@example.org
          type: string
        id:
          description: Identifiant du compte.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        lastLoginAt:
          description: Date-heure UTC (ISO 8601) de la dernière connexion ; null si le compte ne s'est jamais connecté.
          example: 2026-03-20T07:45:00Z
          format: date-time
          type: string
        profession:
          description: Profession déclarée.
          enum:
          - psychologist
          - psychiatrist
          - coach
          type: string
        purgeAt:
          description: 'Date-heure UTC (ISO 8601) de la purge planifiée du compte : 30 jours après le refus du dossier ; null sinon (effacée à la réactivation).'
          example: 2026-05-02T10:00:00Z
          format: date-time
          type: string
        role:
          description: 'Rôle du compte : practitioner ou admin.'
          enum:
          - practitioner
          - admin
          type: string
        suspendedAt:
          description: Date-heure UTC (ISO 8601) de la suspension ou du refus ; null si le compte n'est ni suspendu ni refusé (effacée à la réactivation).
          example: 2026-04-02T10:00:00Z
          format: date-time
          type: string
        twoFactorEnabled:
          description: Vrai si la double authentification est activée sur le compte.
          type: boolean
        verification:
          $ref: '#/components/schemas/AccountVerificationDto'
          description: État de vérification du compte.
      type: object
    AccountListDto:
      description: Page de comptes, triés du plus récemment créé au plus ancien, avec le nombre de comptes par statut.
      properties:
        counts:
          additionalProperties:
            format: int32
            type: integer
          description: Nombre de comptes par statut, avec les clés approved, under_review, needs_more, suspended et rejected (0 si aucun). Calculé sur tous les comptes qui respectent q, role et profession, sans tenir compte du filtre status ni de la pagination, pour que les onglets restent justes.
          type: object
        items:
          description: Comptes de la page.
          items:
            $ref: '#/components/schemas/AccountItemDto'
          type: array
        nextCursor:
          description: Curseur opaque à renvoyer dans le paramètre cursor pour la page suivante ; null sur la dernière page.
          type: string
      type: object
    AccountVerificationDto:
      description: 'État de vérification d''un compte : statut, date d''entrée dans ce statut et retard de traitement.'
      properties:
        overdue:
          description: Vrai si le dossier est under_review depuis plus de 2 jours ouvrés après sa soumission ; faux pour tout autre statut.
          type: boolean
        since:
          description: 'Date-heure UTC (ISO 8601) d''entrée dans le statut courant : approbation pour approved, soumission pour under_review, suspension ou refus pour suspended, rejected et closed ; à défaut, dernière mise à jour du compte.'
          example: 2026-03-15T08:00:00Z
          format: date-time
          type: string
        status:
          description: 'Statut : email_pending (e-mail à confirmer), docs_pending (justificatifs à déposer), under_review (dossier soumis, en attente d''un administrateur), approved, needs_more (complément demandé), rejected (dossier refusé), suspended ou closed.'
          enum:
          - email_pending
          - docs_pending
          - under_review
          - approved
          - needs_more
          - rejected
          - suspended
          - closed
          type: string
      type: object
    ActiveMedicationDto:
      description: Médicament en cours.
      properties:
        dosage:
          description: Dosage ; null si non saisi.
          example: 50 mg
          type: string
        entryId:
          description: Identifiant de l'entrée médicament.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        frequency:
          description: Fréquence de prise ; null si non saisie.
          example: matin
          type: string
        molecule:
          description: Molécule.
          example: sertraline
          type: string
        periodFrom:
          description: Début de la période de prise AAAA-MM-JJ ; null si non saisi.
          example: 2026-01-10T00:00:00Z
          format: date
          type: string
        periodTo:
          description: Fin de la période de prise AAAA-MM-JJ ; null si non saisie (traitement en cours).
          example: 2026-06-30T00:00:00Z
          format: date
          type: string
        prescriber:
          description: Prescripteur ; null si non saisi.
          example: Dr Martin
          type: string
        since:
          description: Début de l'entrée (occurred_from), UTC ISO 8601.
          example: 2026-01-10T08:00:00Z
          format: date-time
          type: string
      type: object
    ActiveSituationDto:
      description: Situation en cours (occurred_to nul).
      properties:
        averageIntensity:
          description: Moyenne des intensités (0 à 10, deux décimales) de ces ressentis ; null s'il n'y en a aucun.
          example: 6.5
          format: double
          type: number
        entryId:
          description: Identifiant de l'entrée situation.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        linkCount:
          description: Nombre de liens de la situation.
          example: 3
          format: int32
          type: integer
        linkedFeelingCount:
          description: Ressentis non archivés reliés par un lien accepté, dans un sens ou l'autre.
          example: 2
          format: int32
          type: integer
        since:
          description: Début de la situation (occurred_from), UTC ISO 8601.
          example: 2026-02-01T00:00:00Z
          format: date-time
          type: string
        title:
          description: Titre de la situation ; null si elle n'en a pas.
          example: Conflit au travail
          type: string
      type: object
    ActorDto:
      description: Administrateur auteur d'un événement du journal.
      properties:
        displayName:
          description: Nom d'affichage de l'administrateur.
          example: Julien Bernard
          type: string
        id:
          description: Identifiant de l'administrateur.
          example: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
          format: uuid
          type: string
      type: object
    Address:
      description: Adresse du cabinet. Obligatoire (rue, code postal, ville) sauf si remoteOnly vaut true ; contrôlée par le service, erreurs par champ en 422 VALIDATION_FAILED.
      properties:
        city:
          description: Ville (100 caractères au maximum).
          example: Paris
          maxLength: 100
          minLength: 0
          type: string
        postalCode:
          description: Code postal français à 5 chiffres (POSTAL_CODE_INVALID sinon ; 20 caractères au maximum acceptés en entrée).
          example: '75002'
          maxLength: 20
          minLength: 0
          type: string
        street:
          description: Numéro et nom de la rue (200 caractères au maximum).
          example: 12 rue de la Paix
          maxLength: 200
          minLength: 0
          type: string
      type: object
    AddressDto:
      description: Adresse du cabinet. En lecture, chaque champ vaut null s'il n'est pas renseigné ; en écriture (PATCH /api/me/professional-info), un champ absent ou null est inchangé et une chaîne vide l'efface.
      properties:
        city:
          description: Ville (200 caractères au maximum) ; null si absente.
          example: Paris
          type: string
        postalCode:
          description: Code postal (200 caractères au maximum) ; null si absent.
          example: '75002'
          type: string
        street:
          description: Numéro et nom de la rue (200 caractères au maximum) ; null si absent.
          example: 12 rue de la Paix
          type: string
      type: object
    AdminAddressDto:
      description: Adresse professionnelle du praticien, telle que saisie dans son profil.
      properties:
        city:
          description: Ville ; null si non renseignée.
          type: string
        postalCode:
          description: Code postal ; null si non renseigné.
          type: string
        street:
          description: Numéro et nom de la rue ; null si non renseigné.
          type: string
      type: object
    AdminDecisionDto:
      description: Décision enregistrée sur un dossier, avec le nouvel état de vérification.
      properties:
        adminId:
          description: Identifiant de l'administrateur qui a décidé.
          example: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
          format: uuid
          type: string
        checklist:
          additionalProperties: {}
          description: Liste de contrôle enregistrée ; objet vide s'il n'y en avait pas.
          type: object
        decidedAt:
          description: Date-heure UTC (ISO 8601) de la décision.
          example: 2026-03-15T08:00:00Z
          format: date-time
          type: string
        id:
          description: Identifiant de la décision créée.
          example: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
          format: uuid
          type: string
        internalNote:
          description: Note interne enregistrée (blancs de bord retirés) ; null si absente.
          type: string
        kind:
          description: Issue enregistrée.
          enum:
          - approved
          - needs_more
          - rejected
          type: string
        messageToPractitioner:
          description: Message au praticien enregistré (blancs de bord retirés) ; null si absent.
          type: string
        verificationStatus:
          description: 'État de vérification du compte après la décision : approved, needs_more ou rejected.'
          enum:
          - approved
          - needs_more
          - rejected
          type: string
      type: object
    AdminDocumentDto:
      description: Justificatif du dossier de vérification d'un praticien. Le contenu ne s'ouvre que par une URL signée (getAdminDocumentUrl).
      properties:
        id:
          description: Identifiant du justificatif.
          example: 4d8f1e52-7a3b-4c19-8e60-1f2a3b4c5d6e
          format: uuid
          type: string
        issuer:
          description: Organisme émetteur ; null si non renseigné.
          example: Université Lyon 2
          type: string
        mime:
          description: Type MIME du fichier.
          enum:
          - application/pdf
          - image/jpeg
          - image/png
          type: string
        purged:
          description: 'Vrai si le fichier a été purgé (90 jours après la décision) : il n''est plus téléchargeable (410 ADMIN_DOCUMENT_PURGED), seules les métadonnées restent.'
          type: boolean
        reviewedAt:
          description: Date-heure UTC (ISO 8601) de la dernière qualification ; null tant que le justificatif n'a pas été qualifié.
          example: 2026-03-14T10:05:00Z
          format: date-time
          type: string
        reviewedStatus:
          description: 'Qualification par l''administration : pending (pas encore examiné), conform ou non_conform.'
          enum:
          - pending
          - conform
          - non_conform
          type: string
        sizeBytes:
          description: Taille du fichier en octets (10 Mo au plus).
          example: 482113
          format: int32
          type: integer
        title:
          description: Intitulé donné par le praticien.
          example: Master de psychologie
          type: string
        type:
          description: Nature de la pièce.
          enum:
          - diploma
          - registration
          - certification
          - professional_card
          - identity
          - other
          type: string
        uploadedAt:
          description: Date-heure UTC (ISO 8601) du dépôt.
          example: 2026-03-14T09:12:00Z
          format: date-time
          type: string
        year:
          description: Année d'obtention (1950 à 2100) ; null si non renseignée.
          example: 2014
          format: int32
          type: integer
      type: object
    AdminSignedUrlDto:
      description: URL signée et éphémère pour ouvrir un justificatif.
      properties:
        expiresAt:
          description: Date-heure UTC (ISO 8601) d'expiration, 5 minutes après l'émission.
          example: 2026-03-15T08:05:00Z
          format: date-time
          type: string
        url:
          description: Chemin relatif de l'API (getAdminDocumentFile) avec exp et sig en paramètres de requête ; valable uniquement pour l'administrateur qui l'a demandée.
          example: /api/admin/verifications/9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e/documents/4d8f1e52-7a3b-4c19-8e60-1f2a3b4c5d6e/file?exp=1773564900&sig=Zm9v
          type: string
      type: object
    AppealCreatedDto:
      description: Recours enregistré.
      properties:
        id:
          description: Identifiant du recours créé.
          example: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
          format: uuid
          type: string
        status:
          description: Statut du recours, toujours open à la création.
          example: open
          type: string
        submittedAt:
          description: Date-heure UTC (ISO 8601) du dépôt.
          example: 2026-04-03T09:00:00Z
          format: date-time
          type: string
      type: object
    AppealDecisionRequest:
      description: Décision d'un administrateur sur un recours ouvert.
      properties:
        messageToPractitioner:
          description: Réponse transmise au praticien par e-mail, obligatoire (422 REQUIRED), 4000 caractères au plus (422 TOO_LONG).
          maxLength: 4000
          type: string
        outcome:
          description: 'Issue : accepted (le compte est réactivé) ou dismissed (le compte reste inchangé). Autre valeur : 422 INVALID_OUTCOME.'
          enum:
          - accepted
          - dismissed
          type: string
      required:
      - messageToPractitioner
      - outcome
      type: object
    AppealItemDto:
      description: Recours vu par l'administration, avec la décision contestée et l'issue éventuelle.
      properties:
        decisionAdminId:
          description: Administrateur auteur de la décision contestée ; il ne peut pas examiner le recours (409 APPEAL_SELF_REVIEW).
          example: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
          format: uuid
          type: string
        decisionId:
          description: Identifiant de la décision contestée (dernier refus ou dernière suspension).
          example: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
          format: uuid
          type: string
        decisionKind:
          description: 'Nature de la décision contestée : rejected (dossier refusé) ou suspended.'
          enum:
          - rejected
          - suspended
          type: string
        id:
          description: Identifiant du recours.
          example: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
          format: uuid
          type: string
        message:
          description: Message du praticien (20 à 4000 caractères).
          type: string
        outcome:
          description: 'Issue : accepted (compte réactivé) ou dismissed (recours écarté) ; null tant que le recours est ouvert.'
          enum:
          - accepted
          - dismissed
          type: string
        practitionerDisplayName:
          description: Nom d'affichage du praticien.
          example: Claire Martin
          type: string
        practitionerId:
          description: Identifiant du praticien qui conteste.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        responseMessage:
          description: Réponse de l'administrateur au praticien ; null tant que le recours est ouvert.
          type: string
        reviewedAt:
          description: Date-heure UTC (ISO 8601) de l'examen ; null tant que le recours est ouvert.
          example: 2026-04-05T14:00:00Z
          format: date-time
          type: string
        reviewedBy:
          description: Administrateur qui a examiné le recours ; null tant que le recours est ouvert.
          format: uuid
          type: string
        submittedAt:
          description: Date-heure UTC (ISO 8601) du dépôt.
          example: 2026-04-03T09:00:00Z
          format: date-time
          type: string
      type: object
    AppealListDto:
      description: Page de recours.
      properties:
        items:
          description: 'Recours de la page : du plus ancien au plus récent pour status=open, du plus récent au plus ancien pour decided et all.'
          items:
            $ref: '#/components/schemas/AppealItemDto'
          type: array
        nextCursor:
          description: Curseur opaque à renvoyer dans le paramètre cursor pour la page suivante ; null sur la dernière page.
          type: string
      type: object
    AppealOtpRequiredDto:
      description: 'Corps du 202 : le mot de passe est correct, la double authentification est active et le code est absent ; rien n''a été enregistré, renvoyer la demande avec otp.'
      properties:
        otpRequired:
          description: Toujours vrai.
          example: true
          type: boolean
      type: object
    AppealRequest:
      description: 'Dépôt d''un recours par un praticien dont le compte est refusé ou suspendu. Public : le praticien s''identifie par son e-mail et son mot de passe dans le corps, car il n''a pas de session.'
      properties:
        email:
          description: Adresse e-mail du compte (insensible à la casse).
          example: claire.martin@example.org
          type: string
        message:
          description: 'Argumentaire du recours, de 20 à 4000 caractères après suppression des blancs de bord. Erreurs 422 : REQUIRED, TOO_SHORT, TOO_LONG.'
          maxLength: 4000
          minLength: 20
          type: string
        otp:
          description: Code à usage unique de la double authentification (ou code de secours) ; obligatoire si la 2FA est active, sinon la réponse est 202 avec otpRequired. Facultatif sinon.
          example: '123456'
          type: string
          writeOnly: true
        password:
          description: Mot de passe du compte.
          type: string
          writeOnly: true
      required:
      - email
      - message
      - password
      type: object
    AppealSummaryDto:
      description: Résumé d'un recours déposé par le praticien, dans le détail de son compte.
      properties:
        decisionId:
          description: Identifiant de la décision (refus ou suspension) contestée.
          example: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
          format: uuid
          type: string
        id:
          description: Identifiant du recours.
          example: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
          format: uuid
          type: string
        message:
          description: Message du praticien (20 à 4000 caractères).
          type: string
        outcome:
          description: 'Issue : accepted (compte réactivé) ou dismissed (recours écarté) ; null tant que le recours est ouvert.'
          enum:
          - accepted
          - dismissed
          type: string
        responseMessage:
          description: Réponse de l'administrateur au praticien ; null tant que le recours est ouvert.
          type: string
        reviewedAt:
          description: Date-heure UTC (ISO 8601) de l'examen ; null tant que le recours est ouvert.
          example: 2026-04-05T14:00:00Z
          format: date-time
          type: string
        submittedAt:
          description: Date-heure UTC (ISO 8601) du dépôt du recours.
          example: 2026-04-03T09:00:00Z
          format: date-time
          type: string
      type: object
    Card:
      description: Fiche résumée d'un praticien publié dans les résultats de recherche (sans coordonnées).
      properties:
        audiences:
          description: Codes de publics accueillis (référentiel GET /api/vocabulary/directory). Liste vide si aucun.
          items:
            type: string
          type: array
        availability:
          description: 'Disponibilité : accepting (accepte de nouveaux patients), waitlist (liste d''attente), closed (complet), unknown (non renseignée).'
          enum:
          - accepting
          - waitlist
          - closed
          - unknown
          example: accepting
          type: string
        bioExcerpt:
          description: Début de la présentation, 200 caractères au plus, coupé au dernier mot et suivi de « … » s'il est tronqué ; null si le praticien n'en a pas.
          type: string
        city:
          description: Ville ; null si non renseignée.
          example: Lyon
          type: string
        displayName:
          description: Nom affiché.
          example: Claire Lambert
          type: string
        distanceKm:
          description: Distance en kilomètres au point lat/lng de la recherche, arrondie au dixième ; null sans lat et lng.
          example: 3.4
          format: double
          type: number
        languages:
          description: Langues de consultation, codes ISO 639-1. Liste vide si aucune.
          items:
            type: string
          type: array
        modalities:
          description: 'Modalités de consultation : in_person, video, home. Liste vide si aucune.'
          items:
            type: string
          type: array
        photoUrl:
          description: URL de la photo ; null (aucune route publique ne sert encore les photos).
          type: string
        profession:
          description: 'Profession : psychologist, psychiatrist ou coach.'
          example: psychologist
          type: string
        slug:
          description: Adresse publique du praticien, à passer à la fiche détaillée.
          example: claire-lambert
          type: string
        specialties:
          description: Codes de spécialités (référentiel GET /api/vocabulary/directory). Liste vide si aucune.
          items:
            type: string
          type: array
        titleLabel:
          description: Intitulé libre affiché sous le nom ; null si vide.
          example: Psychologue clinicienne
          type: string
        verified:
          description: true si le dossier du praticien est approuvé par l'administration (badge vérifié).
          type: boolean
      type: object
    ChangeLinkTypeRequest:
      description: Nouveau type d'un lien existant ; les extrémités ne changent pas.
      properties:
        linkType:
          description: Code du nouveau type de lien, parmi ceux de GET /api/vocabulary/link-types ; il doit être autorisé pour le couple de types des deux entrées et différent du type actuel (sinon 409 LINK_EXISTS).
          example: worsens
          minLength: 1
          type: string
      required:
      - linkType
      type: object
    CloseSessionRequest:
      description: Clôture d'une séance ouverte. authorType et submissionId sont refusés (UNKNOWN_FIELD).
      properties:
        durationMin:
          description: 'Durée de la séance en minutes, de 1 à 600 (OUT_OF_RANGE sinon). Absente : la durée par défaut du praticien, sinon 60 minutes.'
          example: 50
          format: int32
          maximum: 600
          minimum: 1
          type: integer
        summary:
          description: 'Compte rendu de la séance, texte libre. Vide ou absent : aucun compte rendu.'
          type: string
      type: object
    Consents:
      description: 'Consentements obligatoires à l''inscription : les deux doivent valoir true (422 INVALID_FIELD sinon). Ils sont consignés dans le journal de sécurité.'
      properties:
        privacy:
          description: Acceptation de la politique de confidentialité ; true exigé.
          type: boolean
        terms:
          description: Acceptation des conditions générales d'utilisation ; true exigé.
          type: boolean
      required:
      - privacy
      - terms
      type: object
    ContactDto:
      description: Coordonnées professionnelles du praticien, vues par l'administration.
      properties:
        address:
          $ref: '#/components/schemas/AdminAddressDto'
          description: Adresse du cabinet ; ses champs sont null si non renseignés.
        phone:
          description: Téléphone professionnel ; null si non renseigné.
          example: +33 4 72 00 00 00
          type: string
        professionalNumber:
          description: Numéro professionnel (RPPS, ADELI ou équivalent) ; null si non renseigné.
          type: string
        remoteOnly:
          description: Vrai si le praticien exerce uniquement à distance.
          type: boolean
      type: object
    CreateEmotionRequest:
      description: Création d'une émotion personnalisée.
      properties:
        family:
          description: Famille de la roue de Plutchik où ranger l'émotion ; obligatoire.
          enum:
          - joy
          - trust
          - fear
          - surprise
          - sadness
          - disgust
          - anger
          - anticipation
          example: sadness
          type: string
        labelFr:
          description: Libellé français ; obligatoire, non vide. Doit être distinct, sans casse ni accents, de tout libellé d'émotion globale et de ses autres émotions personnalisées (409 EMOTION_LABEL_EXISTS sinon).
          example: Lassitude
          type: string
      required:
      - family
      - labelFr
      type: object
    CreateEntryRequest:
      description: 'Création d''une entrée. Champs minimaux par type : note = body ; event = title ; situation = title et occurred.from ; feeling = feeling.emotionCode et feeling.intensity ; medication = medication.molecule ; session = session.modality. Un bloc de détail d''un autre type est refusé (DETAIL_NOT_ALLOWED). authorType et submissionId sont refusés (UNKNOWN_FIELD). Un corps de type session démarre une séance (une seule ouverte à la fois).'
      properties:
        body:
          description: 'Texte (obligatoire pour note). Refusé pour une séance (NOT_ALLOWED_ON_CREATE) : le compte rendu se donne à la clôture.'
          type: string
        feeling:
          $ref: '#/components/schemas/EntryFeelingRequest'
          description: Détail du ressenti, pour le type feeling uniquement.
        links:
          description: 'Liens à poser avec l''entrée, 20 au plus (OUT_OF_RANGE au-delà), tout ou rien : un lien refusé annule la création. Refusé pour une séance (NOT_ALLOWED_ON_CREATE).'
          items:
            $ref: '#/components/schemas/EntryLinkRequest'
          type: array
        medication:
          $ref: '#/components/schemas/EntryMedicationRequest'
          description: Détail du médicament, pour le type medication uniquement.
        occurred:
          $ref: '#/components/schemas/EntryOccurredRequest'
          description: 'Moment auquel l''entrée a eu lieu. Absent : l''instant de saisie (obligatoire pour une situation).'
        session:
          $ref: '#/components/schemas/EntrySessionRequest'
          description: Détail de la séance, pour le type session uniquement.
        sessionId:
          description: 'Séance de rattachement, qui doit être une séance de ce patient (SESSION_INVALID sinon). Absent : la séance courante du patient (SESSION_REQUIRED s''il n''en a aucune). Interdit pour une séance (SESSION_NOT_ALLOWED).'
          format: uuid
          type: string
        status:
          default: final
          description: 'Statut : draft ou final (défaut final). Autre valeur : INVALID_VALUE. Ignoré pour une séance, toujours finale.'
          enum:
          - draft
          - final
          example: final
          type: string
        tags:
          description: Libellés de tags existants du praticien (UNKNOWN_TAG sur tags[i] sinon). Refusé pour une séance (NOT_ALLOWED_ON_CREATE).
          items:
            type: string
          type: array
        title:
          description: Titre (obligatoire pour event et situation). Refusé pour une séance (NOT_ALLOWED_ON_CREATE).
          example: Dispute avec le collègue
          type: string
        type:
          description: Type de l'entrée. Obligatoire (REQUIRED).
          enum:
          - note
          - event
          - situation
          - feeling
          - session
          - medication
          example: note
          type: string
        visibility:
          default: clinical
          description: 'Visibilité : private ou clinical (défaut clinical). Autre valeur : INVALID_VALUE.'
          enum:
          - private
          - clinical
          example: clinical
          type: string
      required:
      - type
      type: object
    CreateLinkRequest:
      description: Lien à poser entre l'entrée de l'URL et une autre entrée du même patient. La provenance (manual) et le statut (accepted) ne s'envoient pas.
      properties:
        direction:
          default: outgoing
          description: 'Place de l''entrée de l''URL dans le lien : outgoing = elle est la source et targetId la cible ; incoming = targetId est la source et elle est la cible. Défaut : outgoing.'
          enum:
          - outgoing
          - incoming
          pattern: incoming|outgoing
          type: string
        linkType:
          description: Code du type de lien, parmi ceux de GET /api/vocabulary/link-types (par exemple triggers, caused_by, worsens, relieves, co_occurs, follows, part_of, treats). Le type doit être autorisé pour le couple (type de l'entrée source, type de l'entrée cible).
          example: triggers
          minLength: 1
          type: string
        rationale:
          description: Justification libre du lien, 500 caractères au plus ; espaces de début et de fin retirés, vide traité comme absent. Optionnelle.
          example: Depuis le décès, les réveils sont angoissés.
          maxLength: 500
          minLength: 0
          type: string
        targetId:
          description: Identifiant de l'autre entrée à lier ; elle doit être du même patient, non archivée et différente de l'entrée de l'URL.
          example: c1a7e9d4-2b3f-4a6c-8d5e-0f1a2b3c4d5e
          format: uuid
          type: string
      required:
      - linkType
      - targetId
      type: object
    CreatePatientRequest:
      description: Création d'un patient dans le cabinet du praticien connecté.
      properties:
        birthDate:
          description: Date de naissance AAAA-MM-JJ ; doit être passée et de moins de 120 ans (422 VALIDATION_FAILED sinon).
          example: 1990-04-02T00:00:00Z
          format: date
          type: string
        context:
          additionalProperties: {}
          description: 'Contexte de vie : objet JSON libre ; null = objet vide.'
          type: object
        displayName:
          description: Nom affiché ; obligatoire, non vide après suppression des espaces.
          example: Marie D.
          type: string
        email:
          description: Adresse e-mail, texte libre ; vide ou null = non renseignée.
          example: marie.d@example.org
          type: string
        firstName:
          description: Prénom ; vide ou null = non renseigné.
          example: Marie
          type: string
        flags:
          description: Drapeaux à poser dès la création ; un seul par nature (409 FLAG_ALREADY_ACTIVE sinon) ; null = aucun.
          items:
            $ref: '#/components/schemas/FlagRequest'
          type: array
        followUp:
          additionalProperties: {}
          description: 'Cadre du suivi : objet JSON libre ; null = objet vide.'
          type: object
        lastName:
          description: Nom de famille ; vide ou null = non renseigné.
          example: Dupont
          type: string
        phone:
          description: Téléphone, texte libre ; vide ou null = non renseigné.
          example: '0102030405'
          type: string
        pronoun:
          description: Pronom d'adresse libre ; vide ou null = non renseigné.
          example: elle
          type: string
        tags:
          description: Libellés de tags existants à associer (mêmes règles que PUT /api/patients/{id}/tags) ; null = aucun.
          items:
            type: string
          type: array
      required:
      - displayName
      type: object
    CreateRequest:
      description: Nouvelle entrée du vocabulaire de l'annuaire (spécialité ou public).
      properties:
        code:
          description: 'Code stable de l''entrée, unique pour le type : commence par une lettre minuscule, puis minuscules, chiffres et underscores, 2 à 40 caractères. Ne change plus ensuite.'
          example: sleep_therapy
          pattern: ^[a-z][a-z0-9_]{1,39}$
          type: string
        kind:
          description: 'Type de l''entrée : specialty (spécialité) ou audience (public).'
          enum:
          - specialty
          - audience
          example: specialty
          type: string
        labelEn:
          description: 'Libellé anglais, 120 caractères au plus ; vide ou absent : pas de libellé anglais.'
          example: Sleep therapy
          maxLength: 120
          type: string
        labelFr:
          description: Libellé français, 120 caractères au plus.
          example: Thérapie du sommeil
          maxLength: 120
          type: string
        sortOrder:
          description: 'Rang d''affichage dans le type, de 0 à 32767 ; absent : après le dernier du type.'
          example: 23
          format: int32
          maximum: 32767
          minimum: 0
          type: integer
      required:
      - code
      - kind
      - labelFr
      type: object
    DecisionDto:
      description: Décision de l'administration accompagnée d'un message au praticien. La note interne de l'administrateur n'est jamais exposée.
      properties:
        decidedAt:
          description: Date-heure de la décision, en UTC.
          example: 2026-03-15T14:05:00Z
          format: date-time
          type: string
        kind:
          description: 'Nature de la décision : approved = dossier approuvé, needs_more = pièces complémentaires demandées, rejected = dossier refusé, suspended = compte suspendu, reactivated = compte réactivé, appeal_accepted = recours accepté, appeal_rejected = recours refusé, report_resolved = signalement traité.'
          enum:
          - approved
          - needs_more
          - rejected
          - suspended
          - reactivated
          - appeal_accepted
          - appeal_rejected
          - report_resolved
          example: needs_more
          type: string
        message:
          description: Message de l'administrateur au praticien.
          example: Merci de joindre un diplôme lisible.
          type: string
      type: object
    DecisionItemDto:
      description: Décision ou acte d'administration enregistré sur un compte (historique append-only, renvoyé du plus récent au plus ancien).
      properties:
        adminId:
          description: Identifiant de l'administrateur auteur de la décision.
          example: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
          format: uuid
          type: string
        checklist:
          additionalProperties: {}
          description: Liste de contrôle libre saisie avec la décision (clés et valeurs JSON). Pour les actes de gestion de compte, contient les statuts avant et après (previousStatus, newStatus) ou la décision contestée (decisionId) ; objet vide s'il n'y en a pas.
          type: object
        decidedAt:
          description: Date-heure UTC (ISO 8601) de la décision.
          example: 2026-03-15T08:00:00Z
          format: date-time
          type: string
        id:
          description: Identifiant de la décision.
          example: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
          format: uuid
          type: string
        internalNote:
          description: Note interne de l'administration, jamais transmise au praticien ; null si absente.
          type: string
        kind:
          description: 'Nature de l''acte : approved, needs_more, rejected (vérification du dossier), suspended, reactivated (gestion du compte), appeal_accepted, appeal_rejected (recours), report_resolved (réservé, jamais produit en V1).'
          enum:
          - approved
          - needs_more
          - rejected
          - suspended
          - reactivated
          - appeal_accepted
          - appeal_rejected
          - report_resolved
          type: string
        messageToPractitioner:
          description: Message transmis au praticien (complément demandé, motif du refus ou de la suspension, réponse au recours) ; null s'il n'y en a pas (par exemple une approbation sans message).
          type: string
      type: object
    DecisionRequest:
      description: Décision de l'administrateur sur un dossier en cours d'examen.
      properties:
        checklist:
          additionalProperties: {}
          description: Liste de contrôle libre (clés et valeurs JSON), 20 000 caractères au plus une fois sérialisée (422 TOO_LARGE) ; absent = objet vide.
          type: object
        force:
          description: 'Pour approved uniquement : vrai pour approuver même si tous les justificatifs ne sont pas conformes ; une note interne est alors obligatoire. Absent = faux.'
          type: boolean
        internalNote:
          description: Note interne, jamais transmise au praticien, 4000 caractères au plus ; obligatoire pour approved avec force=true (422 NOTE_REQUIRED).
          type: string
        kind:
          description: 'Issue : approved (dossier validé), needs_more (complément demandé) ou rejected (dossier refusé).'
          enum:
          - approved
          - needs_more
          - rejected
          type: string
        messageToPractitioner:
          description: Message envoyé au praticien par e-mail ; obligatoire pour needs_more et rejected (422 MESSAGE_REQUIRED), 4000 caractères au plus ; facultatif pour approved.
          type: string
      required:
      - kind
      type: object
    DirectoryVocabularyDto:
      description: Listes fermées de l'annuaire. Seules les entrées actives sont rendues, dans l'ordre d'affichage.
      properties:
        audiences:
          description: 'Publics accueillis actifs, par rang puis libellé français (liste administrable) : par exemple adults, young_adults, adolescents, children, couples_families.'
          items:
            $ref: '#/components/schemas/Item'
          type: array
        languages:
          description: Langues proposées par défaut (15 codes ISO 639-1, triées par libellé français) ; tout autre code ISO 639-1 reste accepté dans le profil.
          items:
            $ref: '#/components/schemas/Item'
          type: array
        modalities:
          description: 'Modalités de consultation, liste fixe : in_person (au cabinet), video (en visio), home (à domicile).'
          items:
            $ref: '#/components/schemas/Item'
          type: array
        specialties:
          description: Spécialités actives, par rang puis libellé français (liste administrable).
          items:
            $ref: '#/components/schemas/Item'
          type: array
      type: object
    DocumentDto:
      description: Justificatif déposé dans le dossier professionnel. Aucune clé de stockage ni empreinte n'est exposée ; le fichier se lit via GET /api/me/verification/documents/{id}/url.
      properties:
        id:
          description: Identifiant du justificatif.
          format: uuid
          type: string
        issuer:
          description: Établissement ou organisme émetteur ; null si non renseigné.
          example: Université de Lyon
          type: string
        mime:
          description: Type MIME détecté par signature du fichier (jamais d'après l'extension). L'image est ré-encodée sans métadonnées, le PDF est conservé tel quel.
          enum:
          - application/pdf
          - image/jpeg
          - image/png
          example: application/pdf
          type: string
        purged:
          description: 'true si le fichier a été purgé du stockage (90 jours après la décision) : les métadonnées restent, mais l''URL et le fichier répondent 410 DOCUMENT_PURGED.'
          type: boolean
        reviewedStatus:
          description: 'Résultat de l''examen du justificatif par l''administration : pending = pas encore examiné, conform = conforme, non_conform = non conforme.'
          enum:
          - pending
          - conform
          - non_conform
          example: pending
          type: string
        sizeBytes:
          description: Taille du fichier stocké, en octets (10 Mo au maximum).
          example: 482133
          format: int32
          type: integer
        title:
          description: Intitulé saisi par le praticien (200 caractères au maximum).
          example: Master de psychologie clinique
          type: string
        type:
          description: 'Nature du justificatif : diploma = diplôme, registration = attestation d''inscription (ADELI ou RPPS), certification = certification (coach), professional_card = carte professionnelle, identity = pièce d''identité, other = autre pièce. Un diplôme et une pièce d''identité sont obligatoires pour soumettre le dossier.'
          enum:
          - diploma
          - registration
          - certification
          - professional_card
          - identity
          - other
          example: diploma
          type: string
        uploadedAt:
          description: Date-heure du dépôt, en UTC.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
        year:
          description: Année d'obtention, de 1950 à 2100 ; null si non renseignée.
          example: 2012
          format: int32
          type: integer
      type: object
    DossierDto:
      description: 'Dossier complet d''un praticien pour la vérification : identité, coordonnées, justificatifs et historique des décisions. Aucune donnée patient.'
      properties:
        contact:
          $ref: '#/components/schemas/ContactDto'
          description: Coordonnées professionnelles.
        createdAt:
          description: Date-heure UTC (ISO 8601) de création du compte.
          example: 2026-03-10T14:00:00Z
          format: date-time
          type: string
        decisions:
          description: Historique des décisions sur ce compte, du plus récent au plus ancien.
          items:
            $ref: '#/components/schemas/DecisionItemDto'
          type: array
        displayName:
          description: Nom d'affichage.
          example: Claire Martin
          type: string
        documents:
          description: Justificatifs de vérification non retirés par le praticien, du plus ancien au plus récent.
          items:
            $ref: '#/components/schemas/AdminDocumentDto'
          type: array
        email:
          description: Adresse e-mail de connexion.
          example: claire.martin@example.org
          type: string
        emailConfirmedAt:
          description: Date-heure UTC (ISO 8601) de confirmation de l'e-mail ; null si non confirmé.
          example: 2026-03-10T14:05:00Z
          format: date-time
          type: string
        firstName:
          description: Prénom.
          example: Claire
          type: string
        lastName:
          description: Nom de famille.
          example: Martin
          type: string
        locale:
          description: Langue de l'interface du praticien (code ISO 639-1).
          example: fr
          type: string
        overdue:
          description: Vrai si le dossier est under_review depuis plus de 2 jours ouvrés après submittedAt.
          type: boolean
        practitionerId:
          description: Identifiant du praticien.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        profession:
          description: Profession déclarée.
          enum:
          - psychologist
          - psychiatrist
          - coach
          type: string
        submittedAt:
          description: Date-heure UTC (ISO 8601) de la dernière soumission du dossier ; null si aucune soumission n'est journalisée.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
        verificationStatus:
          description: 'État de vérification du compte : email_pending, docs_pending, under_review, approved, needs_more, rejected, suspended ou closed.'
          enum:
          - email_pending
          - docs_pending
          - under_review
          - approved
          - needs_more
          - rejected
          - suspended
          - closed
          type: string
        verifiedAt:
          description: Date-heure UTC (ISO 8601) de la dernière approbation ; null si le dossier n'a jamais été approuvé.
          example: 2026-03-15T08:00:00Z
          format: date-time
          type: string
      type: object
    DraftsDto:
      description: Brouillons et séance ouverte.
      properties:
        count:
          description: Nombre d'entrées en brouillon non archivées.
          example: 2
          format: int32
          type: integer
        openSession:
          $ref: '#/components/schemas/OpenSessionDto'
          description: Séance non clôturée la plus récente ; null s'il n'y en a pas.
      type: object
    EmailChangeRequest:
      description: Correction de l'adresse e-mail d'un compte non confirmé ; le mot de passe prouve l'identité de l'appelant (aucune session).
      properties:
        email:
          description: Adresse e-mail actuelle du compte (254 caractères au maximum).
          example: camille.martin@example.org
          maxLength: 254
          minLength: 0
          type: string
        newEmail:
          description: Nouvelle adresse e-mail qui recevra le lien de confirmation (254 caractères au maximum).
          example: camille.martin@example.org
          format: email
          maxLength: 254
          minLength: 0
          type: string
        password:
          description: Mot de passe actuel du compte (200 caractères au maximum).
          maxLength: 200
          minLength: 0
          type: string
      required:
      - email
      - newEmail
      - password
      type: object
    EmailConfirmRequest:
      description: Jeton de confirmation d'adresse e-mail reçu par e-mail.
      properties:
        token:
          description: Jeton à usage unique reçu dans l'e-mail de confirmation, valable 24 h (200 caractères au maximum).
          example: q3F9x0Zb7mYw2eKq5uVtJ1cH8aLrN4dS6pGoXi0TyUE
          maxLength: 200
          minLength: 0
          type: string
      required:
      - token
      type: object
    EmailResendRequest:
      description: Demande de renvoi de l'e-mail de confirmation.
      properties:
        email:
          description: Adresse e-mail du compte non confirmé (254 caractères au maximum).
          example: camille.martin@example.org
          format: email
          maxLength: 254
          minLength: 0
          type: string
      required:
      - email
      type: object
    EmotionView:
      description: 'Émotion utilisable dans un ressenti : globale (catalogue du produit, 29 émotions) ou personnalisée par le praticien connecté.'
      properties:
        active:
          description: true si l'émotion peut être choisie. Les listes ne renvoient que des émotions actives ; une personnalisée fusionnée devient inactive jusqu'à l'annulation de la fusion.
          example: true
          type: boolean
        code:
          description: 'Code stable de l''émotion : mot anglais en minuscules pour une globale (anxiety, joy…), « c_ » suivi de 8 caractères hexadécimaux pour une personnalisée.'
          example: anxiety
          type: string
        family:
          description: Famille de la roue de Plutchik à laquelle l'émotion est rattachée.
          enum:
          - joy
          - trust
          - fear
          - surprise
          - sadness
          - disgust
          - anger
          - anticipation
          example: fear
          type: string
        intensityLevel:
          description: 'Niveau d''intensité lexicale Plutchik : 1 faible, 2 moyen, 3 fort. Null pour les ajouts cliniques (anxiety, guilt, shame, emptiness, calm) et pour les émotions personnalisées.'
          example: 2
          format: int32
          maximum: 3
          minimum: 1
          type: integer
        labelEn:
          description: Libellé anglais ; null pour une émotion personnalisée (saisie en français seulement).
          example: Anxiety
          type: string
        labelFr:
          description: Libellé français affiché.
          example: Anxiété
          type: string
        scope:
          description: 'Portée : global = catalogue du produit, custom = créée par le praticien.'
          enum:
          - global
          - custom
          example: global
          type: string
      type: object
    EmotionsDto:
      description: Émotions dominantes de la fenêtre.
      properties:
        top:
          description: 5 émotions au plus, par nombre de ressentis décroissant puis par code ; liste vide sans ressenti dans la fenêtre.
          items:
            $ref: '#/components/schemas/TopEmotionDto'
          type: array
      type: object
    EntryDto:
      description: 'Entrée clinique complète (version courante, détail selon le type, tags). Une entrée archivée reste lisible : archivedAt est alors renseigné. Les liens se lisent par GET /api/entries/{id}/links ; seule la réponse de création les porte dans links.'
      properties:
        archivedAt:
          description: Instant d'archivage UTC. Null si l'entrée n'est pas archivée.
          example: 2026-10-21T08:00:00Z
          format: date-time
          type: string
        authorType:
          description: 'Provenance de l''entrée. Lecture seule : vaut toujours practitioner en V1, jamais acceptée en écriture (422 UNKNOWN_FIELD).'
          enum:
          - practitioner
          example: practitioner
          readOnly: true
          type: string
        body:
          description: Texte de la version courante. Null si la version n'en a pas.
          type: string
        feeling:
          $ref: '#/components/schemas/EntryFeelingDto'
          description: Détail du ressenti. Renseigné pour le type feeling, null sinon.
        id:
          description: Identifiant de l'entrée.
          format: uuid
          type: string
        linkCount:
          description: Nombre de liens acceptés portant sur l'entrée.
          format: int32
          minimum: 0
          type: integer
        links:
          description: Liens posés à la création, dans leur sens réel. Renseigné uniquement dans la réponse 201 de POST /api/patients/{id}/entries (liste vide si aucun lien demandé) ; null partout ailleurs (utiliser GET /api/entries/{id}/links).
          items:
            $ref: '#/components/schemas/EntryLinkDto'
          type: array
        medication:
          $ref: '#/components/schemas/EntryMedicationDto'
          description: Détail du médicament. Renseigné pour le type medication, null sinon.
        occurred:
          $ref: '#/components/schemas/EntryOccurredDto'
          description: Moment auquel l'entrée a eu lieu, avec sa précision.
        patientId:
          description: Identifiant du patient du dossier.
          format: uuid
          type: string
        recordedAt:
          description: Instant d'enregistrement de l'entrée, UTC ISO 8601.
          example: 2026-10-20T19:05:00Z
          format: date-time
          type: string
        session:
          $ref: '#/components/schemas/EntrySessionDto'
          description: Détail de la séance. Renseigné pour le type session, null sinon.
        sessionId:
          description: Identifiant de la séance à laquelle l'entrée appartient. Null pour une séance (une séance n'est rattachée à aucune séance).
          format: uuid
          type: string
        status:
          description: 'Statut : draft = brouillon ; final = définitive. L''archivage n''est pas un statut, il est porté par archivedAt.'
          enum:
          - draft
          - final
          example: final
          type: string
        tags:
          description: Libellés des tags actifs de l'entrée, triés sans tenir compte de la casse. Liste vide s'il n'y en a pas.
          items:
            type: string
          type: array
        title:
          description: Titre de la version courante. Null si la version n'en a pas.
          type: string
        type:
          description: Type de l'entrée.
          enum:
          - note
          - event
          - situation
          - feeling
          - session
          - medication
          example: note
          type: string
        version:
          description: Numéro de la version courante, à partir de 1. Incrémenté à chaque correction hors fenêtre de grâce de 1 h 15.
          format: int32
          minimum: 1
          type: integer
        visibility:
          description: 'Visibilité : private = visible du seul praticien auteur, exclue de l''export ; clinical = partagée avec l''équipe clinique.'
          enum:
          - private
          - clinical
          example: clinical
          type: string
      type: object
    EntryFeelingDto:
      description: Détail d'un ressenti (type feeling).
      properties:
        arousal:
          description: Activation (arousal) copiée de l'émotion au moment de la saisie. Null si l'émotion n'en a pas. Jamais fournie par l'appelant.
          format: int32
          type: integer
        emotionCode:
          description: Code de l'émotion, issu du catalogue de vocabulaire du praticien.
          example: anxiety
          type: string
        family:
          description: 'Famille de l''émotion d''après le catalogue : joy, trust, fear, surprise, sadness, disgust, anger ou anticipation. Null si elle est inconnue.'
          example: fear
          type: string
        intensity:
          description: Intensité du ressenti, de 0 à 10.
          format: int32
          maximum: 10
          minimum: 0
          type: integer
        valence:
          description: Valence copiée de l'émotion au moment de la saisie. Null si l'émotion n'en a pas. Jamais fournie par l'appelant.
          format: int32
          type: integer
      type: object
    EntryFeelingRequest:
      description: Détail d'un ressenti. À la création, les deux champs sont obligatoires pour le type feeling. En PATCH, un champ absent est conservé.
      properties:
        emotionCode:
          description: 'Code d''une émotion active du catalogue du praticien. Inconnu : UNKNOWN_EMOTION sur feeling.emotionCode.'
          example: anxiety
          type: string
        intensity:
          description: Intensité du ressenti, de 0 à 10 (OUT_OF_RANGE sinon).
          example: 7
          format: int32
          maximum: 10
          minimum: 0
          type: integer
      type: object
    EntryLinkDto:
      description: Lien accepté posé avec une nouvelle entrée, dans son sens réel (source vers cible).
      properties:
        id:
          description: Identifiant du lien.
          format: uuid
          type: string
        label:
          description: 'Verbe du lien vu depuis la nouvelle entrée : libellé inverse si elle est la cible d''un type dirigé. En anglais si Accept-Language vaut en, en français sinon.'
          example: déclenche
          type: string
        linkType:
          description: Code du type de lien.
          example: triggers
          type: string
        sourceId:
          description: Entrée source du lien.
          format: uuid
          type: string
        targetId:
          description: Entrée cible du lien.
          format: uuid
          type: string
      type: object
    EntryLinkRequest:
      description: Lien à poser avec une nouvelle entrée, accepté en même temps qu'elle (tout ou rien).
      properties:
        direction:
          default: outgoing
          description: 'Sens vu depuis la nouvelle entrée : outgoing (défaut) = elle est la source ; incoming = elle est la cible. Autre valeur : INVALID_VALUE.'
          enum:
          - outgoing
          - incoming
          example: outgoing
          type: string
        linkType:
          description: 'Code du type de lien. Obligatoire (REQUIRED). Inconnu : UNKNOWN_LINK_TYPE ; non permis pour ce couple d''entrées : LINK_TYPE_NOT_ALLOWED (la réponse porte alors allowedLinkTypes).'
          example: triggers
          type: string
        targetId:
          description: Entrée à lier. Obligatoire (REQUIRED).
          format: uuid
          type: string
      type: object
    EntryMedicationDto:
      description: Détail d'un médicament (type medication).
      properties:
        dosage:
          description: Posologie, texte libre.
          example: 50 mg
          type: string
        frequency:
          description: Fréquence de prise, texte libre.
          example: 1 fois par jour
          type: string
        molecule:
          description: Molécule ou nom du médicament.
          example: sertraline
          type: string
        periodFrom:
          description: Début de la période de prise, date ISO 8601 (AAAA-MM-JJ).
          example: 2026-09-01T00:00:00Z
          format: date
          type: string
        periodTo:
          description: Fin de la période de prise, date ISO 8601 (AAAA-MM-JJ). Null si en cours.
          example: 2026-12-01T00:00:00Z
          format: date
          type: string
        prescriber:
          description: Prescripteur, texte libre.
          example: Dr Martin
          type: string
      type: object
    EntryMedicationRequest:
      description: Détail d'un médicament. À la création, molecule est obligatoire pour le type medication. En PATCH, un champ absent est conservé.
      properties:
        dosage:
          description: Posologie, texte libre.
          example: 50 mg
          type: string
        frequency:
          description: Fréquence de prise, texte libre.
          example: 1 fois par jour
          type: string
        molecule:
          description: Molécule ou nom du médicament.
          example: sertraline
          type: string
        periodFrom:
          description: Début de la période de prise, date ISO 8601 (AAAA-MM-JJ).
          example: 2026-09-01T00:00:00Z
          format: date
          type: string
        periodTo:
          description: Fin de la période de prise, date ISO 8601 (AAAA-MM-JJ).
          example: 2026-12-01T00:00:00Z
          format: date
          type: string
        prescriber:
          description: Prescripteur, texte libre.
          example: Dr Martin
          type: string
      type: object
    EntryOccurredDto:
      description: Moment auquel l'entrée a eu lieu, avec sa précision. Les bornes sont en UTC. Pour une précision autre qu'exact, les bornes sont celles de la période désignée (jour, mois, année entiers).
      properties:
        from:
          description: Début de l'occurrence, date-heure UTC ISO 8601.
          example: 2026-10-20T19:00:00Z
          format: date-time
          type: string
        label:
          description: Libellé de la période ou de la phase de vie (precision period ou life_phase). Null sinon.
          example: enfance
          type: string
        precision:
          description: 'Précision de la date : exact = date-heure connue ; day = jour connu ; month = mois connu ; year = année connue ; period = période libre avec libellé ; life_phase = phase de vie (bornes déduites de la date de naissance du patient).'
          enum:
          - exact
          - day
          - month
          - year
          - period
          - life_phase
          example: exact
          type: string
        to:
          description: Fin de l'occurrence, date-heure UTC ISO 8601. Null pour une situation en cours (sans fin).
          example: 2026-10-20T19:00:00Z
          format: date-time
          type: string
      type: object
    EntryOccurredRequest:
      description: 'Moment auquel l''entrée a eu lieu. Remplacé en entier lors d''un PATCH. Absent à la création : l''instant de saisie est utilisé (sauf pour une situation, où il est obligatoire).'
      properties:
        from:
          description: Début de l'occurrence, date-heure UTC ISO 8601. Obligatoire (REQUIRED) sauf pour la précision life_phase.
          example: 2026-10-20T19:00:00Z
          format: date-time
          type: string
        label:
          description: Libellé de la période (precision period) ou de la phase de vie (precision life_phase).
          example: enfance
          type: string
        precision:
          default: exact
          description: 'Précision de la date : exact (défaut) = date-heure connue ; day = jour connu ; month = mois connu ; year = année connue ; period = période libre (libellé obligatoire) ; life_phase = phase de vie reconnue par son libellé (enfance), bornes déduites de la date de naissance du patient. Toute autre valeur : INVALID_VALUE sur occurred.precision.'
          enum:
          - exact
          - day
          - month
          - year
          - period
          - life_phase
          example: exact
          type: string
        to:
          description: 'Fin de l''occurrence, date-heure UTC ISO 8601, jamais avant from (INVALID_TIME sur occurred.to). Absente : pour une situation, elle est en cours ; pour les autres types, égale à from (la précision period exige une fin).'
          example: 2026-10-20T20:00:00Z
          format: date-time
          type: string
      type: object
    EntrySearchEmotionFacetDto:
      description: Facette par émotion (ressentis).
      properties:
        code:
          description: Code de l'émotion.
          example: anxiety
          type: string
        count:
          description: Nombre de résultats exacts portant cette émotion.
          example: 3
          format: int32
          type: integer
        label:
          description: Libellé français de l'émotion.
          example: Anxiété
          type: string
      type: object
    EntrySearchFacetsDto:
      description: Compteurs sur les résultats exacts, triés par effectif décroissant ; chaque facette ignore son propre filtre pour que les puces gardent leur compteur.
      properties:
        emotions:
          description: Répartition par émotion.
          items:
            $ref: '#/components/schemas/EntrySearchEmotionFacetDto'
          type: array
        tags:
          description: Répartition par tag.
          items:
            $ref: '#/components/schemas/EntrySearchTagFacetDto'
          type: array
        types:
          description: Répartition par type d'entrée.
          items:
            $ref: '#/components/schemas/EntrySearchTypeFacetDto'
          type: array
      type: object
    EntrySearchItemDto:
      description: Une entrée trouvée. title et snippet sont des fragments HTML échappés ; seule la balise mark y est ajoutée, autour des mots trouvés.
      properties:
        approximate:
          description: true pour un résultat approché (tolérance aux fautes de frappe), false pour un résultat exact.
          example: false
          type: boolean
        archivedAt:
          description: Date-heure d'archivage, UTC ISO 8601 ; null si l'entrée n'est pas archivée (toujours null sans includeArchived).
          example: 2026-04-02T08:00:00Z
          format: date-time
          type: string
        emotionCode:
          description: Code de l'émotion pour un ressenti, null pour les autres types.
          example: anxiety
          type: string
        entryId:
          description: Identifiant de l'entrée.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        occurredFrom:
          description: Début de l'événement concerné (occurred_from), UTC ISO 8601.
          example: 2026-03-10T10:00:00Z
          format: date-time
          type: string
        occurredPrecision:
          description: 'Précision de la date : exact = date-heure connue, day = jour connu, month = mois connu, year = année connue, period = période, life_phase = phase de vie.'
          enum:
          - exact
          - day
          - month
          - year
          - period
          - life_phase
          example: exact
          type: string
        occurredTo:
          description: Fin de l'événement concerné (occurred_to), UTC ISO 8601 ; null si ponctuel ou en cours.
          example: 2026-03-10T11:00:00Z
          format: date-time
          type: string
        rank:
          description: Pertinence (ts_rank_cd, multipliée par 1,5 pour les entrées de moins de 90 jours) ; null pour un résultat approché ou une recherche sans texte.
          example: 0.31
          format: double
          type: number
        sessionId:
          description: Identifiant de la séance de rattachement ; null pour une entrée de type session (une séance n'est rattachée à aucune séance).
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        similarity:
          description: Similarité trigramme de 0 à 1 (seuil 0,3) ; null pour un résultat exact.
          example: 0.45
          format: double
          maximum: 1
          minimum: 0
          type: number
        snippet:
          description: 'Extrait du corps en HTML échappé, mots trouvés entourés de mark (sans texte de recherche : début du corps, 200 caractères au plus, « … » si tronqué) ; null si l''entrée n''a pas de corps.'
          example: …n'a pas supporté le <mark>licenciement</mark> de son frère…
          type: string
        tags:
          description: Libellés des tags de l'entrée, triés ; liste vide si aucun.
          items:
            type: string
          type: array
        title:
          description: Titre de la version courante en HTML échappé, mots trouvés entourés de mark si la recherche a un texte ; null si l'entrée n'a pas de titre.
          example: Le <mark>licenciement</mark> de son frère
          type: string
        type:
          description: Code du type d'entrée.
          enum:
          - note
          - event
          - situation
          - feeling
          - session
          - medication
          example: note
          type: string
        version:
          description: Numéro de la version courante de l'entrée.
          example: 1
          format: int32
          type: integer
        visibility:
          description: 'Visibilité : private = réservée à son auteur, clinical = dossier clinique.'
          enum:
          - private
          - clinical
          example: clinical
          type: string
      type: object
    EntrySearchQueryDto:
      description: Requête telle que le serveur l'a interprétée à partir du paramètre q.
      properties:
        after:
          description: 'Borne inclusive déduite de après: / after: (premier instant suivant la période, UTC ISO 8601) ; null sans jeton.'
          example: 2026-07-01T00:00:00Z
          format: date-time
          type: string
        before:
          description: 'Borne exclusive déduite de avant: / before: (début de la période, UTC ISO 8601) ; null sans jeton.'
          example: 2026-12-01T00:00:00Z
          format: date-time
          type: string
        emotions:
          description: 'Valeurs des jetons émotion: / emotion: de q (hors paramètre emotions).'
          items:
            type: string
          type: array
        tags:
          description: 'Valeurs des jetons tag: de q (hors paramètre tags).'
          items:
            type: string
          type: array
        text:
          description: Texte libre restant après retrait des jetons (tag:, émotion:, avant:, après:) ; chaîne vide s'il n'en reste pas (recherche sans texte).
          example: licenciement
          type: string
      type: object
    EntrySearchResultDto:
      description: 'Page de résultats d''une recherche : entrées, facettes et requête interprétée. Pagination par numéro de page (20 par page), non par curseur.'
      properties:
        approximateCount:
          description: Nombre de résultats approchés dans items (page 1 seulement, et seulement s'il y a moins de 3 résultats exacts, avec un texte sans exclusion -mot ; 0 sinon).
          example: 0
          format: int32
          type: integer
        exactCount:
          description: Nombre de résultats exacts dans items.
          example: 20
          format: int32
          type: integer
        facets:
          $ref: '#/components/schemas/EntrySearchFacetsDto'
          description: Facettes calculées sur les résultats exacts.
        items:
          description: 'Résultats de la page : exacts d''abord (par pertinence, puis date décroissante), puis approchés (par similarité). Sans texte : par date décroissante.'
          items:
            $ref: '#/components/schemas/EntrySearchItemDto'
          type: array
        page:
          description: Numéro de la page renvoyée, à partir de 1.
          example: 1
          format: int32
          type: integer
        pageSize:
          description: 'Taille de page, fixe : 20.'
          example: 20
          format: int32
          type: integer
        query:
          $ref: '#/components/schemas/EntrySearchQueryDto'
          description: Requête telle que le serveur l'a interprétée.
        tookMs:
          description: Durée de traitement côté serveur, en millisecondes.
          example: 12
          format: int64
          type: integer
        total:
          description: Nombre total de résultats exacts sur toutes les pages, hors résultats approchés.
          example: 25
          format: int64
          type: integer
      type: object
    EntrySearchTagFacetDto:
      description: Facette par tag.
      properties:
        count:
          description: Nombre de résultats exacts portant ce tag.
          example: 5
          format: int32
          type: integer
        id:
          description: Identifiant du tag.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        label:
          description: Libellé du tag.
          example: travail
          type: string
      type: object
    EntrySearchTypeFacetDto:
      description: Facette par type d'entrée.
      properties:
        code:
          description: Code du type d'entrée.
          enum:
          - note
          - event
          - situation
          - feeling
          - session
          - medication
          example: note
          type: string
        count:
          description: Nombre de résultats exacts de ce type.
          example: 7
          format: int32
          type: integer
      type: object
    EntrySessionDto:
      description: Détail d'une séance (type session).
      properties:
        closedAt:
          description: Instant de clôture UTC. Null tant que la séance est ouverte.
          example: 2026-10-20T20:00:00Z
          format: date-time
          type: string
        durationMin:
          description: Durée en minutes (1 à 600). Null tant que la séance n'est pas clôturée, ou si le contact n'en a pas.
          format: int32
          maximum: 600
          minimum: 1
          type: integer
        kind:
          description: 'Genre de séance : intake = séance d''accueil créée avec le patient ; session = séance ordinaire ; contact = contact hors rendez-vous (téléphone, e-mail) consigné après coup.'
          enum:
          - intake
          - session
          - contact
          example: session
          type: string
        modality:
          description: Modalité de la séance.
          enum:
          - in_person
          - video
          - phone
          - email
          example: video
          type: string
      type: object
    EntrySessionRequest:
      description: 'Détail d''une séance. À la création d''une entrée de type session, seule la modalité est acceptée (la durée se donne à la clôture : NOT_ALLOWED_ON_CREATE sur session.durationMin). En PATCH, un champ absent est conservé ; le genre et la clôture ne se modifient pas.'
      properties:
        durationMin:
          description: Durée en minutes, de 1 à 600 (OUT_OF_RANGE sinon).
          example: 50
          format: int32
          maximum: 600
          minimum: 1
          type: integer
        modality:
          description: Modalité de la séance (obligatoire pour le type session).
          enum:
          - in_person
          - video
          - phone
          - email
          example: video
          type: string
      type: object
    EntryTypeView:
      description: 'Type d''entrée clinique du catalogue (six types en V1 : note, event, situation, feeling, session, medication).'
      properties:
        code:
          description: Code stable du type d'entrée.
          enum:
          - note
          - event
          - situation
          - feeling
          - session
          - medication
          example: feeling
          type: string
        detailTable:
          description: Nom de la table de détail propre au type (entry_feeling, entry_session, entry_medication) ; null pour les types sans détail (note, event, situation).
          example: entry_feeling
          type: string
        hasDuration:
          description: true si le type porte une durée (situation, session, medication), false sinon.
          example: false
          type: boolean
        labelEn:
          description: Libellé anglais.
          example: Feeling
          type: string
        labelFr:
          description: Libellé français affiché.
          example: Ressenti
          type: string
        sortOrder:
          description: Rang d'affichage, croissant ; la liste est déjà triée dans cet ordre.
          example: 4
          format: int32
          type: integer
      type: object
    EntryVersionDto:
      description: Une version d'une entrée. La liste est ordonnée de la plus récente à la plus ancienne.
      properties:
        authorId:
          description: Identifiant du praticien auteur de cette version.
          format: uuid
          type: string
        authorType:
          description: 'Provenance de l''entrée. Lecture seule : vaut toujours practitioner en V1.'
          enum:
          - practitioner
          example: practitioner
          readOnly: true
          type: string
        body:
          description: Texte de cette version. Null s'il n'y en a pas.
          type: string
        createdAt:
          description: Instant de création de la version, UTC ISO 8601.
          example: 2026-10-20T19:05:00Z
          format: date-time
          type: string
        reason:
          description: Motif de la correction (champ reason du PATCH). Null pour la version 1 ou si aucun motif n'a été donné.
          example: précision apportée en séance
          type: string
        title:
          description: Titre de cette version. Null s'il n'y en a pas.
          type: string
        version:
          description: Numéro de la version, à partir de 1.
          format: int32
          minimum: 1
          type: integer
      type: object
    ExpandGraphRequest:
      description: 'Groupe à développer : exactement un de superNodeId et memberIds (422 INVALID_VALUE sinon).'
      properties:
        memberIds:
          description: 'Identifiants des entrées à rendre : 1 à 500, sans doublon, toutes non archivées et du patient de l''URL. Exclusif avec superNodeId.'
          items:
            format: uuid
            type: string
          type: array
        superNodeId:
          description: Identifiant d'un super-nœud reçu dans superNodes, de la forme sn:{neighborId}:{type d'entrée}. Exclusif avec memberIds.
          example: sn:9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e:feeling
          type: string
      type: object
    ExportRequestedDto:
      description: 'Réponse 202 : export asynchrone mis en file.'
      properties:
        jobId:
          description: Identifiant du job d'export.
          format: uuid
          type: string
        statusUrl:
          description: URL relative de suivi (GET), qui porte un jeton token valable sans session. À interroger jusqu'à ce que status vaille done ou failed.
          example: /api/me/export/3f8e2b1a-6c4d-4e57-9a0b-1d2c3e4f5a6b?token=Zm9v
          type: string
      type: object
    ExportStatusDto:
      description: Statut d'un export de compte.
      properties:
        downloadUrl:
          description: URL relative signée du fichier zip (GET /api/me/export/{jobId}/file avec exp et sig). Renseignée seulement quand le job est terminé et le lien non expiré, null sinon.
          type: string
        error:
          description: Message d'erreur, renseigné seulement quand status vaut failed.
          type: string
        expiresAt:
          description: Échéance du lien de téléchargement, 7 jours après la fin. Null tant que le job n'est pas terminé.
          example: 2026-10-27T19:06:00Z
          format: date-time
          type: string
        finishedAt:
          description: Instant de fin du job, UTC ISO 8601. Null tant qu'il n'est pas fini.
          example: 2026-10-20T19:06:00Z
          format: date-time
          type: string
        jobId:
          description: Identifiant du job d'export.
          format: uuid
          type: string
        requestedAt:
          description: Instant de la demande, UTC ISO 8601.
          example: 2026-10-20T19:05:00Z
          format: date-time
          type: string
        status:
          description: 'État du job : queued = en attente ; running = en cours de génération ; done = terminé, fichier téléchargeable tant que le lien n''a pas expiré ; failed = échec (voir error).'
          enum:
          - queued
          - running
          - done
          - failed
          example: running
          type: string
      type: object
    FacetCount:
      description: Nombre de résultats pour une valeur d'une facette.
      properties:
        code:
          description: 'Valeur de la facette : code de profession, de modalité, de public ou de langue.'
          example: video
          type: string
        count:
          description: Nombre de fiches du lot filtré qui ont cette valeur.
          example: 12
          format: int64
          type: integer
      type: object
    Facets:
      description: Facettes calculées sur le lot filtré (500 fiches au plus), chacune triée par nombre décroissant.
      properties:
        audiences:
          description: Répartition par public accueilli.
          items:
            $ref: '#/components/schemas/FacetCount'
          type: array
        languages:
          description: Répartition par langue (ISO 639-1).
          items:
            $ref: '#/components/schemas/FacetCount'
          type: array
        modalities:
          description: Répartition par modalité (in_person, video, home).
          items:
            $ref: '#/components/schemas/FacetCount'
          type: array
        professions:
          description: Répartition par profession (psychologist, psychiatrist, coach).
          items:
            $ref: '#/components/schemas/FacetCount'
          type: array
      type: object
    FeelingPointDto:
      description: 'Un ressenti : une valeur par point.'
      properties:
        at:
          description: Début du ressenti (occurred_from), UTC ISO 8601.
          example: 2026-03-12T20:15:00Z
          format: date-time
          type: string
        date:
          description: 'Jour UTC de placement du point, AAAA-MM-JJ : le jour du ressenti, ou le milieu de la période pour un ressenti imprécis, plafonné à aujourd''hui.'
          example: 2026-03-12T00:00:00Z
          format: date
          type: string
        emotionCode:
          description: Code de l'émotion ressentie.
          example: anxiety
          type: string
        entryId:
          description: Identifiant de l'entrée ressenti.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        family:
          description: Famille de l'émotion (joy, trust, fear, surprise, sadness, disgust, anger, anticipation) ; null si l'émotion n'est plus au catalogue.
          example: fear
          type: string
        intensity:
          description: Intensité du ressenti, de 0 à 10.
          example: 7
          format: int32
          maximum: 10
          minimum: 0
          type: integer
        sessionId:
          description: Identifiant de la séance de rattachement.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        valence:
          description: Valence de l'émotion, de -2 (très négative) à 2 (très positive) ; null si inconnue.
          example: -1
          format: int32
          maximum: 2
          minimum: -2
          type: integer
      type: object
    FeelingSeriesDto:
      description: 'Série de la courbe : une émotion de la fenêtre.'
      properties:
        count:
          description: Nombre de ressentis de cette émotion dans la fenêtre.
          example: 8
          format: int32
          type: integer
        emotionCode:
          description: Code de l'émotion.
          example: anxiety
          type: string
        family:
          description: Famille de l'émotion ; null si elle n'est plus au catalogue.
          example: fear
          type: string
        label:
          description: Libellé français.
          example: Anxiété
          type: string
        labelEn:
          description: Libellé anglais ; null s'il n'existe pas.
          example: Anxiety
          type: string
      type: object
    FeelingsDto:
      description: Ressentis réels de la fenêtre, repères de médicament et jours de séance.
      properties:
        markers:
          description: Repères de médicament (début, fin) de la fenêtre.
          items:
            $ref: '#/components/schemas/TrendMarkerDto'
          type: array
        points:
          description: Exactement un point par ressenti non archivé de la fenêtre, hors phases de vie (précision life_phase), du plus ancien au plus récent.
          items:
            $ref: '#/components/schemas/FeelingPointDto'
          type: array
        series:
          description: Une série par émotion présente dans la fenêtre, par nombre de ressentis décroissant puis par code.
          items:
            $ref: '#/components/schemas/FeelingSeriesDto'
          type: array
        ticks:
          description: Jours UTC des séances de la fenêtre, croissants, sans doublon (AAAA-MM-JJ).
          items:
            format: date
            type: string
          type: array
      type: object
    FieldProblem:
      description: Une erreur de champ dans errors[] (422, 400 de paramètre, 409 ENTRY_ARCHIVED des liens).
      properties:
        code:
          description: 'Code stable de l''erreur de champ, à tester par le client : INVALID_FIELD, REQUIRED, OUT_OF_RANGE, TOO_LONG, UNKNOWN_EMOTION… (liste sur chaque opération). Absent dans les modules patients, vocabulary (tags, émotions) et directory (profil, annuaire public, contact), dont les erreurs de champ ne portent que field et message.'
          example: REQUIRED
          type: string
        field:
          description: Chemin du champ fautif dans le corps envoyé (notation pointée pour les objets imbriqués, ex. feeling.emotionCode) ; chaîne vide si l'erreur ne vise aucun champ précis.
          example: occurred
          type: string
        message:
          description: Message lisible, dans la langue d'Accept-Language (français par défaut).
          example: La valeur est obligatoire.
          type: string
      required:
      - field
      - message
      type: object
    FlagDto:
      description: Drapeau actif posé sur un patient (point d'attention clinique). Un drapeau levé n'est plus renvoyé.
      properties:
        kind:
          description: 'Nature du drapeau : watch = à surveiller (une raison est alors obligatoire), risk = risque, shared_care = suivi partagé avec un autre professionnel.'
          enum:
          - watch
          - risk
          - shared_care
          example: watch
          type: string
        reason:
          description: Raison saisie par le praticien ; toujours renseignée pour watch, null pour risk et shared_care quand aucune raison n'a été saisie.
          example: Troubles du sommeil depuis trois semaines
          type: string
        setAt:
          description: Date-heure de pose du drapeau, UTC ISO 8601.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
      type: object
    FlagRequest:
      description: Drapeau à poser sur un patient (à la création ou via POST /flags).
      properties:
        kind:
          description: 'Nature du drapeau : watch = à surveiller, risk = risque, shared_care = suivi partagé. Toute autre valeur est refusée (422 VALIDATION_FAILED).'
          enum:
          - watch
          - risk
          - shared_care
          example: risk
          type: string
        reason:
          description: Raison libre ; obligatoire (non vide) pour watch, facultative pour risk et shared_care.
          example: Idées noires évoquées en séance
          type: string
      required:
      - kind
      type: object
    GraphDto:
      description: 'Graphe d''un patient : au plus 150 nœuds (500 pour un développement par expand), leurs arêtes et les groupes de nœuds regroupés.'
      properties:
        edges:
          description: 'Liens acceptés dont les deux extrémités sont des nœuds rendus (pour un expand : les liens incidents à au moins un membre).'
          items:
            $ref: '#/components/schemas/GraphEdgeDto'
          type: array
        nodes:
          description: Nœuds rendus, des plus proches de la racine aux plus éloignés, puis par degré décroissant, date de début décroissante et identifiant.
          items:
            $ref: '#/components/schemas/GraphNodeDto'
          type: array
        superNodes:
          description: Groupes de nœuds regroupés en remplacement de leurs membres ; vide si rien n'a été regroupé, et toujours vide pour un expand.
          items:
            $ref: '#/components/schemas/GraphSuperNodeDto'
          type: array
        truncated:
          description: 'true si le graphe est incomplet : des nœuds ont été regroupés en super-nœuds ou retirés pour tenir en 150 nœuds (500 pour un expand).'
          example: false
          type: boolean
      type: object
    GraphEdgeDto:
      description: 'Arête du graphe : un lien accepté entre deux nœuds rendus.'
      properties:
        directed:
          description: true si le type est dirigé (flèche de source vers cible) ; false pour un type symétrique comme co_occurs, dont le sens est sans signification.
          example: true
          type: boolean
        id:
          description: Identifiant du lien.
          example: 5d2f7a10-8c4b-4e6a-b1d3-7f9e0a2c4b68
          format: uuid
          type: string
        linkType:
          description: Code du type de lien (triggers, caused_by, worsens, relieves, co_occurs, follows, part_of, treats), référentiel GET /api/vocabulary/link-types.
          example: triggers
          type: string
        provenance:
          description: 'Origine du lien : manual en V1 (ai_suggested et ai_confirmed sont réservés à l''IA, V2).'
          example: manual
          type: string
        source:
          description: Identifiant de l'entrée source du lien.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        status:
          description: 'Statut du lien : toujours accepted dans un graphe (les autres statuts n''y figurent pas).'
          example: accepted
          type: string
        target:
          description: Identifiant de l'entrée cible du lien.
          example: c1a7e9d4-2b3f-4a6c-8d5e-0f1a2b3c4d5e
          format: uuid
          type: string
      type: object
    GraphNodeDto:
      description: 'Nœud du graphe : une entrée non archivée du patient.'
      properties:
        authorType:
          description: 'Auteur de l''entrée : toujours practitioner en V1. Lecture seule, jamais accepté en écriture.'
          enum:
          - practitioner
          example: practitioner
          readOnly: true
          type: string
        degree:
          description: Nombre de liens acceptés de l'entrée dans tout le dossier du patient, pas seulement dans le graphe rendu.
          example: 3
          format: int32
          type: integer
        distance:
          description: 'Distance à la racine en nombre de liens : 0 pour la racine, 1 pour tous les nœuds d''un graphe sans racine et pour les membres d''un expand.'
          example: 1
          format: int32
          type: integer
        emotion:
          description: Code de l'émotion (référentiel GET /api/vocabulary/emotions) ; null sauf pour un ressenti (feeling).
          example: fear
          type: string
        id:
          description: Identifiant de l'entrée.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        intensity:
          description: Intensité de 0 à 10 ; null sauf pour un ressenti (feeling).
          example: 7
          format: int32
          maximum: 10
          minimum: 0
          type: integer
        occurred:
          description: Début de l'occurrence de l'entrée (occurred.from), ISO 8601 UTC ; null si l'entrée n'a pas de date.
          example: 2026-10-12T07:30:00Z
          format: date-time
          type: string
        title:
          description: Titre de l'entrée ; null si elle n'en a pas.
          example: Peur au réveil
          type: string
        type:
          description: 'Code du type d''entrée : note, event, situation, feeling, session ou medication (référentiel GET /api/vocabulary/entry-types).'
          example: feeling
          type: string
      type: object
    GraphSuperNodeDto:
      description: 'Super-nœud : regroupement de nœuds de degré 1 d''un même type d''entrée reliés au même voisin, rendu à la place de ses membres quand le graphe dépasse 150 nœuds.'
      properties:
        count:
          description: Nombre de nœuds regroupés (au moins 2).
          example: 12
          format: int32
          type: integer
        dominantEmotion:
          description: Code de l'émotion la plus fréquente parmi les membres (ordre alphabétique à égalité) ; null si aucun membre n'a d'émotion.
          example: fear
          type: string
        id:
          description: Identifiant du groupe, de la forme sn:{neighborId}:{type d'entrée} ; à renvoyer tel quel dans superNodeId de POST /api/patients/{id}/graph/expand.
          example: sn:9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e:feeling
          type: string
        memberIds:
          description: Identifiants des entrées regroupées, triés par ordre croissant.
          items:
            format: uuid
            type: string
          type: array
        neighborId:
          description: Identifiant de l'entrée voisine, rendue dans nodes, à laquelle le groupe est relié.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        type:
          description: Code du type d'entrée commun à tous les membres.
          example: feeling
          type: string
      type: object
    Item:
      description: Entrée d'une liste fermée de l'annuaire, avec ses libellés fr et en.
      properties:
        code:
          description: Code stable à envoyer dans le profil ou dans les filtres de recherche (minuscules et underscores, ou code de langue ISO 639-1).
          example: anxiety
          type: string
        labelEn:
          description: Libellé en anglais ; peut être null pour une entrée ajoutée sans.
          example: Anxiety
          type: string
        labelFr:
          description: Libellé en français.
          example: Anxiété
          type: string
      type: object
    ItemDto:
      description: Entrée du vocabulaire de l'annuaire, active ou non.
      properties:
        active:
          description: true si l'entrée est proposée dans l'annuaire ; false si désactivée (invisible dans GET /api/vocabulary/directory et refusée dans les profils).
          type: boolean
        code:
          description: Code stable de l'entrée, unique pour le type.
          example: anxiety
          type: string
        kind:
          description: 'Type de l''entrée : specialty (spécialité) ou audience (public).'
          enum:
          - specialty
          - audience
          example: specialty
          type: string
        labelEn:
          description: Libellé anglais ; null s'il n'y en a pas.
          example: Anxiety
          type: string
        labelFr:
          description: Libellé français.
          example: Anxiété
          type: string
        sortOrder:
          description: Rang d'affichage dans le type, de 0 à 32767.
          example: 1
          format: int32
          type: integer
        usedByPublishedProfiles:
          description: Nombre de fiches publiées qui utilisent ce code ; tant qu'il est supérieur à 0, l'entrée ne peut pas être désactivée.
          example: 3
          format: int32
          type: integer
      type: object
    JournalDto:
      description: Page du journal d'administration, des plus récents aux plus anciens.
      properties:
        items:
          description: Lignes du journal de la page.
          items:
            $ref: '#/components/schemas/JournalItemDto'
          type: array
        nextCursor:
          description: Curseur opaque à renvoyer dans le paramètre cursor pour la page suivante ; null sur la dernière page.
          type: string
      type: object
    JournalItemDto:
      description: 'Ligne du journal d''administration : une décision ou un événement de sécurité. Jamais d''adresse IP ni de donnée patient.'
      properties:
        actor:
          $ref: '#/components/schemas/ActorDto'
          description: Administrateur auteur de l'acte ; null si l'événement n'est pas l'acte d'un administrateur (praticien lui-même ou système).
        actorType:
          description: 'Nature de l''auteur : admin (un administrateur a agi), practitioner (le compte concerné lui-même) ou system (ni l''un ni l''autre).'
          enum:
          - admin
          - practitioner
          - system
          type: string
        at:
          description: Date-heure UTC (ISO 8601) de l'événement.
          example: 2026-04-02T10:00:00Z
          format: date-time
          type: string
        details:
          additionalProperties: {}
          description: Détails structurés de l'événement (clés et valeurs JSON variables selon kind, par exemple reason, previousStatus, newStatus, decisionId, appealId) ; objet vide s'il n'y en a pas.
          type: object
        id:
          description: Identifiant de la ligne.
          example: 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
          format: uuid
          type: string
        kind:
          description: Type d'événement, en minuscules avec points ou soulignés. Les décisions apparaissent sous admin.<kind> (admin.approved, admin.suspended, admin.appeal_accepted…), les événements de sécurité sous leur propre nom (admin.decision, admin.suspend, admin.reactivate, admin.appeal, admin.document_read, appeal.submitted, verification_submitted, session_revoked, login_failed, locked…).
          example: admin.suspend
          type: string
        practitionerDisplayName:
          description: Nom d'affichage du compte concerné ; null si practitionerId est null.
          example: Claire Martin
          type: string
        practitionerId:
          description: Identifiant du compte concerné ; null si l'événement n'est rattaché à aucun compte.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        source:
          description: 'Table d''origine de la ligne : security_event (événement de sécurité) ou verification_decision (décision d''administration).'
          enum:
          - security_event
          - verification_decision
          type: string
        summary:
          description: 'Résumé lisible : le champ summary des détails s''il existe, sinon le message de la décision, sinon le type d''événement.'
          example: 'Compte suspendu : signalements répétés'
          type: string
      type: object
    LinkDto:
      description: Lien entre deux entrées d'un même patient, vu depuis une entrée de référence (l'entrée de l'URL ; la source du lien pour un changement de type).
      properties:
        authorId:
          description: Identifiant du praticien qui a posé le lien ; null pour une suggestion de l'IA (V2, jamais en V1).
          example: 7e0b3d92-4c1a-4f58-a6b7-9c8d7e6f5a4b
          format: uuid
          type: string
        createdAt:
          description: Date de création du lien, ISO 8601 UTC.
          example: 2026-10-12T14:30:00Z
          format: date-time
          type: string
        id:
          description: Identifiant du lien.
          example: 5d2f7a10-8c4b-4e6a-b1d3-7f9e0a2c4b68
          format: uuid
          type: string
        label:
          description: 'Verbe du lien vu depuis l''entrée de référence, dans la langue de la requête : le libellé direct si elle est la source, le libellé inverse si elle est la cible d''un type dirigé (par exemple « déclenche » ou « déclenché par »).'
          example: déclenche
          type: string
        linkType:
          description: Code du type de lien (triggers, caused_by, worsens, relieves, co_occurs, follows, part_of, treats). Toujours le code du sens source vers cible, jamais un type passif.
          example: triggers
          type: string
        provenance:
          description: 'Origine du lien : manual (posé par le praticien), seule valeur produite en V1. Valeurs réservées à l''IA (V2) : ai_suggested, ai_confirmed.'
          example: manual
          type: string
        rationale:
          description: Justification saisie à la pose du lien ; null si aucune.
          example: Depuis le décès, les réveils sont angoissés.
          type: string
        sentence:
          description: Phrase lisible « entrée verbe autre entrée » vue depuis l'entrée de référence, dans la langue de la requête ; chaque entrée y est désignée par son titre, sinon par un extrait de 60 caractères de son texte, sinon par « une entrée ».
          example: Décès du père déclenche Peur au réveil
          type: string
        sourceId:
          description: Identifiant de l'entrée source du lien.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        status:
          description: 'Statut du lien : accepted (lien actif), seule valeur rendue en V1. Valeurs réservées : proposed et rejected (suggestions de l''IA, V2), superseded (lien remplacé ou supprimé, jamais rendu par cette API).'
          example: accepted
          type: string
        targetId:
          description: Identifiant de l'entrée cible du lien.
          example: c1a7e9d4-2b3f-4a6c-8d5e-0f1a2b3c4d5e
          format: uuid
          type: string
      type: object
    LinkTypeView:
      description: Type de lien entre deux entrées (huit types), avec la matrice des types d'entrée admis en source et en cible.
      properties:
        allowedSourceTypes:
          description: Codes des types d'entrée (voir /api/vocabulary/entry-types) admis comme source du lien.
          items:
            type: string
          type: array
        allowedTargetTypes:
          description: Codes des types d'entrée admis comme cible du lien.
          items:
            type: string
          type: array
        code:
          description: Code stable du type de lien.
          enum:
          - triggers
          - caused_by
          - worsens
          - relieves
          - co_occurs
          - follows
          - part_of
          - treats
          example: triggers
          type: string
        directed:
          description: true si le lien a un sens (source vers cible) ; false si symétrique (co_occurs).
          example: true
          type: boolean
        inverseLabelEn:
          description: Libellé anglais vu depuis l'entrée cible ; null si non orienté.
          example: triggered by
          type: string
        inverseLabelFr:
          description: Libellé français vu depuis l'entrée cible ; null si le lien n'est pas orienté.
          example: déclenché par
          type: string
        labelEn:
          description: Libellé anglais vu depuis l'entrée source.
          example: triggers
          type: string
        labelFr:
          description: Libellé français vu depuis l'entrée source.
          example: déclenche
          type: string
        lineStyle:
          description: Style de trait conseillé pour le graphe.
          enum:
          - solid
          - long_dash
          - short_dash
          - dotted
          - thin
          - double
          example: solid
          type: string
        sortOrder:
          description: Rang d'affichage, croissant ; la liste est déjà triée dans cet ordre.
          example: 1
          format: int32
          type: integer
      type: object
    ListDto:
      description: Entrées du vocabulaire de l'annuaire.
      properties:
        items:
          description: Entrées, actives ou non, par type puis rang puis libellé français quand les deux types sont listés.
          items:
            $ref: '#/components/schemas/ItemDto'
          type: array
      type: object
    LoginRequest:
      description: Identifiants de connexion ; otp seulement si la 2FA est active.
      properties:
        email:
          description: Adresse e-mail du compte (254 caractères au maximum).
          example: camille.martin@example.org
          maxLength: 254
          minLength: 0
          type: string
        otp:
          description: Code TOTP à 6 chiffres ou code de secours (32 caractères au maximum). À envoyer seulement si la 2FA est active ; s'il manque, la réponse est 202 otpRequired.
          example: '123456'
          maxLength: 32
          minLength: 0
          type: string
        password:
          description: Mot de passe du compte (200 caractères au maximum).
          maxLength: 200
          minLength: 0
          type: string
        rememberMe:
          description: true pour une session de 30 jours (cookie persistant) au lieu de 12 h d'inactivité. Absent = false.
          type: boolean
      required:
      - email
      - password
      type: object
    MeResponse:
      description: Praticien connecté, tel qu'ouvert par la session.
      properties:
        displayName:
          description: Nom affiché (précédé de Dr pour un psychiatre).
          example: Camille Martin
          type: string
        email:
          description: Adresse e-mail du compte.
          example: camille.martin@example.org
          type: string
        id:
          description: Identifiant du praticien.
          format: uuid
          type: string
        profession:
          description: 'Profession : psychologist, psychiatrist ou coach.'
          enum:
          - psychologist
          - psychiatrist
          - coach
          example: psychologist
          type: string
        tenantId:
          description: Identifiant du cabinet (tenant) du praticien ; toutes ses données y sont rattachées.
          format: uuid
          type: string
        verificationStatus:
          description: 'Statut de vérification du praticien lors de l''ouverture de la session : email_pending, docs_pending, under_review, approved, needs_more, rejected, suspended ou closed (GET /api/auth/session le relit à jour).'
          enum:
          - email_pending
          - docs_pending
          - under_review
          - approved
          - needs_more
          - rejected
          - suspended
          - closed
          example: approved
          type: string
      type: object
    MergeEmotionRequest:
      description: Cible d'une fusion d'émotions.
      properties:
        targetCode:
          description: 'Code de l''émotion active qui absorbe la source : une émotion globale ou une autre émotion personnalisée du praticien. Obligatoire, différent de la source.'
          example: sadness
          type: string
      required:
      - targetCode
      type: object
    MergeTagRequest:
      description: Cible d'une fusion de tags.
      properties:
        targetId:
          description: Identifiant du tag actif du praticien qui absorbe le tag source ; obligatoire, différent de la source.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
      required:
      - targetId
      type: object
    MergeView:
      description: Fusion d'une émotion personnalisée dans une autre, annulable pendant 30 jours.
      properties:
        affectedCount:
          description: Nombre de ressentis dont l'émotion est passée de la source à la cible.
          example: 3
          format: int32
          type: integer
        id:
          description: Identifiant de la fusion, à fournir pour l'annuler.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        mergedAt:
          description: Date-heure de la fusion, UTC ISO 8601.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
        sourceCode:
          description: Code de l'émotion personnalisée absorbée (désormais inactive).
          example: c_1a2b3c4d
          type: string
        targetCode:
          description: Code de l'émotion qui a absorbé la source.
          example: sadness
          type: string
        undoUntil:
          description: Date-heure limite d'annulation (30 jours après la fusion), UTC ISO 8601.
          example: 2026-04-13T09:30:00Z
          format: date-time
          type: string
        undoneAt:
          description: Date-heure de l'annulation, UTC ISO 8601 ; null tant que la fusion n'a pas été annulée.
          example: 2026-03-20T10:00:00Z
          format: date-time
          type: string
      type: object
    NarrativeDto:
      description: 'Résumé rédigé par règles (jusqu''à 5 phrases, chacune omise si ses données manquent, sans IA), dans la langue de la requête (Accept-Language : français par défaut, anglais si demandé).'
      properties:
        attention:
          description: Point d'attention issu des drapeaux actifs ; null sans drapeau. Le mot « risque » n'apparaît jamais.
          example: 'À surveiller depuis le 14 mars 2026 (motif : Troubles du sommeil).'
          type: string
        sentences:
          description: 'Phrases dans l''ordre : cadre du suivi, tendance, situations ouvertes, événement non commenté, traitement en cours ; chacune est omise si ses données manquent (liste éventuellement vide).'
          items:
            type: string
          type: array
      type: object
    OpenSessionDto:
      description: Séance ouverte (non clôturée).
      properties:
        entryId:
          description: Identifiant de l'entrée séance.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        startedAt:
          description: Début de la séance (occurred_from), UTC ISO 8601.
          example: 2026-03-14T09:00:00Z
          format: date-time
          type: string
      type: object
    OtpRequiredDto:
      description: 'Réponse 202 sans job créé : le mot de passe est correct, la double authentification est active et aucun code n''a été fourni. Renvoyer la même requête avec otp.'
      properties:
        otpRequired:
          description: 'Toujours vrai : un code de double authentification est requis.'
          type: boolean
      type: object
    OtpRequiredResponse:
      description: 'Réponse 202 : le mot de passe est correct, la double authentification est active et le code manque. Renvoyer la même requête avec le champ otp.'
      properties:
        otpRequired:
          description: Toujours true.
          example: true
          type: boolean
      type: object
    OverviewDto:
      description: 'Synthèse clinique d''un patient pour une fenêtre (30d, 90d ou 12m) : faits clés, situations actives, tendance, émotions dominantes, ressentis, brouillons, activité récente, résumé rédigé et séances récentes.'
      properties:
        activeSituations:
          description: Situations en cours (sans fin connue), triées par nombre de liens décroissant ; liste vide s'il n'y en a pas.
          items:
            $ref: '#/components/schemas/ActiveSituationDto'
          type: array
        computedAt:
          description: Date-heure du calcul de la projection, UTC ISO 8601 (jamais d'un jour UTC antérieur à aujourd'hui).
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
        drafts:
          $ref: '#/components/schemas/DraftsDto'
          description: Brouillons en attente et séance ouverte.
        emotions:
          $ref: '#/components/schemas/EmotionsDto'
          description: Émotions dominantes de la fenêtre.
        facts:
          $ref: '#/components/schemas/OverviewFactsDto'
          description: Faits clés du dossier, indépendants de la fenêtre.
        feelings:
          $ref: '#/components/schemas/FeelingsDto'
          description: 'Ressentis réels de la fenêtre : un point par ressenti, une série par émotion.'
        narrative:
          $ref: '#/components/schemas/NarrativeDto'
          description: Résumé « En bref » rédigé par règles (sans IA), dans la langue d'Accept-Language.
        recentActivity:
          description: 10 dernières entrées non archivées saisies ou corrigées, de la plus récente à la plus ancienne, lues en direct (hors projection) ; entrées privées incluses.
          items:
            $ref: '#/components/schemas/RecentActivityItemDto'
          type: array
        recentSessions:
          description: 5 dernières séances non archivées, de la plus récente à la plus ancienne ; la plus récente porte son compte rendu entier.
          items:
            $ref: '#/components/schemas/RecentSessionDto'
          type: array
        sinceLastSession:
          $ref: '#/components/schemas/SinceLastSessionDto'
          description: Entrées saisies depuis la dernière séance clôturée.
        sourceRev:
          description: 'Révision du dossier (patient.clinical_rev) au moment du calcul : compteur croissant, utile pour détecter un changement.'
          example: 42
          format: int64
          type: integer
        trend:
          $ref: '#/components/schemas/TrendDto'
          description: Courbe d'intensité et repères de la fenêtre.
        window:
          description: Fenêtre appliquée à trend, emotions et feelings.
          enum:
          - 30d
          - 90d
          - 12m
          example: 90d
          type: string
      type: object
    OverviewFactsDto:
      description: Faits clés du patient.
      properties:
        activeMedications:
          description: Médicaments en cours (fin ni connue ni passée), une ligne par molécule, du plus récent au plus ancien ; liste vide s'il n'y en a pas.
          items:
            $ref: '#/components/schemas/ActiveMedicationDto'
          type: array
        age:
          description: Âge en années révolues aujourd'hui ; null si la date de naissance n'est pas renseignée.
          example: 34
          format: int32
          type: integer
        flags:
          description: Drapeaux actifs (non levés), du plus ancien au plus récent.
          items:
            $ref: '#/components/schemas/OverviewFlagDto'
          type: array
        followedSince:
          description: 'Date de début du suivi AAAA-MM-JJ : follow_up.since de la fiche si elle est valide, sinon la date de création du dossier.'
          example: 2025-09-01T00:00:00Z
          format: date
          type: string
        sessionCount:
          description: Nombre de séances non archivées.
          example: 12
          format: int32
          type: integer
      type: object
    OverviewFlagDto:
      description: Drapeau actif posé à la main sur le dossier.
      properties:
        kind:
          description: 'Nature : watch = à surveiller, risk = risque, shared_care = suivi partagé.'
          enum:
          - watch
          - risk
          - shared_care
          example: watch
          type: string
        reason:
          description: Raison saisie ; null si aucune (toujours renseignée pour watch).
          example: Troubles du sommeil
          type: string
        setAt:
          description: Date-heure de pose, UTC ISO 8601.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
      type: object
    PasswordChangeRequest:
      description: 'Changement de mot de passe sans session : e-mail et mot de passe actuel prouvent l''identité (compte de bootstrap à mot de passe à usage unique, ou changement volontaire). otp seulement si la 2FA est active.'
      properties:
        currentPassword:
          description: Mot de passe actuel (200 caractères au maximum).
          maxLength: 200
          minLength: 0
          type: string
        email:
          description: Adresse e-mail du compte (254 caractères au maximum).
          example: camille.martin@example.org
          maxLength: 254
          minLength: 0
          type: string
        newPassword:
          description: 'Nouveau mot de passe (200 caractères au maximum) : politique de mot de passe, différent de l''actuel (422 PASSWORD_POLICY ou PASSWORD_UNCHANGED).'
          maxLength: 200
          minLength: 0
          type: string
        otp:
          description: Code TOTP à 6 chiffres ou code de secours (32 caractères au maximum), requis si la 2FA est active ; s'il manque, la réponse est 202 otpRequired.
          example: '123456'
          maxLength: 32
          minLength: 0
          type: string
      required:
      - currentPassword
      - email
      - newPassword
      type: object
    PasswordResetConfirmRequest:
      description: Nouveau mot de passe choisi à partir du lien de réinitialisation.
      properties:
        password:
          description: Nouveau mot de passe (200 caractères au maximum), soumis à la politique de mot de passe (422 PASSWORD_POLICY sinon ; le jeton n'est alors pas consommé).
          maxLength: 200
          minLength: 0
          type: string
        token:
          description: Jeton à usage unique reçu par e-mail, valable 30 minutes (200 caractères au maximum).
          example: q3F9x0Zb7mYw2eKq5uVtJ1cH8aLrN4dS6pGoXi0TyUE
          maxLength: 200
          minLength: 0
          type: string
      required:
      - password
      - token
      type: object
    PasswordResetRequest:
      description: Demande d'envoi d'un lien de réinitialisation du mot de passe.
      properties:
        email:
          description: Adresse e-mail du compte (254 caractères au maximum).
          example: camille.martin@example.org
          format: email
          maxLength: 254
          minLength: 0
          type: string
      required:
      - email
      type: object
    PatchEntryRequest:
      description: 'Correction partielle d''une entrée : un champ absent est inchangé ; occurred et tags sont remplacés en entier ; un bloc de détail est fusionné champ par champ avec le détail courant et doit correspondre au type de l''entrée (DETAIL_NOT_ALLOWED sinon). Dans la fenêtre de grâce de 1 h 15 la modification est faite en place, sinon elle crée une nouvelle version. Le type ne se modifie pas. authorType et submissionId sont refusés (UNKNOWN_FIELD), links aussi (NOT_SUPPORTED_ON_PATCH).'
      properties:
        body:
          description: Nouveau texte. Une note ne peut pas perdre son texte (REQUIRED).
          type: string
        feeling:
          $ref: '#/components/schemas/EntryFeelingRequest'
          description: Détail du ressenti à fusionner (entrée de type feeling).
        medication:
          $ref: '#/components/schemas/EntryMedicationRequest'
          description: Détail du médicament à fusionner (entrée de type medication).
        occurred:
          $ref: '#/components/schemas/EntryOccurredRequest'
          description: Nouveau moment de l'entrée, remplacé en entier.
        reason:
          description: Motif de la correction, conservé sur la nouvelle version. Sans effet quand la modification est faite en place pendant la fenêtre de grâce.
          example: précision apportée en séance
          type: string
        session:
          $ref: '#/components/schemas/EntrySessionRequest'
          description: Détail de la séance à fusionner (entrée de type session).
        status:
          description: 'Nouveau statut : draft ou final. Autre valeur : INVALID_VALUE.'
          enum:
          - draft
          - final
          type: string
        tags:
          description: Nouveaux libellés de tags, remplaçant la liste actuelle (UNKNOWN_TAG sur tags[i] si un libellé n'existe pas). Un changement de tags seul ne crée jamais de version.
          items:
            type: string
          type: array
        title:
          description: Nouveau titre. Un event ou une situation ne peut pas perdre son titre (REQUIRED).
          type: string
        visibility:
          description: 'Nouvelle visibilité : private ou clinical. Autre valeur : INVALID_VALUE.'
          enum:
          - private
          - clinical
          type: string
      type: object
    PatchRequest:
      description: 'Modification partielle d''une entrée : un champ absent reste inchangé. Le code et le type ne se modifient pas.'
      properties:
        active:
          description: false pour désactiver l'entrée (409 VOCABULARY_IN_USE si une fiche publiée l'utilise), true pour la réactiver.
          type: boolean
        labelEn:
          description: 'Nouveau libellé anglais, 120 caractères au plus ; chaîne vide : efface le libellé anglais.'
          maxLength: 120
          type: string
        labelFr:
          description: Nouveau libellé français, non vide, 120 caractères au plus.
          maxLength: 120
          type: string
        sortOrder:
          description: Nouveau rang d'affichage dans le type, de 0 à 32767.
          format: int32
          maximum: 32767
          minimum: 0
          type: integer
      type: object
    PatientDto:
      description: Fiche d'un patient du praticien connecté, avec ses drapeaux actifs et ses tags. Chaque modification par PATCH incrémente currentVersion et archive un instantané consultable via GET /api/patients/{id}/versions.
      properties:
        archivedAt:
          description: Date-heure d'archivage, UTC ISO 8601 ; null tant que le patient est actif.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
        birthDate:
          description: Date de naissance AAAA-MM-JJ ; null si non renseignée. Passée et de moins de 120 ans.
          example: 1990-04-02T00:00:00Z
          format: date
          type: string
        context:
          additionalProperties: {}
          description: 'Contexte de vie du patient : objet JSON libre dont les clés et valeurs sont définies par le client (par exemple activity). Objet vide si rien n''est renseigné.'
          type: object
        createdAt:
          description: Date-heure de création, UTC ISO 8601.
          example: 2026-01-05T08:00:00Z
          format: date-time
          type: string
        currentVersion:
          description: 'Numéro de la version courante de la fiche : 1 à la création, +1 à chaque modification par PATCH.'
          example: 1
          format: int32
          type: integer
        displayName:
          description: Nom affiché dans toute l'application (obligatoire, espaces de bord retirés).
          example: Marie D.
          type: string
        email:
          description: Adresse e-mail, texte libre ; null si non renseignée.
          example: marie.d@example.org
          type: string
        firstName:
          description: Prénom ; null si non renseigné.
          example: Marie
          type: string
        flags:
          description: Drapeaux actifs, du plus ancien au plus récent ; liste vide si aucun.
          items:
            $ref: '#/components/schemas/FlagDto'
          type: array
        followUp:
          additionalProperties: {}
          description: 'Cadre du suivi : objet JSON libre dont les clés et valeurs sont définies par le client (par exemple rhythm). Objet vide si rien n''est renseigné.'
          type: object
        id:
          description: Identifiant du patient.
          example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
          format: uuid
          type: string
        lastName:
          description: Nom de famille ; null si non renseigné.
          example: Dupont
          type: string
        phone:
          description: Téléphone, texte libre ; null si non renseigné.
          example: '0102030405'
          type: string
        pronoun:
          description: Pronom d'adresse libre ; null si non renseigné.
          example: elle
          type: string
        tags:
          description: Tags du patient ; liste vide si aucun.
          items:
            $ref: '#/components/schemas/TagDto'
          type: array
        updatedAt:
          description: Date-heure de dernière modification, UTC ISO 8601.
          example: 2026-03-14T09:30:00Z
          format: date-time
          type: string
      type: object
    PatientPage:
      description: Page de patients, paginée par curseur opaque.
      properties:
        items:
          description: Patients de la page, dans l'ordre du paramètre sort.
          items:
            $ref: '#/components/schemas/PatientDto'
          type: array
        nextCursor:
          description: Curseur opaque à renvoyer tel quel dans le paramètre cursor pour obtenir la page suivante ; null sur la dernière page.
          example: bzo1MA
          type: string
      type: object
    Preferences:
      description: 'Préférences à plat du compte : 9 clés connues, aux noms pointés (par exemple "overview.view"), sans objet imbriqué. En lecture, les 9 clés sont toujours présentes (valeur enregistrée, sinon défaut selon la profession). En PATCH, toutes les clés sont optionnelles : null remet la clé à son défaut, une clé inconnue est ignorée.'
      properties:
        entries.defaultVisibility:
          description: 'Visibilité proposée par défaut pour une nouvelle entrée : clinical = clinique, private = privée. Défaut : clinical.'
          enum:
          - clinical
          - private
          example: clinical
          type: string
        entryTypes.medicationVisible:
          description: 'true si le type d''entrée « médication » est proposé à la saisie. Défaut : true pour un psychiatre, false sinon.'
          type: boolean
        locale:
          description: 'Langue de l''interface : fr (français) ou en (anglais). Défaut : fr.'
          enum:
          - fr
          - en
          example: fr
          type: string
        overview.view:
          description: 'Vue d''ensemble du dossier : simple = version condensée, complete = version détaillée. Défaut : simple.'
          enum:
          - simple
          - complete
          example: simple
          type: string
        overview.window:
          description: 'Fenêtre de temps de la vue d''ensemble : 30d = 30 jours, 90d = 90 jours, 12m = 12 mois. Défaut : 90d.'
          enum:
          - 30d
          - 90d
          - 12m
          example: 90d
          type: string
        sessions.defaultDurationMin:
          description: 'Durée proposée par défaut pour une séance, en minutes (entier de 15 à 180). Défaut : 60.'
          example: 60
          format: int32
          maximum: 180
          minimum: 15
          type: integer
        theme:
          description: 'Thème visuel de l''application : light = clair, soft = doux, dark = sombre, system = celui du système. Défaut : light.'
          enum:
          - light
          - soft
          - dark
          - system
          example: light
          type: string
        timeline.groupBy:
          description: 'Regroupement de la chronologie : session = par séance, month = par mois, chronological = liste chronologique sans regroupement. Défaut : session.'
          enum:
          - session
          - month
          - chronological
          example: session
          type: string
        vocabulary.subjectLabel:
          description: 'Mot employé pour désigner la personne suivie : patient ou client. Défaut : client pour un coach, patient sinon.'
          enum:
          - patient
          - client
          example: patient
          type: string
      type: object
    ProblemDetail:
      description: Corps de toute réponse d'erreur (application/problem+json, RFC 9457). Les champs type, title, status, detail et code sont toujours présents ; errors[] et les champs complémentaires (retryAfterSeconds, existingLinkId, allowedLinkTypes, missing, pendingDocuments, usedByPublishedProfiles, suggestedEmotion) seulement pour les codes indiqués.
      properties:
        allowedLinkTypes:
          description: Types de lien autorisés pour ce couple d'entrées ; présent quand le code de champ est LINK_TYPE_NOT_ALLOWED. Objets {code, label} sur les routes de liens (POST /api/entries/{id}/links, PATCH /api/links/{id}) ; simples codes (chaînes) dans le 422 de POST /api/patients/{id}/entries.
          items:
            description: 'Un type de lien autorisé : objet {code, label} sur les routes de liens, simple code (chaîne) sur la création d''entrée.'
            oneOf:
            - description: Code du type de lien.
              example: treats
              type: string
            - description: Type de lien avec son libellé.
              properties:
                code:
                  description: Code du type de lien.
                  example: treats
                  type: string
                label:
                  description: Libellé du type de lien.
                  example: traite
                  type: string
              type: object
          type: array
        code:
          description: 'Code d''erreur stable, en MAJUSCULES_SOULIGNÉES, indépendant de la langue : c''est lui que le client teste. Codes transverses dans la description générale, codes métier sur chaque opération.'
          example: VALIDATION_FAILED
          type: string
        detail:
          description: Explication lisible destinée à l'utilisateur ; générique pour les erreurs 5xx (jamais de message interne).
          example: Certains champs sont invalides.
          type: string
        errors:
          description: Erreurs par champ ; présentes sur les 422 (VALIDATION_FAILED ou code métier de champ comme SESSION_REQUIRED), sur les 400 de paramètre (BAD_REQUEST, INVALID_PARAMETERS, SEARCH_BAD_REQUEST, OVERVIEW_BAD_REQUEST) et sur le 409 ENTRY_ARCHIVED des liens ; absentes sinon.
          items:
            $ref: '#/components/schemas/FieldProblem'
          type: array
        existingLinkId:
          description: Identifiant du lien déjà existant ; présent sur 409 LINK_EXISTS.
          format: uuid
          type: string
        instance:
          description: Chemin de la requête en erreur ; absent pour les erreurs des filtres.
          example: /api/patients/9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e/entries
          format: uri
          type: string
        missing:
          description: 'Éléments manquants pour l''action demandée : champs du profil (409 PROFILE_INCOMPLETE) ou justificatifs (409 VERIFICATION_INCOMPLETE).'
          items:
            type: string
          type: array
        pendingDocuments:
          description: Identifiants des justificatifs encore en attente de qualification ; présent sur 409 ADMIN_APPROVAL_INCOMPLETE.
          items:
            format: uuid
            type: string
          type: array
        retryAfterSeconds:
          description: Secondes avant nouvel essai ; présent sur 429 RATE_LIMITED et sur les 423 de verrouillage d'authentification, avec l'en-tête Retry-After.
          example: 37
          format: int64
          type: integer
        status:
          description: Statut HTTP de la réponse, répété dans le corps.
          example: 422
          format: int32
          type: integer
        suggestedEmotion:
          additionalProperties: true
          description: Émotion du vocabulaire dont le libellé est identique au tag demandé (forme EmotionView) ; présent sur 422 TAG_IS_EMOTION de POST et PATCH /api/tags.
          type: object
        title:
          description: 'Titre court : libellé HTTP en anglais (Not Found) ou titre métier ; ne pas l''afficher, utiliser code.'
          example: Unprocessable Content
          type: string
        type:
