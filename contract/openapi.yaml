  /api/vocabulary/emotions:
    get:
      description: 'Session praticien. Renvoie les 29 émotions globales du produit plus les émotions personnalisées actives du praticien connecté (jamais celles d''un autre praticien) ; les émotions fusionnées sont absentes. Tri : globales d''abord, puis par famille, niveau d''intensité (non renseigné en dernier) et libellé. Liste complète, non paginée.'
      operationId: emotions
