  /api/me/verification/documents/{id}/file:
    get:
      description: Session praticien (compte confirmé), propriétaire du justificatif, avec la signature obtenue par GET .../url (exp et sig, valables 5 minutes). Renvoie le fichier déchiffré dans son type d'origine (PDF, JPEG ou PNG), en Content-Disposition inline, Cache-Control no-store et X-Content-Type-Options nosniff. Chaque lecture est inscrite au journal d'accès aux documents (adresse IP du client).
      operationId: getDocumentFile
      parameters:
      - description: Identifiant du justificatif.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Échéance de la signature, en secondes depuis l''epoch Unix (UTC), telle que renvoyée dans l''url de GET .../url. Sa valeur est signée : ne pas la modifier.'
        example: 1773480600
        in: query
        name: exp
        required: false
        schema:
          format: int64
          type: integer
      - description: Signature de l'URL, telle que renvoyée dans l'url de GET .../url.
        example: x7F2k9Qw0m5T3bYh8LrN1cVdE6aGsUoJpZiXtKyA4Hc
        in: query
        name: sig
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
          description: Fichier du justificatif (corps binaire).
          headers:
            Cache-Control:
              description: no-store.
              style: simple
            Content-Disposition:
              description: inline.
              style: simple
            X-Content-Type-Options:
              description: nosniff.
              style: simple
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'DOCUMENT_FORBIDDEN : le justificatif appartient à un autre praticien ; SIGNED_URL_INVALID : exp ou sig absent, signature incorrecte ou URL expirée. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'DOCUMENT_NOT_FOUND : justificatif inexistant ou retiré.'
        '410':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'DOCUMENT_PURGED : le fichier a été supprimé du stockage.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Sert le justificatif déchiffré (URL signée, praticien propriétaire)
      tags:
      - Vérification du praticien
