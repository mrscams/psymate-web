  /api/patients/{id}/overview:
    get:
      description: 'Lit la projection patient_overview : faits clés, situations actives, tendance d''intensité (moyenne glissante sur 7 jours, 90 points au plus, repères de séances et de médicaments), émotions dominantes avec variation sur la fenêtre précédente, brouillons et séance ouverte. La fenêtre (window) borne la tendance et les émotions. Si la projection est en retard sur patient.clinical_rev, elle est recalculée et réécrite avant de répondre : la réponse n''est jamais obsolète. recentActivity (10 dernières entrées non archivées) est toujours lu en direct. Les entrées archivées sont exclues, les entrées privées du praticien incluses. Ajouts (M4-06, additifs) : narrative (résumé « En bref » de 5 phrases au plus, chacune omise si ses données manquent, rédigé par règles, sans IA, plus un point d''attention issu des drapeaux ; composé dans la langue de Accept-Language, français par défaut), feelings (un point par ressenti réel de la fenêtre, une série par émotion, repères de médicament et jours de séance), sinceLastSession (entrées postérieures à la dernière séance clôturée, 20 au plus) et recentSessions (5 dernières séances, la plus récente avec son compte rendu entier). Le client choisit la vue simple ou complète : la réponse porte tout.'
      operationId: getPatientOverview
      parameters:
      - description: Identifiant du patient
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Fenêtre de la tendance et des émotions : 30d, 90d (défaut) ou 12m'
        in: query
        name: window
        required: false
        schema:
          default: 90d
          enum:
          - 30d
          - 90d
          - 12m
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OverviewDto'
          description: Vue d'ensemble pour la fenêtre demandée
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Fenêtre invalide (errors[] par champ, code INVALID_WINDOW)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Le patient n'appartient pas au praticien courant
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Patient inconnu
      summary: Vue d'ensemble d'un patient
      tags:
      - overview
  /api/patients/{id}/restore:
    post:
      operationId: restorePatient
      parameters:
      - in: path
        name: id
