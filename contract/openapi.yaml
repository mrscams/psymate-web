          description: 'LINK_NOT_FOUND : lien inexistant.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'LINK_NOT_ACTIVE : le lien est déjà remplacé ou supprimé ; LINK_EXISTS : un lien actif de ce type existe déjà entre les mêmes entrées (y compris le type actuel), existingLinkId donne son identifiant ; ENTRY_ARCHIVED : une extrémité est archivée, errors[] porte le champ sourceId ou targetId.'
        '422':
          content:
