          description: Texte du contact, qui devient le compte rendu. Obligatoire.
          minLength: 1
          type: string
        modality:
          description: Modalité du contact. Obligatoire.
          enum:
          - phone
          - email
          example: phone
          minLength: 1
          pattern: phone|email
          type: string
        occurredFrom:
          description: Date-heure du contact, UTC ISO 8601. Obligatoire.
