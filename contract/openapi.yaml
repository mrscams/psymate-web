              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminDecisionDto'
          description: Décision enregistrée, avec le nouvel état de vérification du compte.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : corps absent ou JSON illisible (code propre à ce module).'
        '401':
