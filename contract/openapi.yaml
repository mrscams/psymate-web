servers:
- description: Serveur courant
  url: /
tags:
- description: Inscription, confirmation d'adresse e-mail, connexion par session à cookie, changement et réinitialisation du mot de passe, et état de la session du praticien.
  name: Authentification
- description: Activation, désactivation et codes de secours de la double authentification TOTP du praticien connecté.
  name: Double authentification
- description: 'Préférences d''affichage et de saisie du praticien connecté, mémorisées par compte : neuf clés plates, modifiées par merge-patch (RFC 7396).'
  name: Préférences
- description: 'Dossier professionnel du praticien connecté : justificatifs, informations professionnelles, soumission du dossier à l''examen de l''administration.'
  name: Vérification du praticien
- description: 'Fiches des patients du praticien : liste, création, modification versionnée, archivage, drapeaux et tags.'
  name: Patients
- description: 'Séances d''un patient : démarrage, clôture avec compte rendu, contact hors rendez-vous et séance courante. Une séance est une entrée de type session ; toute autre entrée appartient à une séance.'
  name: Séances
- description: 'Entrées cliniques d''un dossier patient : création dans une séance, lecture, correction versionnée (fenêtre de grâce de 1 h 15), historique des versions, archivage et restauration. Rien n''est supprimé physiquement.'
  name: Entrées
- description: 'Chronologie d''un patient : entrées triées de la plus récente à la plus ancienne avec pagination par curseur, facettes, situations en cours, et résumé par mois ou par année.'
  name: Chronologie
- description: 'Liens entre entrées d''un même patient : pose depuis une entrée, changement de type (versionné), suppression logique et liste des liens d''une entrée.'
  name: Liens
- description: 'Graphe des entrées liées d''un patient : voisinage d''une entrée ou du dossier, et développement d''un groupe de nœuds (super-nœud).'
  name: Graphe
- description: 'Synthèse clinique d''un patient : faits clés, tendance, émotions dominantes, résumé rédigé, séances récentes.'
  name: Vue d'ensemble
- description: Recherche plein texte, filtres et facettes dans les entrées du dossier d'un patient.
  name: Recherche
- description: 'Catalogues de référence en lecture seule : émotions, types d''entrées et types de liens.'
  name: Vocabulaire
- description: 'Tags libres du praticien, partagés entre ses patients et ses entrées : liste, création, renommage, fusion.'
  name: Tags
- description: 'Émotions personnalisées du praticien : création, renommage, fusion réversible pendant 30 jours.'
  name: Émotions personnelles
- description: Export du dossier d'un patient en fichier Markdown ou PDF, à remettre au patient ou à archiver.
  name: Export patient
- description: Export asynchrone de tous les patients d'un compte, y compris refusé ou suspendu (zip de fichiers Markdown et PDF, lien valable 7 jours).
  name: Export de compte
- description: Recours d'un praticien dont le compte est refusé ou suspendu (dépôt public, identifié par e-mail et mot de passe) et examen des recours par un administrateur avec double authentification active.
  name: Recours
- description: 'Profil public du praticien connecté dans l''annuaire : édition, photo, publication et dépublication.'
  name: Profil annuaire
- description: 'Listes fermées proposées pour remplir le profil d''annuaire : spécialités, publics, modalités et langues.'
  name: Vocabulaire de l'annuaire
- description: 'Annuaire public des praticiens publiés, sans authentification ni donnée patient : recherche filtrée et fiche d''un praticien.'
  name: Annuaire public
- description: 'Formulaire de contact de l''annuaire public : message d''un visiteur à un praticien publié, relayé par e-mail.'
  name: Contact public
- description: 'Validation des dossiers professionnels des praticiens par l''administration : file des dossiers à traiter, dossier détaillé, ouverture des justificatifs par URL signée, qualification des pièces et décision. Réservé aux administrateurs avec double authentification active.'
  name: 'Administration : vérifications'
- description: 'Gestion des comptes par l''administration : liste filtrable avec compteurs par statut, détail avec décisions et recours, suspension et réactivation manuelles. Réservé aux administrateurs avec double authentification active.'
  name: 'Administration : praticiens'
- description: Journal d'audit en lecture seule des décisions et événements de sécurité de l'administration (suspensions, décisions de dossier, recours, ouvertures de justificatifs). Réservé aux administrateurs avec double authentification active.
  name: 'Administration : journal'
- description: 'Gestion par l''administrateur des spécialités et des publics proposés dans l''annuaire : ajout, renommage, ordre et activation (jamais de suppression).'
  name: 'Administration : vocabulaire de l''annuaire'
