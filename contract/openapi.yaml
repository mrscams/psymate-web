  /api/patients:
    get:
      description: 'Session praticien ; ne renvoie que les patients de son cabinet. Par défaut les patients actifs ; archived=true renvoie uniquement les patients archivés. Le filtre q porte sur le nom affiché (insensible à la casse et aux accents), tag filtre sur un tag du praticien (un tag inconnu donne une liste vide). Pagination par curseur opaque : limit 50 par défaut, ramené à 1..200 ; nextCursor est null sur la dernière page.'
      operationId: listPatients
      parameters:
      - description: 'Filtre « contient » sur le nom affiché, insensible à la casse et aux accents ; les espaces multiples sont réduits. Vide ou absent : pas de filtre.'
        example: eloi
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: 'false (défaut) : patients actifs seulement ; true : patients archivés seulement.'
        example: false
        in: query
        name: archived
        required: false
        schema:
          default: false
          type: boolean
      - description: Libellé d'un tag du praticien ; ne renvoie que les patients qui le portent. Un libellé qui ne correspond à aucun tag donne une liste vide.
        example: sommeil
        in: query
        name: tag
        required: false
        schema:
          type: string
      - description: 'Ordre de tri : name (défaut, alphabétique sans accent ni casse), created (création décroissante) ou updated (dernière modification décroissante).'
        example: name
        in: query
        name: sort
        required: false
        schema:
          enum:
          - name
          - created
          - updated
          type: string
      - description: Curseur opaque lu dans nextCursor de la page précédente ; absent pour la première page.
        example: bzo1MA
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: 'Nombre maximal de patients par page : 50 par défaut ; une valeur hors de 1..200 est ramenée à la borne.'
        example: 50
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientPage'
          description: Page de patients.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED : paramètre invalide, errors[] {field, message} avec field = sort (valeur autre que name, created, updated) ou cursor (curseur illisible).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Liste les patients du praticien connecté
      tags:
      - Patients
    post:
      description: 'Session praticien ; le patient appartient au praticien connecté. Seul displayName est obligatoire. Des drapeaux (un par nature) et des tags existants peuvent être posés dès la création ; la fiche démarre à la version 1. La création est atomique : en cas d''erreur rien n''est enregistré. Réponse 201 avec la fiche complète.'
      operationId: createPatient
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientDto'
          description: Patient créé ; corps = fiche complète.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'FLAG_ALREADY_ACTIVE : la même nature de drapeau est présente deux fois.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED : errors[] {field, message} avec field = displayName (obligatoire), birthDate (future ou de plus de 120 ans), flags[i].kind (nature inconnue), flags[i].reason (obligatoire pour watch), tags[i] (libellé vide) ; TAG_IS_EMOTION : un libellé de tags correspond à une émotion ; TAG_UNKNOWN : un libellé de tags n''existe pas encore (créer le tag d''abord).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Crée un patient dans le cabinet du praticien
      tags:
      - Patients
  /api/patients/{id}:
    delete:
      description: 'Session praticien propriétaire du patient. Archivage logique : rien n''est supprimé, le patient disparaît de la liste par défaut (visible avec archived=true) et ses écritures sont refusées jusqu''à la restauration (POST /restore). Idempotent : archiver un patient déjà archivé renvoie aussi 204.'
