  /api/vocabulary/directory:
    get:
      description: Session praticien. Rend les spécialités et publics actifs (administrables), les modalités et les langues proposées ; les codes sont ceux à envoyer dans le profil (PUT /api/me/profile) et dans les filtres de l'annuaire public. Listes complètes, non paginées.
      operationId: get_1
      responses:
