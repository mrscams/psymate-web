          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ItemDto'
          description: Entrée créée.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'INVALID_BODY : corps JSON illisible (syntaxe ou type de champ invalide).'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VOCABULARY_EXISTS : ce code existe déjà pour ce type.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : INVALID_VALUE (kind absent ou autre que specialty ou audience), REQUIRED (code, labelFr), INVALID_FORMAT (code hors du format minuscule, chiffres et underscores, 2 à 40 caractères, commençant par une lettre), TOO_LONG (labelFr, labelEn au-delà de 120 caractères), OUT_OF_RANGE (sortOrder hors de 0 à 32767).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Ajoute une spécialité ou un public à l'annuaire
      tags:
      - 'Administration : vocabulaire de l''annuaire'
  /api/admin/vocabulary/directory/{kind}/{code}:
    patch:
      description: 'Admin avec double authentification active. Modification partielle : un champ absent reste inchangé, labelEn vide efface le libellé anglais. Une entrée désactivée disparaît de GET /api/vocabulary/directory et ne peut plus être choisie ni publiée ; on ne peut la désactiver que si aucune fiche publiée ne l''utilise. Le code et le type ne changent pas.'
      operationId: updateAdminDirectoryVocabulary
      parameters:
      - description: 'Type de l''entrée : specialty (spécialité) ou audience (public).'
        example: specialty
        in: path
        name: kind
        required: true
        schema:
          enum:
          - specialty
          - audience
          type: string
      - description: Code de l'entrée à modifier.
        example: anxiety
        in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ItemDto'
          description: Entrée mise à jour.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'INVALID_BODY : corps JSON illisible (syntaxe ou type de champ invalide).'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée. ADMIN_ROLE_REQUIRED : compte sans rôle admin ; TWO_FACTOR_REQUIRED : double authentification non activée sur le compte admin.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VOCABULARY_NOT_FOUND : type inconnu ou code inexistant pour ce type.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VOCABULARY_IN_USE : désactivation refusée, au moins une fiche publiée utilise ce code ; le champ usedByPublishedProfiles donne leur nombre.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : REQUIRED (labelFr vide), TOO_LONG (labelFr, labelEn au-delà de 120 caractères), OUT_OF_RANGE (sortOrder hors de 0 à 32767).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Modifie les libellés, le rang ou l'activation d'une entrée du vocabulaire
      tags:
      - 'Administration : vocabulaire de l''annuaire'
  /api/auth/email/change:
    post:
      description: 'Public : sans session, l''appelant prouve son identité par email + password. Réponse 202 dans tous les cas (compte inconnu, mot de passe faux, compte déjà confirmé, nouvelle adresse déjà prise, limite atteinte : aucune différence visible). Seul un compte en email_pending change d''adresse ; un nouveau lien de confirmation part à la nouvelle adresse (1 changement ou renvoi par minute, 5 par jour). Les mots de passe faux comptent dans le verrou e-mail + IP du login : 5 échecs, 423 pendant 15 min.'
      operationId: changeEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      responses:
        '202':
          description: Demande acceptée ; l'adresse n'est changée que si les conditions sont réunies.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] : INVALID_FIELD (email, password ou newEmail absent, newEmail mal formé, champ trop long).'
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ACCOUNT_LOCKED : verrouillage e-mail + IP après 5 mots de passe faux (15 min) ; retryAfterSeconds et en-tête Retry-After.'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai
              style: simple
      summary: Corrige l'adresse d'un compte non confirmé
      tags:
      - Authentification
  /api/auth/email/confirm:
    post:
      description: 'Public. Consomme le jeton reçu par e-mail (usage unique, valable 24 h) : le compte passe de email_pending à docs_pending, la confirmation est journalisée et une session est ouverte (cookie SESSION HttpOnly posé dans la réponse, 12 h d''inactivité). Un jeton déjà utilisé, expiré, inconnu ou remplacé par un renvoi donne 410.'
      operationId: confirmEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmRequest'
        required: true
      responses:
        '204':
          description: Adresse confirmée, session ouverte (cookie SESSION).
          headers:
            Set-Cookie:
              description: Cookie de session SESSION (HttpOnly, Secure, SameSite=Lax), à renvoyer sur les appels suivants.
              style: simple
        '410':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'TOKEN_INVALID_OR_EXPIRED : jeton inconnu, déjà utilisé, expiré ou remplacé.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] : INVALID_FIELD (token absent, vide ou de plus de 200 caractères).'
      summary: Confirme l'adresse e-mail et ouvre une session
      tags:
      - Authentification
  /api/auth/email/resend:
    post:
      description: 'Public. Réponse 202 identique que le compte existe ou non, qu''il soit déjà confirmé ou non, et que la limite soit atteinte : rien ne distingue un envoi réussi d''un refus silencieux. Seul un compte en email_pending reçoit un nouvel e-mail ; chaque renvoi invalide le lien précédent. Limites : 1 renvoi par minute et 5 par jour et par compte.'
      operationId: resendEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailResendRequest'
        required: true
      responses:
        '202':
          description: Demande acceptée ; un e-mail part seulement si le compte est à confirmer.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] : INVALID_FIELD (email absent, mal formé ou de plus de 254 caractères).'
      summary: Renvoie l'e-mail de confirmation (202 dans tous les cas)
      tags:
      - Authentification
  /api/auth/login:
    post:
      description: 'Public. Ouvre une session : cookie SESSION HttpOnly posé dans la réponse, valable 12 h d''inactivité, ou 30 jours avec rememberMe. Si la double authentification est active et que otp manque, réponse 202 {otpRequired: true} : renvoyer la requête avec otp (code TOTP ou code de secours). E-mail inconnu, mot de passe faux et code faux donnent la même réponse 401. Les états du compte (403) ne sont révélés qu''après un mot de passe correct. 5 échecs pour le même e-mail et la même IP : 423 pendant 15 min.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: Session ouverte ; le praticien connecté est renvoyé.
          headers:
            Set-Cookie:
              description: Cookie de session SESSION (HttpOnly, Secure, SameSite=Lax) ; Max-Age de 30 jours seulement avec rememberMe, sinon cookie de navigateur.
              style: simple
        '202':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OtpRequiredResponse'
          description: 'Mot de passe correct, 2FA active et otp absent : aucune session ouverte, renvoyer la requête avec otp.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'INVALID_CREDENTIALS : e-mail inconnu, mot de passe faux ou code 2FA faux (message unique).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse non confirmée ; ACCOUNT_SUSPENDED : compte refusé (rejected), suspendu (suspended) ou clos (closed), sessions révoquées (un recours via POST /api/me/appeal n''est possible que pour un compte refusé ou suspendu, pas pour un compte clos) ; PASSWORD_CHANGE_REQUIRED : mot de passe à usage unique à remplacer d''abord via POST /api/auth/password/change.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] : INVALID_FIELD (email ou password absent ou trop long, otp de plus de 32 caractères).'
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ACCOUNT_LOCKED : verrouillage après 5 échecs pour cet e-mail et cette IP (15 min) ; retryAfterSeconds et en-tête Retry-After.'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai
              style: simple
      summary: Connexion par e-mail et mot de passe (code 2FA si activée)
      tags:
      - Authentification
  /api/auth/logout:
    post:
      description: 'Public : répond 204 même sans session valide (idempotent). Invalide la session serveur portée par le cookie SESSION ; les autres appareils restent connectés.'
      operationId: logout
      responses:
        '204':
          description: Session fermée (ou déjà absente).
      summary: Ferme la session courante
      tags:
      - Authentification
  /api/auth/me:
    get:
      description: 'Session praticien, y compris tant que l''e-mail n''est pas confirmé. Renvoie les valeurs mémorisées dans la session, sans relire la base : le statut de vérification peut être en retard, utiliser GET /api/auth/session pour l''état à jour.'
      operationId: me
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: Praticien de la session courante.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Praticien connecté (identité, profession, statut de vérification)
      tags:
      - Authentification
  /api/auth/password-reset/confirm:
    post:
      description: 'Public. Consomme le jeton (usage unique, 30 minutes). Le jeton n''est consommé que si le nouveau mot de passe respecte la politique. Succès : mot de passe remplacé, obligation de changement d''un mot de passe à usage unique levée, toutes les sessions du compte révoquées ; aucune session n''est ouverte (se connecter via POST /api/auth/login).'
      operationId: confirmReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: Mot de passe remplacé, sessions révoquées.
        '410':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'TOKEN_INVALID_OR_EXPIRED : jeton inconnu, déjà utilisé, expiré ou remplacé.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PASSWORD_POLICY avec errors[] sur le champ password et les codes PASSWORD_TOO_SHORT, PASSWORD_CASE, PASSWORD_COMPROMISED, PASSWORD_CONTAINS_PERSONAL_DATA ; VALIDATION_FAILED avec errors[] : INVALID_FIELD (token ou password absent ou trop long).'
      summary: Définit un nouveau mot de passe à partir du lien reçu par e-mail
      tags:
      - Authentification
  /api/auth/password-reset/request:
    post:
      description: 'Public. Réponse 202 identique que l''adresse corresponde à un compte ou non : elle ne révèle jamais l''existence du compte. Si le compte existe, un e-mail contient un lien à usage unique valable 30 minutes ; une nouvelle demande invalide le lien précédent.'
      operationId: requestReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: Demande acceptée ; un e-mail part seulement si le compte existe.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] : INVALID_FIELD (email absent, mal formé ou de plus de 254 caractères).'
      summary: Demande un lien de réinitialisation du mot de passe (202 dans tous les cas)
      tags:
      - Authentification
  /api/auth/password/change:
    post:
      description: 'Public, sans session : email + currentPassword prouvent l''identité (+ otp si la 2FA est active ; s''il manque, 202 {otpRequired: true}). Sert notamment à remplacer le mot de passe à usage unique d''un compte de bootstrap (403 PASSWORD_CHANGE_REQUIRED au login). Les contrôles du nouveau mot de passe qui ne dépendent que de la requête (longueur, casse, mots de passe courants, e-mail, identique à l''actuel) passent avant les identifiants : ces 422 ne consomment ni code 2FA ni essai ; le contrôle du prénom et du nom (PASSWORD_CONTAINS_PERSONAL_DATA) n''a lieu qu''après, le code 2FA peut alors être consommé. Succès : toutes les sessions du compte sont révoquées, aucune n''est ouverte (se reconnecter via POST /api/auth/login). Mêmes refus 403 et même verrou 423 que le login (5 échecs, 15 min).'
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '202':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OtpRequiredResponse'
          description: Mot de passe actuel correct, 2FA active et code manquant.
        '204':
          content:
            '*/*':
              schema:
                type: object
          description: Mot de passe changé, sessions révoquées, aucune session ouverte.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'INVALID_CREDENTIALS : e-mail inconnu, mot de passe actuel faux ou code 2FA faux (message unique).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'EMAIL_NOT_CONFIRMED : adresse non confirmée ; ACCOUNT_SUSPENDED : compte refusé, suspendu ou clos.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PASSWORD_POLICY avec errors[] sur le champ password et les codes PASSWORD_TOO_SHORT, PASSWORD_CASE, PASSWORD_COMPROMISED, PASSWORD_CONTAINS_PERSONAL_DATA ; VALIDATION_FAILED avec errors[] : PASSWORD_UNCHANGED (newPassword identique au mot de passe actuel), INVALID_FIELD (champ du corps absent ou trop long).'
        '423':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ACCOUNT_LOCKED : verrouillage après 5 échecs pour cet e-mail et cette IP (15 min) ; retryAfterSeconds et en-tête Retry-After.'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai
              style: simple
      summary: 'Change le mot de passe (public : e-mail + mot de passe actuel)'
      tags:
      - Authentification
  /api/auth/register:
    post:
      description: 'Public, sans session. Crée un compte au statut email_pending et envoie un e-mail de confirmation (lien valable 24 h) ; la réponse est identique que l''adresse soit déjà inscrite ou non (anti-énumération : dans ce cas l''adresse reçoit un e-mail « compte existant »). Aucune session n''est ouverte : confirmer l''adresse via POST /api/auth/email/confirm. Les consentements CGU et confidentialité (consents) sont obligatoires et consignés. Langue des e-mails : en-tête Accept-Language (anglais si préféré, français sinon).'
      operationId: register
      parameters:
      - description: 'Langue des e-mails envoyés : en si la langue préférée est l''anglais, fr sinon (ou si l''en-tête est absent).'
        example: fr-FR,fr;q=0.9
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: 'Inscription enregistrée (ou adresse déjà connue : réponse identique), e-mail envoyé.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : INVALID_FIELD (champ du corps absent, trop long, e-mail mal formé, profession hors liste, consents.terms ou consents.privacy différent de true), PHONE_INVALID (phone), ADDRESS_REQUIRED (address, sauf remoteOnly), REQUIRED (address.street, address.city), POSTAL_CODE_INVALID (address.postalCode) ; PASSWORD_POLICY avec errors[] sur le champ password et les codes PASSWORD_TOO_SHORT, PASSWORD_CASE, PASSWORD_COMPROMISED, PASSWORD_CONTAINS_PERSONAL_DATA.'
      summary: Inscription d'un praticien (ouverte, sans code d'invitation)
      tags:
      - Authentification
  /api/auth/session:
    get:
      description: 'Session praticien, y compris tant que l''e-mail n''est pas confirmé. Relit le compte en base : si le statut de vérification ou l''adresse e-mail ont changé depuis l''ouverture de la session (confirmation depuis un autre navigateur, décision d''un administrateur), la session est rafraîchie. emailConfirmed vaut false tant que le statut est email_pending.'
      operationId: session
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: État à jour de la session.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué) ; INVALID_CREDENTIALS : le compte de la session n''existe plus.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: État courant de la session (statut de vérification à jour)
      tags:
      - Authentification
  /api/auth/sessions/revoke-others:
    post:
      description: Session praticien. Supprime les sessions du compte autres que celle qui porte l'appel et consigne l'opération (session_revoked). Renvoie le nombre de sessions révoquées, 0 s'il n'y en avait pas d'autre.
      operationId: revokeOtherSessions
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RevokedSessionsResponse'
          description: Autres sessions révoquées ; revoked = leur nombre.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Déconnecte tous les autres appareils (la session courante est conservée)
      tags:
      - Authentification
  /api/auth/signup:
    post:
      deprecated: true
      description: Même contrat, mêmes codes et mêmes effets que POST /api/auth/register ; utiliser /api/auth/register.
      operationId: signup
      parameters:
      - description: 'Langue des e-mails envoyés : en si la langue préférée est l''anglais, fr sinon (ou si l''en-tête est absent).'
        example: fr-FR,fr;q=0.9
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: 'Inscription enregistrée (ou adresse déjà connue : réponse identique), e-mail envoyé.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : INVALID_FIELD (champ du corps absent, trop long, e-mail mal formé, profession hors liste, consents.terms ou consents.privacy différent de true), PHONE_INVALID (phone), ADDRESS_REQUIRED (address, sauf remoteOnly), REQUIRED (address.street, address.city), POSTAL_CODE_INVALID (address.postalCode) ; PASSWORD_POLICY avec errors[] sur le champ password et les codes PASSWORD_TOO_SHORT, PASSWORD_CASE, PASSWORD_COMPROMISED, PASSWORD_CONTAINS_PERSONAL_DATA.'
      summary: Alias déprécié de l'inscription d'un praticien
      tags:
      - Authentification
  /api/entries/{id}:
    delete:
      description: 'Session praticien, propriétaire du patient de l''entrée. Suppression logique : l''entrée reste lisible (archivedAt) et restaurable, mais sort de la chronologie, de l''export et des corrections. Idempotent : archiver une entrée déjà archivée renvoie aussi 204.'
      operationId: archiveEntry
      parameters:
      - description: Identifiant de l'entrée.
        example: 3f8e2b1a-6c4d-4e57-9a0b-1d2c3e4f5a6b
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Entrée archivée (ou déjà archivée).
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : identifiant de l''entrée qui n''est pas un UUID.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : l''entrée appartient au dossier d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ENTRY_NOT_FOUND : entrée inexistante.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Archive une entrée sans la supprimer physiquement
      tags:
      - Entrées
    get:
      description: 'Session praticien, propriétaire du patient de l''entrée. Une entrée archivée reste lisible (archivedAt renseigné). Les liens ne sont pas inclus (links est null) : voir GET /api/entries/{id}/links. authorType est en lecture seule.'
      operationId: getEntry
      parameters:
      - description: Identifiant de l'entrée.
        example: 3f8e2b1a-6c4d-4e57-9a0b-1d2c3e4f5a6b
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntryDto'
          description: Entrée complète.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : identifiant de l''entrée qui n''est pas un UUID.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : l''entrée appartient au dossier d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ENTRY_NOT_FOUND : entrée inexistante.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Lit une entrée avec sa version courante, son détail et ses tags
      tags:
      - Entrées
    patch:
      description: 'Session praticien, propriétaire du patient de l''entrée. Les champs absents sont inchangés ; occurred et tags sont remplacés en entier, les détails fusionnés champ par champ. Règle de grâce de 1 h 15 après la création : même auteur, entrée sans lien ni autre version, la modification est faite en place (pas de nouvelle version) ; sinon une nouvelle version est créée (reason conservé). Un changement de tags seul ou sans effet ne crée jamais de version. Une entrée archivée ne se corrige pas. authorType, submissionId et links sont refusés.'
      operationId: patchEntry
      parameters:
      - description: Identifiant de l'entrée.
        example: 3f8e2b1a-6c4d-4e57-9a0b-1d2c3e4f5a6b
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEntryRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntryDto'
          description: Entrée corrigée, version courante à jour.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : identifiant de l''entrée qui n''est pas un UUID, ou corps JSON illisible.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : l''entrée appartient au dossier d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ENTRY_NOT_FOUND : entrée inexistante.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ENTRY_ARCHIVED : l''entrée est archivée, la restaurer d''abord.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message}. Codes : REQUIRED (titre d''un event ou d''une situation, texte d''une note, champ minimal du détail), OUT_OF_RANGE, INVALID_VALUE (status, visibility, occurred.precision), INVALID_FORMAT (date ou UUID illisible), INVALID_TIME (occurred.to avant occurred.from), UNKNOWN_EMOTION (feeling.emotionCode), UNKNOWN_TAG (tags[i]), UNKNOWN_FIELD (authorType ou submissionId envoyé), NOT_SUPPORTED_ON_PATCH (links envoyé), DETAIL_NOT_ALLOWED (détail d''un autre type que l''entrée). Code racine INVALID_TIME, errors[0].field = occurred : période sans libellé ou sans fin, phase de vie inconnue ou patient sans date de naissance.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Corrige une entrée par une nouvelle version ou en place pendant la grâce
      tags:
      - Entrées
  /api/entries/{id}/links:
    get:
      description: Session praticien propriétaire du patient de l'entrée. Rend les liens acceptés dont l'entrée est source ou cible, du plus ancien au plus récent (createdAt, puis id), chacun avec label et sentence vus depuis cette entrée (verbe inverse quand elle est la cible d'un lien dirigé), dans la langue Accept-Language (fr par défaut). Les liens remplacés ou supprimés n'y figurent pas. Liste complète, non paginée, vide si l'entrée n'a pas de lien.
      operationId: listEntryLinks
      parameters:
      - description: Identifiant de l'entrée dont on liste les liens.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/LinkDto'
                type: array
          description: Liens acceptés de l'entrée (tableau, éventuellement vide).
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : l''entrée appartient à un patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ENTRY_NOT_FOUND : entrée inexistante.'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Liste les liens acceptés d'une entrée
      tags:
      - Liens
    post:
      description: 'Session praticien propriétaire du patient des deux entrées. Le lien est créé avec la provenance manual et le statut accepted (non modifiables). direction (outgoing par défaut) place l''entrée de l''URL comme source (outgoing) ou comme cible (incoming) ; la réponse est le lien vu depuis cette entrée (label et sentence dans la langue Accept-Language, fr par défaut). Les deux entrées doivent être du même patient et non archivées, et le type autorisé pour le couple (type source, type cible) par le catalogue GET /api/vocabulary/link-types. Un lien actif identique (mêmes extrémités et même type, sens indifférent pour un type symétrique) est refusé. Limite : rationale 500 caractères au plus. Réponse 201 avec Location.'
      operationId: createLink
      parameters:
      - description: Identifiant de l'entrée ouverte, dont le lien est vu.
        example: 9b4c0c7e-3c1a-4f2e-9d6a-2a4d6f8b1c3e
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LinkDto'
          description: Lien créé ; en-tête Location = /api/links/{id}.
          headers:
            Location:
              description: URI du lien créé, /api/links/{id}.
              style: simple
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'MALFORMED_REQUEST : corps JSON illisible sans champ identifiable.'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'UNAUTHENTICATED : aucune session valide (cookie absent, expiré ou révoqué).'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_FORBIDDEN : une des deux entrées appartient à un patient d''un autre praticien. EMAIL_NOT_CONFIRMED : adresse e-mail du compte non confirmée.'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'ENTRY_NOT_FOUND : l''entrée de l''URL ou la cible targetId n''existe pas.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'LINK_EXISTS : un lien actif identique existe déjà, existingLinkId donne son identifiant ; ENTRY_ARCHIVED : une extrémité est archivée, errors[] porte le champ sourceId ou targetId.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED avec errors[] {field, code, message} ; codes de champ : REQUIRED (targetId, linkType), INVALID_VALUE (direction autre que incoming ou outgoing), OUT_OF_RANGE (rationale de plus de 500 caractères), INVALID_FORMAT (targetId qui n''est pas un UUID) ; SELF_LINK (targetId : même entrée que celle de l''URL) ; DIFFERENT_PATIENT (targetId : entrée d''un autre patient) ; UNKNOWN_LINK_TYPE (linkType absent du catalogue ou inactif) ; LINK_TYPE_NOT_ALLOWED (linkType interdit pour ce couple de types d''entrées : allowedLinkTypes[] {code, label} liste les types possibles, vide si aucun).'
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'RATE_LIMITED : limite de débit atteinte (en-tête Retry-After et champ retryAfterSeconds, en secondes).'
          headers:
            Retry-After:
              description: Secondes avant nouvel essai.
              schema:
                format: int32
                type: integer
      summary: Pose un lien manuel entre l'entrée ouverte et une autre entrée du même patient
      tags:
      - Liens
