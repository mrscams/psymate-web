        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_NOT_FOUND : aucun patient avec cet identifiant.'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'PATIENT_ARCHIVED : patient archivé, restaurer d''abord.'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'VALIDATION_FAILED : errors[] {field, message} avec field = nom de la clé inconnue ou non modifiable, displayName (vide), birthDate (format invalide, future ou de plus de 120 ans), context ou followUp (objet attendu).'
        '429':
          content:
            application/problem+json:
